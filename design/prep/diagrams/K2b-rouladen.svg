<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K2b  Rouladen without a hand: dealer roller, apron roll, raft</text>
<text x="24" y="58" class="m">Slices are dealt by a knurled roller on the roll axis, rolled by drawing a cloth apron over them, held by a raft for searing.</text>
<text x="1576" y="28" class="s r b">dealer roller (GA-24) on the roll axis · peel GA-01 lifts slices</text>
<text x="1576" y="47" class="s r">apron with T45 hem bar and plough rails (side folds 15 mm), 2 slices per pass</text>
<text x="1576" y="66" class="s r">raft: tines 6 × 1.5, 60 apart, pushed in X through the cradle (30–60 N)</text>
<text x="1576" y="85" class="s r">sear 90 s seam down in PN 1, 200 °C · braise 90 min on H1, lidded</text>
<rect x="30" y="96" width="500" height="740" fill="#ffffff" stroke="#c4cad1" stroke-width="1" rx="8"/>
<rect x="550" y="96" width="500" height="740" fill="#ffffff" stroke="#c4cad1" stroke-width="1" rx="8"/>
<rect x="1070" y="96" width="500" height="740" fill="#ffffff" stroke="#c4cad1" stroke-width="1" rx="8"/>
