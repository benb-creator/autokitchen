<g><animateTransform attributeName="transform" type="translate" values="1000 478;1000 478;960 472.5;920 467;880 461.5;840 456;800 450.5;760 445;720 439.5;680 434;680 434" keyTimes="0.0000;0.2500;0.2812;0.3125;0.3438;0.3750;0.4062;0.4375;0.4688;0.5000;1.0000" dur="24s" repeatCount="indefinite"/><rect x="-14" y="-6" width="28" height="12" fill="#9aa1a8" stroke="#3a3f45" stroke-width="1.5"/><rect x="-26" y="-12" width="10" height="24" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/><rect x="16" y="-12" width="10" height="24" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/></g>
<text x="566" y="200" class="s">the Wender takes the hem bar by its T45</text>
<text x="566" y="218" class="s">neck and draws it over the slices in an</text>
<text x="566" y="236" class="s">X–Z arc (cloth method, as a sushi mat)</text>
<text x="566" y="270" class="s">the plough rails fold both long edges</text>
<text x="566" y="288" class="s">in by 15 mm as the roll forms; the camera</text>
<text x="566" y="306" class="s">stops when the measured length is wound</text>
<text x="566" y="660" class="s">filled first: mustard by spoon, the last 35 mm of</text>
<text x="566" y="678" class="s">the flap left free, salted and floured; bacon,</text>
<text x="566" y="696" class="s">onion, gherkin strips placed by the tongs</text>
<text x="566" y="728" class="s">the rolls tip seam-down into the comb cradle,</text>
<text x="566" y="746" class="s">flap at 5 o'clock</text>
<text x="1086" y="120" class="s b">RAFT: pushed in X, seared, stripped off</text>
<rect x="1110" y="234" width="420" height="18" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1.5"/>
<text x="1320" y="272" class="s c">comb cradle (stays)</text>
