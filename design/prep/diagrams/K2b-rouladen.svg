<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0417;0.1250" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="70" y="300" class="s">the roller turns at surface speed and</text><text x="70" y="318" class="s">pushes the top slice over the pack edge</text></g>
<text x="70" y="640" class="s">butcher-cut slices, shingled or interleaved;</text>
<text x="70" y="658" class="s">θ of T sets the slice orientation</text>
<text x="70" y="690" class="s">flattening if needed: rolling pin through a</text>
<text x="70" y="708" class="s">silicone sheet, 2 N/mm line load</text>
<text x="566" y="120" class="s b">ROLLING: the hem bar draws the apron over</text>
<rect x="580" y="560" width="450" height="20" fill="#eef3f8" stroke="#8fa8c0" stroke-width="2"/>
<text x="805" y="604" class="s c">apron tray (GN 1/2-20) on the board carrier</text>
<rect x="580" y="544" width="450" height="6" fill="#c4cad1" stroke="#9aa1a8" stroke-width="1"/>
<text x="1030" y="538" class="s r">plough rail (side folds)</text>
