<!-- K2b Rouladen chain. Source: K2b-vessel-stack-inversion.md sections 2.6 (fixtures), 3.1 (principle 3), 3.4. Side views, schematic. Unclear point: the raft handle is a T45 stem at its +X end and the roll axis is y, so "roll 180 deg about the handle" swings the raft end over end (about its length, ≈ 250 mm), more than the 100 mm lift; drawn as a turn about the raft centre with a higher lift. -->
