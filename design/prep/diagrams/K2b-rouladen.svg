<text x="1300" y="692" class="s c">PN 1 on H1, 20 mL fat, 200 °C</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.6917" dur="24s" calcMode="discrete" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 206;0 206;0 630;0 630;0 440;0 440;0 630;0 630;0 206;0 206" keyTimes="0.0000;0.6917;0.7333;0.7917;0.8167;0.8500;0.8750;0.9167;0.9417;1.0000" dur="24s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0 1325 0;0 1325 0;180 1325 0;180 1325 0" keyTimes="0.0000;0.8167;0.8500;1.0000" dur="24s" repeatCount="indefinite"/><line x1="1160" y1="0" x2="1450" y2="0" stroke="#9aa1a8" stroke-width="3"/><circle cx="1190" cy="0" r="24" fill="#b85a4a" stroke="#3a3f45" stroke-width="2"/><path d="M1190 24 a24 24 0 0 1 0 -48" fill="none" stroke="#6b3020" stroke-width="7"/><circle cx="1265" cy="0" r="24" fill="#b85a4a" stroke="#3a3f45" stroke-width="2"/><path d="M1265 24 a24 24 0 0 1 0 -48" fill="none" stroke="#6b3020" stroke-width="7"/><circle cx="1340" cy="0" r="24" fill="#b85a4a" stroke="#3a3f45" stroke-width="2"/><path d="M1340 24 a24 24 0 0 1 0 -48" fill="none" stroke="#6b3020" stroke-width="7"/><circle cx="1415" cy="0" r="24" fill="#b85a4a" stroke="#3a3f45" stroke-width="2"/><path d="M1415 24 a24 24 0 0 1 0 -48" fill="none" stroke="#6b3020" stroke-width="7"/><line x1="1450" y1="0" x2="1490" y2="0" stroke="#3a3f45" stroke-width="4"/><circle cx="1495" cy="0" r="9" fill="#b4bac1" stroke="#3a3f45" stroke-width="1.5"/></g></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7333;0.8167" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="1100" y="420" class="s">seam down, 90 s untouched</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8167;0.8750" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="1100" y="420" class="s b" style="fill:#c0661a">lift, roll 180°:</text><text x="1100" y="438" class="s b" style="fill:#c0661a">second face</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.8750" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="1100" y="420" class="s">fond, wine, stock; braise 90 min lidded;</text><text x="1100" y="438" class="s">serve: a stripper comb pushes the rolls</text><text x="1100" y="456" class="s">off one by one onto the plate, seam down</text></g>
<text x="1100" y="740" class="s">fallback: single pins set by the tongs</text>
<text x="1100" y="758" class="s">through the cradle notches, counted by camera</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2500" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/4</tspan>  Dealing: a knurled roller on the roll axis turns at surface speed and pushes the top slice off the pack onto the peel</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.5833" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/4</tspan>  Rolling: the jaws draw the apron's hem bar over the filled slices; the plough rails fold the edges in; the roll forms like in a sushi mat</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5833;0.6917" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/4</tspan>  Securing: the two-tine raft is pushed in X through the cradle's guide slots and through all four rolls</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.6917" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/4</tspan>  Searing: the raft is laid seam down in PN 1; after 90 s it is lifted and turned over by the roll; then fond, deglaze, braise</text></g>
