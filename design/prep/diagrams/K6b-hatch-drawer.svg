<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.1667;0.3542;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/5</tspan>  Plating: food is placed on the plates; the green lamp lights when they are ready</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.3542;0.5833;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/5</tspan>  Serve: the gantry is locked out, the flap opens, the diner pulls the drawer out and takes the plates</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5833;0.7500;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/5</tspan>  Return: after the meal the diner slots the dirty plates into the carrier in the drawer and pushes it in</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.7500;1.0000" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">5/5</tspan>  Wash: the carrier is scraped and pre-rinsed over the hopper, washed in the well with the ware, and stored</text></g>
