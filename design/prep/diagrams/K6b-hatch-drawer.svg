<text x="24" y="34" class="l b">K6b  HATCH DRAWER — serving and dish return through one drawer</text>
<text x="24" y="58" class="m">Plates are filled in a heated drawer; the diner pulls it out through a flap in the door; dirty dishes come back the same way.</text>
<text x="1576" y="28" class="s r b">drawer 280 × 520 at deck level, heated base 60 °C, 2 plates Ø ≤ 270</text>
<text x="1576" y="47" class="s r">4 persons: two drawer cycles within 3 min (SRV-009)</text>
<text x="1576" y="66" class="s r">gantry locked out while the drawer is open (solenoid interlock)</text>
<text x="1576" y="85" class="s r">dishes washed in the same well as the ware — no second washer</text>
<rect x="30" y="92" width="900" height="752" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="42" y="116" class="m b">Side section through zone A (front door left)</text>
<text x="42" y="814" class="s">The drawer pulls out to the front only when the gantry is locked out. Clean plates come</text>
<text x="42" y="832" class="s">from the dish cabinet above; dirty plates go back into a carrier standing in the drawer.</text>
