<text x="1271" y="367" class="s c">heated base 60 °C · pulls out towards the diner ↓</text>
<rect x="946" y="468" width="630" height="376" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="958" y="492" class="m b">Dish return</text>
<rect x="960" y="518" width="600" height="44" rx="6" fill="#fde3c8" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.6042;0.7250;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="972" y="546" class="s">1  diner slots plates into the carrier in the drawer, cutlery into the basket</text>
<rect x="960" y="574" width="600" height="44" rx="6" fill="#fde3c8" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.7250;0.7917;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="972" y="602" class="s">2  chuck takes the carrier by its tang; scraps tipped into the hopper</text>
<rect x="960" y="630" width="600" height="44" rx="6" fill="#fde3c8" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.7917;0.8750;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="972" y="658" class="s">3  pre-rinse over the hopper (fan nozzles), scraps to the bio bin</text>
<rect x="960" y="686" width="600" height="44" rx="6" fill="#fde3c8" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.8750;0.9583;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="972" y="714" class="s">4  carrier hangs in the well comb: washed with the ware, ≥ 82 °C rinse</text>
<rect x="960" y="742" width="600" height="44" rx="6" fill="#fde3c8" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.9583;1.0000" dur="24s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="972" y="770" class="s">5  dried, checked, back to the dish cabinet</text>
