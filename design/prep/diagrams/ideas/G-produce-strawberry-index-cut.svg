<text x="760" y="715" class="s h c">hulled</text>
<text x="80" y="780" class="s h">cap cut 4–5 mm below the calyx · 3–4 s per piece · 500 g = 25–30 berries ≈ 2 min · loss 8–12 %</text>
<text x="80" y="800" class="s h">variant: the Ø 14 tube of the corer family plunged 8 mm (hull + core), loss 4–6 %</text>
<rect x="900" y="100" width="670" height="250" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="920" y="130" class="m b">GP-101  First: is the trim needed at all?</text>
<text x="920" y="165" class="s b">mushrooms (10 meals)</text><text x="1110" y="165" class="s">no trim: stem end is edible, slice whole</text>
<text x="920" y="195" class="s b">radish</text><text x="1110" y="195" class="s">buy topped; the tail stays</text>
<text x="920" y="225" class="s b">Brussels sprouts</text><text x="1110" y="225" class="s">no base trim; loose leaves come off in the wash</text>
<text x="920" y="255" class="s b">green beans (4)</text><text x="1110" y="255" class="s">buy frozen, trimmed</text>
<text x="920" y="285" class="s b">strawberries (2–3)</text><text x="1110" y="285" class="s">must be hulled → GP-102 (left)</text>
<text x="920" y="335" class="s">10 of the 18 small-item meals need no mechanism — a recipe rule.</text>
<rect x="900" y="370" width="670" height="440" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="920" y="400" class="m b">GP-103  Snipper drum for fresh beans (kept on file)</text>
<circle cx="1130" cy="600" r="168" fill="none" stroke="#d0d4d9" stroke-width="3"/>
<text x="980" y="790" class="s h">fixed shell = waste pan</text>
