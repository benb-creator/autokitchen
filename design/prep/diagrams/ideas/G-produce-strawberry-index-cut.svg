<text x="24" y="36" class="xl b">GP-102  Trim small items: camera-indexed single cut</text>
<text x="24" y="62" class="m">Most small-item trims are dropped by rule; strawberries are hulled by pushing each calyx to a fixed blade.</text>
<text x="1576" y="30" class="s r b">G-produce · G10 trim small items (recommended)</text>
<text x="1576" y="49" class="s r">GP-101 rules: H · GP-102 cut: M–H</text>
<text x="1576" y="68" class="s r">cut force 5–15 N · ≤ 40 pieces per batch</text>
<text x="1576" y="87" class="s r">beans: bought frozen (GP-103 on file)</text>
