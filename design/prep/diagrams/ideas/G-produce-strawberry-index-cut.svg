<text x="1302" y="660" class="s h">bean ends poking through</text>
<text x="1302" y="678" class="s h">6 × 12 mm slots are cut off</text>
<text x="1302" y="718" class="s h">30–40 rpm · 500 g in 2–3 min</text>
<text x="1302" y="736" class="s h">85–92 % of ends · not built:</text>
<text x="1302" y="754" class="s h">3 custom parts for 4 meals</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/4</tspan>  Strawberries lie on a white board; the camera finds each green calyx and which way it points.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.16364;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/4</tspan>  The manipulator pushes and turns the berry until the calyx overhangs the board edge.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.16364;0.29091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/4</tspan>  One cut 4–5 mm below the calyx; the cap falls into the waste, the berry goes to the bowl.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.29091;0.44545;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/4</tspan>  Next berry: find, push, cut — 3–4 s per piece, fine up to about 40 pieces.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.44545;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
