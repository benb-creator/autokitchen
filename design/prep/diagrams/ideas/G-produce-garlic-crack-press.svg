<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GP-17  Garlic: crack the bulb, press the cloves skin-on</text>
<text x="24" y="62" class="m">The skin never has to be removed from the clove: the press keeps it back as a cake that is knocked out.</text>
<text x="1576" y="30" class="s r b">G-produce · G1 garlic (recommended, conf. H)</text>
<text x="1576" y="49" class="s r">crack 60–120 N between two plates</text>
<text x="1576" y="68" class="s r">press 150–300 N on Ø 30 cup (2–4 bar), 3 mm holes</text>
<text x="1576" y="87" class="s r">residue 10–20 % of the clove · 5 s per batch</text>
<text x="70" y="130" class="m b">1  CRACK the bulb</text>
<rect x="130" y="600" width="340" height="22" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/>
<text x="300" y="645" class="s h c">fixed plate</text>
