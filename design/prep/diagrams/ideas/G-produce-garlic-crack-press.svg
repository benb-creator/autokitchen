<text x="790" y="730" class="s h c">crushed garlic</text>
<text x="1110" y="130" class="m b">3  KNOCK OUT the skins</text>
<g><path d="M1232,560 L1232,320 L1388,320 L1388,560" fill="#eef2f6" stroke="#3a3f45" stroke-width="3"/><rect x="1232" y="314" width="156" height="10" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5"/><rect x="1240" y="314" width="8" height="10" fill="#fff"/><rect x="1257" y="314" width="8" height="10" fill="#fff"/><rect x="1274" y="314" width="8" height="10" fill="#fff"/><rect x="1291" y="314" width="8" height="10" fill="#fff"/><rect x="1308" y="314" width="8" height="10" fill="#fff"/><rect x="1325" y="314" width="8" height="10" fill="#fff"/><rect x="1342" y="314" width="8" height="10" fill="#fff"/><rect x="1359" y="314" width="8" height="10" fill="#fff"/><rect x="1376" y="314" width="8" height="10" fill="#fff"/></g>
