<text x="1310" y="790" class="s h c">bio-waste</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/4</tspan>  Crack: the bulb is crushed flat-side down between two plates (60–120 N) and falls apart into cloves and loose skins.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.26;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/4</tspan>  Press: the cloves go skin-on into the Ø 30 cup; the piston pushes the flesh out through the 3 mm holes.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.26;0.61;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/4</tspan>  Knock out: the skins stay behind as a cake; cup inverted over waste, the stud follower pushes it out.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.61;0.85;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/4</tspan>  Result: crushed garlic — what almost all garlic meals use. No peeling and no camera needed.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.85;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
