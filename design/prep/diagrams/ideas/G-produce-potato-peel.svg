<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GP-P1 / P2  Potato and carrot: route by recipe, then a camera-stopped drum</text>
<text x="24" y="62" class="m">Most dishes do not need raw peeling; for the rest the drum stops when the camera sees the skin is gone.</text>
<text x="1576" y="30" class="s r b">G-produce · potato, carrot (recommended)</text>
<text x="1576" y="49" class="s r">GP-P1 routing: H · GP-P2 drum: M–H</text>
<text x="1576" y="68" class="s r">PRP-022: ≤ 5 % skin, loss ≤ 25 %</text>
<text x="1576" y="87" class="s r">fallback: vacuum-peeled potatoes</text>
<rect x="30" y="100" width="600" height="715" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="50" y="132" class="l b">GP-P1  Route by recipe first</text>
<text x="50" y="154" class="s">most dishes never need a raw-peeled potato (≈ 50 of 60 meals)</text>
<rect x="50" y="168" width="560" height="52" rx="6" fill="#fff" stroke="#c9ced4"/>
<text x="64" y="190" class="s b">mash, boiled, salad, Bratkartoffeln, dumplings</text><text x="64" y="210" class="s">→ cook in skin → slip in a rubber-stud tumble</text>
<rect x="50" y="230" width="560" height="52" rx="6" fill="#fff" stroke="#c9ced4"/>
<text x="64" y="252" class="s b">wedges, oven fries, new potatoes, all carrots</text><text x="64" y="272" class="s">→ scrub, skin-on (loss 0–1 %)</text>
<rect x="50" y="292" width="560" height="52" rx="6" fill="#fff" stroke="#c9ced4"/>
<text x="64" y="314" class="s b">gratin, raw-grated (Puffer, Rösti), peeled fries</text><text x="64" y="334" class="s">→ raw peel → GP-P2 drum (right)</text>
<text x="50" y="410" class="m b">Cooked in skin, then slipped (30–60 s, with water)</text>
