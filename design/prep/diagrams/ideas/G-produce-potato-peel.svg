<text x="1220" y="380" class="m b">camera: brown share visible</text>
<rect x="1220" y="395" width="300" height="24" fill="#fff" stroke="#3a3f45" stroke-width="2"/>
<rect x="1220" y="395" width="300" height="24" fill="#9c6b3a"><animate attributeName="width" values="300;300;12;12;300;300" keyTimes="0;0.35417;0.8125;0.95833;0.99167;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></rect>
<line x1="1235" y1="388" x2="1235" y2="426" stroke="#e04a3a" stroke-width="3"/>
<text x="1235" y="446" class="s h c">stop &lt; 5 %</text>
<text x="1220" y="490" class="m b">load cell: loss by weight</text>
<rect x="1220" y="505" width="300" height="24" fill="#fff" stroke="#3a3f45" stroke-width="2"/>
<rect x="1220" y="505" width="0" height="24" fill="#f2dc8a"><animate attributeName="width" values="0;0;210;210;0;0" keyTimes="0;0.35417;0.8125;0.95833;0.99167;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></rect>
<line x1="1520" y1="498" x2="1520" y2="536" stroke="#e04a3a" stroke-width="3"/>
<text x="1520" y="556" class="s h r">or stop at 20 %</text>
<g><rect x="1220" y="590" width="300" height="50" rx="8" fill="#e04a3a"/><text x="1370" y="622" class="l b c" style="fill:#fff">STOP — 14 % loss</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.8125;0.97917;0.99167;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="1220" y="680" class="s h">loss 10–18 % instead of 25 % with a fixed timer</text>
<text x="1220" y="698" class="s h">eyes stay: ~1.3 % of the surface, within PRP-022</text>
<text x="1220" y="716" class="s h">60–150 s per batch</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/4</tspan>  Rule first: cook in the skin and slip the skin off, or scrub skin-on — that covers about 50 of 60 meals.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.33333;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/4</tspan>  Raw-peeled dishes only: the batch tumbles on a spinning knurled steel disc under a water spray.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.33333;0.5;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/4</tspan>  The camera watches the brown share fall; the load cell weighs what has been ground away.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.8125;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/4</tspan>  Stop as soon as &lt; 5 % brown is visible (or 20 % loss): no fixed timer, no over-peeling.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8125;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="40" y="884" width="1520" height="4" fill="#e6e8eb"/><rect x="40" y="884" width="0" height="4" fill="#f28c28"><animate attributeName="width" values="0;1520" keyTimes="0;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></rect>
</svg>