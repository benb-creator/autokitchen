<text x="330" y="770" class="s h c">skins rinse out to the 2 mm strainer</text>
<text x="330" y="788" class="s h c">skin loosened everywhere, eyes and hollows too · loss 3–6 %</text>
<text x="470" y="500" class="s h">rubber studs</text>
<text x="660" y="132" class="l b">GP-P2  Knurled-steel drum, stopped by the camera</text>
<text x="660" y="154" class="s">for the few raw-peeled dishes · 1–1.5 kg batch · rolled diamond knurl, no bonded grit to shed</text>
