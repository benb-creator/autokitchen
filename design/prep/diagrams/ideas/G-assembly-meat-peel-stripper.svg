<g><text x="1000" y="320" class="m">6  bun crown</text><rect x="975" y="308" width="16" height="16" fill="#d9a35a" stroke="#3a3f45"/><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.66667;0.66833;0.96;0.96667;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="975" y="140" class="m b">Burger, laid layer by layer</text>
<text x="975" y="565" class="s b">Why the slice stays behind:</text>
<text x="975" y="587" class="s">friction 0.1 N + liquid film ≈ 0.75 N on 100 cm²;</text>
<text x="975" y="609" class="s">the bar pushes on the whole slice edge and</text>
<text x="975" y="631" class="s">the film keeps the flat slice from buckling.</text>
<text x="975" y="653" class="s"></text>
<text x="975" y="675" class="s">Lay-down error ±3 mm (allowed ±15 mm).</text>
<text x="975" y="697" class="s">Collar stays on for transport; lifted off at the</text>
<text x="975" y="719" class="s">hatch while a ring finger holds the top.</text>
<text x="975" y="741" class="s">Bun crowns: carried by a 3-tine side fork (GA-06).</text>
<text x="975" y="763" class="s">Butter: laid as a 1 mm ribbon, not spread (GA-02).</text>
<text x="975" y="785" class="s">No gripper, no vacuum, no force sensing.</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/6</tspan>  Every limp item is made or dealt straight onto a thin polished peel (cheese, patty, a shingled tomato row …).</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.04;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/6</tspan>  The manipulator brings the peel in over the bar and lowers it: the slice now sits just in front of the bar.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.05333;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/6</tspan>  The peel retracts fast; the fixed bar holds the slice back and it lays down 5–10 mm onto the stack.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05333;0.08;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/6</tspan>  The plate sinks by one layer inside the collar; the load cell checks the mass of the layer.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.08;0.13333;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/6</tspan>  Next layer, same move — patty, cheese, tomato row, lettuce pieces, crown.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.13333;0.8;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/6</tspan>  Done: the collar centres every layer and keeps the stack together on the way to the hatch.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="40" y="884" width="1520" height="4" fill="#e6e8eb"/><rect x="40" y="884" width="0" height="4" fill="#f28c28"><animate attributeName="width" values="0;1520" keyTimes="0;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></rect>
