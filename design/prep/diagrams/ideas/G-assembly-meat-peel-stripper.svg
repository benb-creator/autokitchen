<!-- Source: design/prep/gaps/G-assembly-meat.md section 1.2-1.3 (GA-01, GA-02, GA-06 named). Simplest reading of an unclear point: the collar is drawn fixed at the lay level with the plate sinking inside it, and the peel is lowered just in front of the bar after passing over it; the document does not say how a 140 mm peel lays inside a 115 mm collar. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
