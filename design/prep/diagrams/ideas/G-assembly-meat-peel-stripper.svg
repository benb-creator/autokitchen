<text x="24" y="36" class="xl b">GA-01  Open-hand assembly: peel and fixed stripper bar</text>
<text x="24" y="62" class="m">Limp slices are not gripped: they are carried on a thin peel and stripped off by a fixed bar as the peel pulls back.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · G3 assembly (recommended core)</text>
<text x="1576" y="49" class="s r">peel 140 × 200 × 0.8 mm · bar Ø 8</text>
<text x="1576" y="68" class="s r">collars Ø 115 × 70 (burger), 125 × 125 × 60 (bread)</text>
<text x="1576" y="87" class="s r">conf. H bread, cheese, ham, patty, tomato; M lettuce</text>
<text x="40" y="128" class="m b">SIDE VIEW — build spot (1.6 px per mm)</text>
