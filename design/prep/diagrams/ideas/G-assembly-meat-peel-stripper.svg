<g><text x="1000" y="260" class="m">4  tomato row</text><rect x="975" y="248" width="16" height="16" fill="#e0453a" stroke="#3a3f45"/><animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.4;0.40167;0.96;0.96667;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
