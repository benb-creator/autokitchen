<!-- Source: design/prep/gaps/G-assembly-meat.md section 1.2 (GA-04), loop roller SM-079. Top view and section are not to the same scale; the slack loop is shown as a band hanging between two bars. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GA-04  Plough-and-loop fold roller (burrito, cabbage roll, Rouladen)</text>
<text x="24" y="62" class="m">Burrito machines fold the sides with paddles; two fixed plough rails do it with no actuator, then the slack loop rolls.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · G3 assembly (recommended for burrito)</text>
<text x="1576" y="49" class="s r">side margins 40–60 mm (Roulade 15 mm)</text>
<text x="1576" y="68" class="s r">tortilla 40–50 °C · filling ≤ 250 g</text>
<text x="1576" y="87" class="s r">sensing: camera outline, loop motor current</text>
<text x="40" y="128" class="m b">TOP VIEW — feed → (1.1 px per mm)</text>
<text x="1000" y="128" class="m b">SECTION through the slack loop</text>
<path d="M330,260 C420,260 480,320 560,330 L700,330" fill="none" stroke="#f28c28" stroke-width="5"/>
<path d="M330,620 C420,620 480,560 560,550 L700,550" fill="none" stroke="#f28c28" stroke-width="5"/>
<text x="470" y="330" class="s h c">plough rail</text><text x="470" y="640" class="s h c">plough rail</text>
<rect x="700" y="300" width="120" height="280" rx="10" fill="#efe9f6" stroke="#6b4c8a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="760" y="600" class="s h c">to the loop</text>
<g><g><defs><clipPath id="mid"><rect x="-200" y="-105" width="400" height="210"/></clipPath><clipPath id="top"><rect x="-200" y="-160" width="400" height="55"/></clipPath><clipPath id="bot"><rect x="-200" y="105" width="400" height="55"/></clipPath></defs><g clip-path="url(#mid)"><circle r="155" fill="#f1d79a" stroke="#3a3f45" stroke-width="2"/></g><rect x="-80" y="-75" width="44" height="150" rx="14" fill="#7a4a2a" stroke="#3a3f45" stroke-width="1.5"/><g transform="translate(0,-105)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 -1;1 -1" keyTimes="0;0.1;0.20833;1" dur="24s" repeatCount="indefinite"/><g transform="translate(0,105)"><g clip-path="url(#top)"><circle r="155" fill="#f1d79a" stroke="#3a3f45" stroke-width="2"/></g></g></g></g><g transform="translate(0,105)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 -1;1 -1" keyTimes="0;0.1;0.20833;1" dur="24s" repeatCount="indefinite"/><g transform="translate(0,-105)"><g clip-path="url(#bot)"><circle r="155" fill="#f1d79a" stroke="#3a3f45" stroke-width="2"/></g></g></g></g></g><animateTransform attributeName="transform" type="translate" values="200 440;200 440;520 440;760 440;760 440" keyTimes="0;0.04167;0.25;0.33333;1" dur="24s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.31667;0.33333;0.98333;0.99583;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="200" y="650" class="s h c">tortilla Ø 250–300 at 40–50 °C,</text><text x="200" y="668" class="s h c">filling line ≤ 140 mm, ≤ 250 g</text>
<text x="470" y="700" class="s h c">the rails lift both margins (40–60 mm) and lay them over the</text><text x="470" y="718" class="s h c">filling, as a plough turns a furrow — no actuator</text>
<path d="M1080,330 C1080,630 1420,630 1420,330" fill="none" stroke="#6b4c8a" stroke-width="6"><animate attributeName="d" values="M1080,330 C1080,630 1420,630 1420,330;M1080,330 C1080,630 1420,630 1420,330;M1205,330 C1150,580 1350,580 1295,330;M1205,330 C1150,580 1350,580 1295,330;M1080,330 C1080,630 1420,630 1420,330;M1080,330 C1080,630 1420,630 1420,330" keyTimes="0;0.41667;0.47917;0.72917;0.77083;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></path>
<path d="M1080,330 C1080,630 1420,630 1420,330" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10 10"><animate attributeName="d" values="M1080,330 C1080,630 1420,630 1420,330;M1080,330 C1080,630 1420,630 1420,330;M1205,330 C1150,580 1350,580 1295,330;M1205,330 C1150,580 1350,580 1295,330;M1080,330 C1080,630 1420,630 1420,330;M1080,330 C1080,630 1420,630 1420,330" keyTimes="0;0.41667;0.47917;0.72917;0.77083;1" dur="24s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="stroke-dashoffset" values="0;0;-300;-300" keyTimes="0;0.47917;0.72917;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></path>
<g><circle cx="0" cy="0" r="16" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="1080 330;1080 330;1205 330;1205 330;1080 330;1080 330" keyTimes="0;0.41667;0.47917;0.72917;0.77083;1" dur="24s" repeatCount="indefinite"/></g>
<g><circle cx="0" cy="0" r="16" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="1420 330;1420 330;1295 330;1295 330;1420 330;1420 330" keyTimes="0;0.41667;0.47917;0.72917;0.77083;1" dur="24s" repeatCount="indefinite"/></g>
<text x="1080" y="300" class="s h c">bar A</text><text x="1420" y="300" class="s h c">bar B</text>
<text x="1250" y="690" class="s h c">slack loop band (loose belt, washed flat)</text>
<g><g><rect x="-150" y="-5" width="300" height="10" rx="5" fill="#f1d79a" stroke="#3a3f45" stroke-width="1.5"/><rect x="-110" y="-24" width="50" height="20" rx="8" fill="#7a4a2a"/></g><animateTransform attributeName="transform" type="translate" values="1250 300;1250 300;1250 470;1250 470" keyTimes="0;0.33333;0.4;1" dur="24s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32917;0.33333;0.43333;0.44167;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></g>
<g><g><g><circle r="42" fill="#f1d79a" stroke="#3a3f45" stroke-width="2"/><circle r="22" fill="#7a4a2a"/><path d="M0,-42 A42,42 0 1,1 -41,-8 M0,-32 A32,32 0 1,1 -30,-6" fill="none" stroke="#d9b56a" stroke-width="2"/><circle cx="-38" cy="18" r="5" fill="#e04a3a"/></g><animateTransform attributeName="transform" type="rotate" values="0;0;720;720" keyTimes="0;0.47917;0.72917;1" dur="24s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="translate" values="1250 440;1250 440;1250 560;1250 560" keyTimes="0;0.76667;0.81667;1" dur="24s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43333;0.44167;0.98333;0.99583;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1250" y="215" class="s h c">bars close, band driven: content rolls 1.5–2.5 turns</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42083;0.43333;0.75;0.7625;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1250" y="236" class="s h c">loop = 1.1 × final roll circumference</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42083;0.43333;0.75;0.7625;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></g>
<g><rect x="1130" y="604" width="240" height="12" rx="4" fill="#555"/><rect x="1120" y="618" width="260" height="8" fill="#e04a3a"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7625;0.775;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1250" y="650" class="s h c">released seam-down (red dot) · 30 s at 180 °C sets the seam</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.77917;0.79167;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="830" y="760" class="s h c">One module for burrito, enchilada, cabbage roll and Rouladen (15 mm side folds) · conf. M: side folds may spring back before the loop closes</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/5</tspan>  The filled tortilla is drawn towards the loop, filling line across the feed.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.04167;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/5</tspan>  Two fixed plough rails lift both side margins and lay them over the ends of the filling.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04167;0.33333;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/5</tspan>  The folded tortilla drops into the slack loop between bar A and bar B.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.33333;0.41667;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/5</tspan>  The bars close and the band is driven: the content rolls up, 1.5–2.5 turns.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.41667;0.76667;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/5</tspan>  The bars open and the roll is released seam-down; 30 s in the hot pan glues the seam.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.76667;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="40" y="884" width="1520" height="4" fill="#e6e8eb"/><rect x="40" y="884" width="0" height="4" fill="#f28c28"><animate attributeName="width" values="0;1520" keyTimes="0;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></rect>
</svg>