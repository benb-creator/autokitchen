<g><text x="480" y="280" class="s h c">braised as a raft, 90 min at 90–95 °C: rolls shrink Ø 50 → 40, they stay pinned</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52333;0.53333;0.73333;0.74333;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
