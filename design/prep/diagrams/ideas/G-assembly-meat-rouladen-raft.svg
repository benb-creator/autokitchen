.9,468.8 L1157.4,482.2 L1161.0,495.1 L1166.6,507.1 L1173.9,518.0 L1182.9,527.5 L1193.2,535.4 L1204.5,541.5 L1216.6,545.7 L1229.1,547.8 L1241.6,548.0 L1254.0,546.1 L1265.8,542.3 L1276.7,536.7 L1286.5,529.5 L1295.0,520.9 L1301.9,511.1 L1307.1,500.5 L1310.6,489.2 L1312.1,477.6 L1311.8,466.0 L1309.6,454.7 L1305.7,444.0 L1300.2,434.1 L1293.2,425.4 L1285.0,417.9 L1275.7,411.9 L1265.8,407.5 L1255.3,404.8 L1244.6,403.8 L1234.0,404.5 L1223.8,406.9 L1214.2,410.8 L1205.4,416.3 L1197.6,422.9 L1191.1,430.7 L1186.0,439.3 L1182.4,448.6 L1180.3,458.2 L1179.8,467.9 L1180.8,477.5 L1183.3,486.7 L1187.3,495.3 L1192.5,503.0 L1198.8,509.7 L1206.1,515.3 L1214.1,519.6 L1222.5,522.6 L1231.2,524.1 L1240.0,524.2 L1248.6,522.9 L1256.7,520.2 L1264.2,516.4 L1271.0,511.4 L1276.8,505.5 L1281.5,498.8 L1285.0,491.6 L1287.3,483.9 L1288.3,476.1 L1288.0,468.3 L1286.5,460.8 L1283.9,453.7 L1280.2,447.2 L1275.5,441.4 L1270.1,436.6" fill="none" stroke="#f2e4a0" stroke-width="2"/><circle cx="1240" cy="470" r="34" fill="#7a5a3a" opacity="0.7"/><circle cx="1290.0" cy="556.6" r="7" fill="#e04a3a"/></g></g></g></g>
<g clip-path="url(#secclip)"><g><rect x="900" y="510" width="520" height="24" fill="#6f7a85" stroke="#3a3f45" stroke-width="1.5" opacity="0.92"/><animateTransform attributeName="transform" type="translate" values="-520 0;-520 0;0 0;0 0;-520 0;-520 0" keyTimes="0;0.13333;0.25333;0.98333;0.99667;1" dur="30s" repeatCount="indefinite"/></g></g>
<text x="1240" y="300" class="s h c">seam (red) at 5 o’clock, flap pinned 10 mm behind its edge</text>
<text x="1240" y="640" class="s h c">tine 6 × 1.5 mm on edge, 12 mm above the floor:</text>
<text x="1240" y="658" class="s h c">the roll cannot turn, two tines keep the raft from folding</text>
<rect x="930" y="690" width="640" height="130" rx="8" fill="#f7f8f9" stroke="#c9ced4"/>
<text x="945" y="716" class="s">1 side edges folded in 15 mm (plough rails of GA-04): filling stays in when it shrinks</text>
<text x="945" y="742" class="s">2 last 35 mm of the slice: no mustard, salted, floured → myosin + starch glue the seam</text>
<text x="945" y="768" class="s">3 loop stops at a known length: seam laid at 5 o’clock   4 sear seam-down 90 s first</text>
<text x="945" y="794" class="s">5 the raft: one fork instead of 6–12 pins — nothing small travels to the plate</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/6</tspan>  The rolled Rouladen lie seam-down in the comb cradle; the seam sits at 5 o’clock.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.13333;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/6</tspan>  A two-tine fork (300 mm tines, 60 mm apart) is pushed through the wall slots and through all rolls.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.13333;0.28;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/6</tspan>  The cradle is lifted away: the rolls are now a rigid raft with a handle outside the food.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.28;0.33333;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/6</tspan>  Searing: the raft is turned on its handle so both broad faces brown, not just one strip.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.33333;0.53333;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/6</tspan>  Braising: the rolls shrink by a fifth and loosen in any slot — but the tines hold them shut.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.53333;0.73333;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/6</tspan>  Lifted out, drained; a stripper comb pushes the rolls off one by one onto the peel, seam-down.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.73333;1" dur="30s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="40" y="884" width="1520" height="4" fill="#e6e8eb"/><rect x="40" y="884" width="0" height="4" fill="#f28c28"><animate attributeName="width" values="0;1520" keyTimes="0;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></rect>
</svg>