3;0.99667;1" dur="30s" repeatCount="indefinite"/></g><g><g><rect x="0" y="390" width="480" height="5" fill="#6f7a85" stroke="#3a3f45" stroke-width="0.8"/><rect x="0" y="486" width="480" height="5" fill="#6f7a85" stroke="#3a3f45" stroke-width="0.8"/><path d="M480,390 L494,394 L480,397 Z M480,486 L494,490 L480,493 Z" fill="#6f7a85"/><rect x="-40" y="381" width="40" height="118" rx="4" fill="#6f7a85" stroke="#3a3f45" stroke-width="1.5"/><rect x="-160" y="425" width="120" height="30" rx="8" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/></g><animateTransform attributeName="transform" type="translate" values="-260 0;-260 0;230 0;230 0;-260 0;-260 0" keyTimes="0;0.13333;0.25333;0.98333;0.99667;1" dur="30s" repeatCount="indefinite"/></g></g></g></g>
<g><text x="130" y="380" class="s h c">handle,</text><text x="130" y="398" class="s h c">outside the food</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24333;0.25333;0.93333;0.94333;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="480" y="280" class="s h c">fork pushed through the wall slots and all rolls at once: 5–10 N per roll</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12333;0.13333;0.28;0.29;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="480" y="280" class="s h c">cradle lifted away: a rigid raft of rolls</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.28;0.33333;0.34333;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="570" y="805" class="s h c">stripper comb pushes the rolls off one by one onto the peel, seam-down</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.73667;0.74667;0.98667;0.99667;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="480" y="280" class="s h c">lifted out by the handle, drained; nothing ever grips a roll</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72333;0.73333;0.98667;0.99667;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
