<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GA-20  Rouladen without string: the hairpin-skewer raft</text>
<text x="24" y="62" class="m">A cradle alone keeps only 75–85 % of rolls closed; one long two-tine fork turns them into a raft that holds through sear, braise and plating.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · G8 Rouladen (recommended fastener)</text>
<text x="1576" y="49" class="s r">tines 300 × 6 × 1.5 mm, 60 mm apart</text>
<text x="1576" y="68" class="s r">pierce 5–10 N per roll · 1.5 kg raft: 2.2 Nm</text>
<text x="1576" y="87" class="s r">conf. H holding · M seam-angle control</text>
<text x="40" y="128" class="m b">TOP VIEW — comb cradle, 5 rolls, two-tine fork (1.6 px per mm)</text>
<g><rect x="200" y="290" width="560" height="300" rx="20" fill="#3b3f44" opacity="0.9"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32333;0.33333;0.53333;0.54333;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="480" y="280" class="s h c">sear: the raft is turned on its handle, both broad faces brown (≈ 60 % of the surface)</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32333;0.33333;0.53333;0.54333;1" dur="30s" calcMode="linear" repeatCount="indefinite"/></g>
