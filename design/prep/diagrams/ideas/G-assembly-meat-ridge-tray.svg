<g><text x="495" y="300" class="l h c">sheet 1 laid on by the peel</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02045;0.02727;0.09091;0.09773;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="495" y="300" class="l h c">soft-stud platen presses it into the cavities</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08409;0.09091;0.18182;0.18864;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="495" y="300" class="l h c">filling deposited by mass (load cell)</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.175;0.18182;0.32727;0.33409;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="495" y="300" class="l h c">margins wetted (water or egg wash)</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32045;0.32727;0.44545;0.45227;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="495" y="300" class="l h c">sheet 2 laid on</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43864;0.44545;0.52727;0.53409;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="495" y="300" class="l h c">roller seals and cuts on the 1 mm ridges in one pass</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52045;0.52727;0.77273;0.77955;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="495" y="300" class="l h c">tray inverted: the pockets drop out</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76591;0.77273;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<rect x="930" y="160" width="640" height="300" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="950" y="192" class="s">The ravioli board, enlarged; one plate, radii ≥ 3 mm.</text>
<text x="950" y="220" class="s">Cavities 80 × 80 × 15 (turnovers), 45 × 45 × 10 (ravioli, gyoza).</text>
<text x="950" y="248" class="s">Cutting two 1 mm dough layers on a 1 mm ridge: 1–2 N per mm</text>
<text x="950" y="276" class="s">of ridge in contact; a 300 mm cross ridge = 300–600 N,</text>
<text x="950" y="304" class="s">or the roller is set at 5° so it crosses ridges gradually (÷ 4).</text>
<text x="950" y="332" class="s">Shapes are square: gyoza and samosa are adapted in shape.</text>
<text x="950" y="360" class="s">Conf. H with bought puff pastry and wrappers;</text>
<text x="950" y="388" class="s">M for the release of wet fillings.</text>
<text x="950" y="416" class="s">Experiment: ravioli board + rolling pin, 20 EUR.</text>
<rect x="930" y="480" width="640" height="150" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="950" y="510" class="m b">GA-11 cores, GA-13 cavities: see the injection diagram</text>
<text x="950" y="536" class="s">Alternative for single pockets: square of pastry, filling on one half,</text>
<text x="950" y="556" class="s">folded by the peel, crimped with a U-frame like GA-08 (M–H).</text>
<text x="950" y="580" class="s">Rejected: hinged dumpling press — hinge and teeth are hard to clean.</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/6</tspan>  Sheet 1 (puff pastry, wrapper) is laid over the tray by the peel.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.09091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/6</tspan>  A soft-stud platen presses it down into the cavities.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.09091;0.18182;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/6</tspan>  Filling is deposited into each cavity, weighed by the load cell.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.18182;0.32727;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/6</tspan>  A roller wets the margins over the ridges.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.32727;0.44545;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/6</tspan>  Sheet 2 is laid on; one roller pass over the ridges seals and cuts every pocket at once.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.44545;0.77273;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/6</tspan>  The tray is inverted onto the baking tray and the pockets drop out.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.77273;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
