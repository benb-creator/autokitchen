<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GA-09  Sheet pockets on a ridge tray (turnovers, samosa, gyoza)</text>
<text x="24" y="62" class="m">Raised 1 mm ridges between the cavities are the cutting edges: one roller pass seals and cuts all pockets.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · G4 stuffing, sheet pockets (H)</text>
<text x="1576" y="49" class="s r">cavities 80 × 80 × 15 / 45 × 45 × 10 mm</text>
<text x="1576" y="68" class="s r">ridges 1 mm wide · roller 300–600 N</text>
<text x="1576" y="87" class="s r">tray floured, washed; no hinge, no teeth</text>
<text x="40" y="128" class="m b">SECTION — ridge tray, cavities 80 × 80 × 15 mm (2 px per mm, ridges drawn wider)</text>
