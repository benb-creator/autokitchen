<text x="1075" y="360" class="s c">dropped into a</text><text x="1075" y="378" class="s c">funnel: it aligns,</text><text x="1075" y="396" class="s c">head or tail first</text>
<text x="1215" y="360" class="s c">camera decides; a</text><text x="1215" y="378" class="s c">2nd funnel inverts</text><text x="1215" y="396" class="s c">it rim-to-rim if</text><text x="1215" y="414" class="s c">needed</text>
<text x="1355" y="360" class="s c">stand pushed into</text><text x="1355" y="378" class="s c">the vent from</text><text x="1355" y="396" class="s c">above, cone</text><text x="1355" y="414" class="s c">self-centres ±10</text><text x="1355" y="432" class="s c">mm</text>
<text x="1495" y="360" class="s c">the set is</text><text x="1495" y="378" class="s c">inverted: bird</text><text x="1495" y="396" class="s c">sits legs down</text>
<rect x="980" y="500" width="590" height="260" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="1000" y="530" class="s b">Numbers and limits</text>
<text x="1000" y="558" class="s">cut beside the spine, through rib heads and breast:</text>
<text x="1000" y="586" class="s">cooked 35-day broiler bones are soft, 300–800 N peak</text>
<text x="1000" y="614" class="s">on a 20° wedge [E], inside the press range</text>
<text x="1000" y="642" class="s">oven clear height ≈ 280 mm for a bird ≤ 2 kg</text>
<text x="1000" y="670" class="s">the pose is known from raw to carving (rule R12)</text>
<text x="1000" y="698" class="s b">Baseline without this: roast as parts</text>
<text x="1000" y="726" class="s">(legs and breasts on the bone) — 1 meal adapted</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/5</tspan>  Loading: the raw bird is aligned in a funnel and the stand is pushed into the vent from above.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.25;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/5</tspan>  Roasting on the stand: it browns all round and bastes itself; no trussing, no turning.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.475;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/5</tspan>  A side camera tells breast from back; the turntable turns the stand to the cutting azimuth.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.475;0.6;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/5</tspan>  A guillotine blade descends through the 6 mm gap, 8–10 mm beside spine and keel.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.6;0.775;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/5</tspan>  Two halves fall apart — the German "halbes Hähnchen"; an optional cross cut gives quarters.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.775;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
