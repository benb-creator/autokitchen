<text x="24" y="36" class="xl b">GA-17  Bone-in poultry: vertical split stand and offset halving blade</text>
<text x="24" y="62" class="m">Jointing by touch is not attempted: the bird roasts on a stand whose gap guides a blade beside the backbone.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · G5 carving, poultry (upgrade path)</text>
<text x="1576" y="49" class="s r">conf. M halving, L–M loading → M–L overall</text>
<text x="1576" y="68" class="s r">blade 250 mm, gap 6 mm, cut offset 8–10 mm</text>
<text x="1576" y="87" class="s r">press force 300–800 N [E]</text>
<text x="40" y="128" class="m b">FRONT VIEW — bird on the vertical split stand</text>
