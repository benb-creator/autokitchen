<text x="1280" y="620" class="s h">clear cup: one egg’s white</text>
<text x="1280" y="638" class="s h">camera looks for a yellow streak</text>
<text x="1280" y="656" class="s h">before it joins the others</text>
<text x="1150" y="350" class="s h c">yolk Ø 32–36 sits in a Ø 40 dish; annular slot 4–5 mm around it</text>
<g><text x="1190" y="320" class="m h c">15° tilt, 3 s, two small shakes cut the thick white</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.57727;0.59091;0.88636;0.9;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="830" y="712" class="s">white yield 85–90 %; recipes take whites by grams</text>
<text x="830" y="734" class="s">one trace of yolk spoils a whole foam → one egg per cup</text>
<text x="830" y="756" class="s">pressed dish with a slot: shape rule kept · conf. M–H</text>
<text x="830" y="778" class="s">fallback: carton egg white for foams; whole egg instead of yolk (≤ 3 meals adapted)</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/6</tspan>  The egg lies in a two-part cradle whose halves hang from pivots above it.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.09091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/6</tspan>  A blade strikes once upward through the bottom third of the shell.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.09091;0.16364;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/6</tspan>  The halves swing apart about the cracked bottom: the contents fall into a dark saucer, shells stay in the cradle.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.16364;0.22727;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/6</tspan>  Every egg is inspected on its own saucer; beaten egg is also strained through a 1.5–2 mm plate.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22727;0.5;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/6</tspan>  Separating: the egg is opened over a slotted saucer; the yolk sits in the central dish.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.59091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/6</tspan>  A 15° tilt and two small shakes let the white run through the annular slot into a clear cup.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.59091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
