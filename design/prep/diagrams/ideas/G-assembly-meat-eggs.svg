<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">Eggs: crack by bottom strike and hinge, separate on a slotted saucer</text>
<text x="24" y="62" class="m">An egg opens with little force when it is bent open about a crack — so the equator-score idea is replaced.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · 7.2 egg opening (replace SM-164), 7.3 SEP</text>
<text x="1576" y="49" class="s r">strike 0.05–0.1 J · conf. H</text>
<text x="1576" y="68" class="s r">saucer: slot 4–5 mm, 15° tilt, 3 s · conf. M–H</text>
<text x="1576" y="87" class="s r">cassette and saucer: class R ware, cold rinse</text>
<rect x="30" y="100" width="760" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.00005;0.5;0.51364;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></rect><text x="48" y="132" class="l b">Crack: bottom strike, then hinge open</text><text x="48" y="154" class="s">replaces the equator score (SM-164): pulling halves apart needs 770–1000 N</text>
<rect x="810" y="100" width="760" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48636;0.5;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></rect><text x="828" y="132" class="l b">Separate: one-piece slotted saucer</text><text x="828" y="154" class="s">SEP, 17 meals, priority S · one egg per cup, inspected before pooling</text>
