<g><text x="440" y="285" class="s h">shells stay in the cradle → tipped to waste</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.37727;0.39091;0.5;0.51364;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="50" y="690" class="s">beaten-egg uses (most): poured through a 1.5–2 mm perforated plate,</text>
<text x="50" y="712" class="s">which holds fragments and chalazae — "no fragment > 1 mm" is met</text>
<text x="50" y="734" class="s">whatever the cracker does · fried egg: a flawed egg goes to the mixtures (2–5 %)</text>
<text x="50" y="756" class="s">why not scribe-and-pull: shell 0.37 mm × π × 44 mm = 51 mm² at 15–20 MPa</text>
<text x="50" y="778" class="s">→ 770–1000 N; a Ø 25 suction cup holds 29 N [C] · conf. H for the new way</text>
