<g><text x="1300" y="452" class="s h c">seed pillar stays</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62273;0.63636;0.95455;0.96818;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="1300" y="650" class="s h c">four vertical chord cuts at 0.28 D from the stalk</text>
<text x="1300" y="668" class="s h c">pass outside the seed pillar even if it is off-centre</text>
<text x="1300" y="700" class="s h c">yield 65–75 % · 15 s · any knife · conf. H</text>
<text x="1300" y="190" class="s h c">top view, stalk up</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/5</tspan>  Pepper stands stalk-up in a shallow wet nest; the camera gives the stalk only roughly (±15 mm).</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.13636;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/5</tspan>  The tube descends; its inner cone catches the stalk and pushes the pepper sideways until it is centred.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.13636;0.25455;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/5</tspan>  The oscillating serrated rim cuts the shoulder and the upper rib roots, 30 mm deep.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25455;0.39091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/5</tspan>  The plug — stalk, calyx, placenta, most seeds — stays in the tube; the ejector pin pushes it out over waste.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.39091;0.63636;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/5</tspan>  The pepper is inverted and rinsed 2 s with the fan jet: a whole, hollow pepper (stuffed peppers DM13).</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.63636;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
