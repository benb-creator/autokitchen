<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GP-61  Pepper: stalk-seeking plug corer</text>
<text x="24" y="62" class="m">A tool centred on the stalk, not on the body: the stalk is off-axis by 5–15 mm, so the tool lets the pepper find it.</text>
<text x="1576" y="30" class="s r b">G-produce · G6 deseed and core (recommended, M–H)</text>
<text x="1576" y="49" class="s r">tube Ø 42 (family: Ø 14 tomato, Ø 22 apple)</text>
<text x="1576" y="68" class="s r">plunge 30–50 N · 8 s + 2 s rinse</text>
<text x="1576" y="87" class="s r">plug 12–18 % of mass · ≤ 5 seeds left [E]</text>
<text x="40" y="128" class="m b">SECTION, 4 px/mm</text>
<defs><clipPath id="np"><path d="M-400,-300 H-84 V-50 H84 V-300 H400 V400 H-400 Z"/></clipPath><clipPath id="pp"><rect x="-84" y="-300" width="168" height="250"/></clipPath></defs>
