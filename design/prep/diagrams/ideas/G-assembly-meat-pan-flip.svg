<!-- Source: design/prep/gaps/G-assembly-meat.md section 7.1 (SM-127 rules, GA-36). Sections, not to scale; the second pan is drawn as the flip pan with its drip skirt. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">Pan-pair flip with fat: drip skirt and rules; GA-36 lift-rack turn</text>
<text x="24" y="62" class="m">Turning a pan full of hot fat is the risk, so the flip is limited to little fat — and above 30 mL the food is lifted out to turn.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · 7.1 shared mechanism SM-127</text>
<text x="1576" y="49" class="s r">pair flip: M–H with the rules · GA-36: M–H</text>
<text x="1576" y="68" class="s r">fat ≤ 30 mL · turn 0.6–1.0 s · fall ≤ 25 mm</text>
<text x="1576" y="87" class="s r">leak &lt; 1 mL per flip with a ground land</text>
<rect x="30" y="100" width="760" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.00005;0.5;0.51364;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></rect><text x="48" y="132" class="l b">Pan-pair flip, kept — with five rules</text><text x="48" y="154" class="s">whole-pan items: pancake, omelette, Rösti, tortilla, quesadilla</text>
<rect x="810" y="100" width="760" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48636;0.5;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></rect><text x="828" y="132" class="l b">GA-36  Lift-rack turn for more than 30 mL of fat</text><text x="828" y="154" class="s">Schnitzel, Backfisch, fried chicken, falafel: fish-grill basket, no hinge</text>
<rect x="200" y="590" width="400" height="10" fill="#e04a3a"/><rect x="180" y="604" width="440" height="8" fill="#d0d4d9" stroke="#3a3f45"/>
<text x="400" y="632" class="s h c">hob position with its own spill tray</text>
<g><g><g><path d="M-182,0 L-176,24 L176,24 L182,0" fill="none" stroke="#4a4f55" stroke-width="7" stroke-linejoin="round"/><rect x="182" y="2" width="90" height="12" rx="5" fill="#4a4f55" stroke="#3a3f45"/><rect x="-172" y="17" width="344" height="4" fill="#f2c230"/><g><rect x="-160" y="10" width="320" height="7" rx="3" fill="#f2cf7a" stroke="#b08a3a"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -33;0 -33;0 0;0 0" keyTimes="0;0.30909;0.31818;0.97727;0.99545;1" dur="22s" repeatCount="indefinite"/></g><g><path d="M-182,0 L-176,-24 L176,-24 L182,0" fill="none" stroke="#8fa8c0" stroke-width="7" stroke-linejoin="round"/><path d="M-182,-2 L-196,-2 L-196,14 M182,-2 L196,-2 L196,14" fill="none" stroke="#8fa8c0" stroke-width="5"/><rect x="-182" y="-1" width="364" height="3" fill="#6f7a85"/><animateTransform attributeName="transform" type="translate" values="0 -170;0 -170;0 0;0 0;0 -170;0 -170" keyTimes="0;0.15455;0.21818;0.94545;0.98182;1" dur="22s" repeatCount="indefinite"/></g></g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 -0.6;1 -1;1 -1;1 1;1 1" keyTimes="0;0.25455;0.29091;0.30455;0.93182;0.97273;1" dur="22s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="translate" values="400 400;400 400;405 400;395 400;400 400;400 400" keyTimes="0;0.07273;0.08182;0.09091;0.1;1" dur="22s" repeatCount="indefinite"/></g>
<g transform="rotate(0 400 230)"><path d="M400,230 L358,350 M400,230 L442,350" stroke="#777" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/><rect x="382" y="208" width="36" height="22" rx="4" fill="#5b6470" stroke="#3a3f45" stroke-width="2"/><circle cx="400" cy="219" r="6" fill="#9fd0f0" stroke="#3a3f45" stroke-width="1.5"/></g>
<g><text x="400" y="200" class="s h c">frying pan: free fat ≤ 30 mL (more is taken off by the syringe first)</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.00005;0.07273;0.07727;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="400" y="200" class="s h c">release check: a 5 mm jerk — the camera must see the item move freely</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.06818;0.07273;0.15455;0.15909;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="400" y="200" class="s h c">flip pan, warm and filmed, clamped on: its drip skirt overlaps the rim 8–10 mm</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.15455;0.25455;0.25909;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="400" y="200" class="s h c">turn 180° in 0.6–1.0 s, the last 20° fast against a stop</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.25455;0.33636;0.34091;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="400" y="200" class="s h c">the skirt now points up: a gutter that drains into the flip pan</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33182;0.33636;0.5;0.50455;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><circle r="4" fill="#f2c230"><animate attributeName="cx" values="590;590" keyTimes="0;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="390;390;370;370" keyTimes="0;0.34545;0.39091;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34091;0.34545;0.39091;0.4;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></circle></g>
<text x="60" y="676" class="s">shallow pans (wall 12–15 mm): the item falls ≤ 25 mm</text>
<text x="60" y="698" class="s">items that fill the pan floor cannot slide; small items turn singly</text>
<text x="60" y="720" class="s">rim leak: gap 0.1 mm → 0.15 mL/s, 0.3 mm → 4 mL/s [C]</text>
<text x="60" y="742" class="s">ground flat land ≥ 6 mm, clamped 50–100 N, or the drip skirt</text>
<text x="60" y="764" class="s">trunnions on both sides for the 6 kg, 36 cm pair</text>
<path d="M960,400 L970,600 L1410,600 L1420,400" fill="#fff" stroke="#4a4f55" stroke-width="5"/>
<rect x="972" y="510" width="436" height="88" fill="#f2c230" opacity="0.55"/>
<rect x="950" y="608" width="480" height="10" fill="#e04a3a"/>
<g><g transform="translate(0,19)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 -1;1 -1" keyTimes="0;0.72727;0.78182;1" dur="22s" repeatCount="indefinite"/><g transform="translate(0,-19)"><g><line x1="-200" y1="30" x2="200" y2="30" stroke="#8fa8c0" stroke-width="5" stroke-dasharray="14 5"/><rect x="-170" y="14" width="100" height="14" rx="6" fill="#c8913a" stroke="#8a5a1a" stroke-width="1.5"/><rect x="-50" y="14" width="100" height="14" rx="6" fill="#c8913a" stroke="#8a5a1a" stroke-width="1.5"/><rect x="70" y="14" width="100" height="14" rx="6" fill="#c8913a" stroke="#8a5a1a" stroke-width="1.5"/><g><line x1="-200" y1="8" x2="200" y2="8" stroke="#8fa8c0" stroke-width="5" stroke-dasharray="14 5"/><animateTransform attributeName="transform" type="translate" values="0 -150;0 -150;0 0;0 0;0 -150;0 -150" keyTimes="0;0.54545;0.6;0.95455;0.98636;1" dur="22s" repeatCount="indefinite"/></g><line x1="200" y1="8" x2="240" y2="8" stroke="#f28c28" stroke-width="4"/><line x1="200" y1="30" x2="240" y2="30" stroke="#f28c28" stroke-width="4"/></g></g></g></g><animateTransform attributeName="transform" type="translate" values="1190 550;1190 550;1190 380;1190 380;1190 550;1190 550" keyTimes="0;0.61818;0.66364;0.8;0.85455;1" dur="22s" repeatCount="indefinite"/></g>
<circle r="4" fill="#f2c230"><animate attributeName="cx" values="1040;1040" keyTimes="0;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="410;410;520;520" keyTimes="0;0.66364;0.7;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66364;0.66591;0.7;0.70227;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f2c230"><animate attributeName="cx" values="1100;1100" keyTimes="0;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="410;410;520;520" keyTimes="0;0.675;0.71136;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.675;0.67727;0.71136;0.71364;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f2c230"><animate attributeName="cx" values="1160;1160" keyTimes="0;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="410;410;520;520" keyTimes="0;0.68636;0.72273;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68636;0.68864;0.72273;0.725;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f2c230"><animate attributeName="cx" values="1220;1220" keyTimes="0;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="410;410;520;520" keyTimes="0;0.69773;0.73409;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.69773;0.7;0.73409;0.73636;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f2c230"><animate attributeName="cx" values="1280;1280" keyTimes="0;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="410;410;520;520" keyTimes="0;0.70909;0.74545;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70909;0.71136;0.74545;0.74773;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f2c230"><animate attributeName="cx" values="1340;1340" keyTimes="0;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="410;410;520;520" keyTimes="0;0.72045;0.75682;1" dur="22s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72045;0.72273;0.75682;0.75909;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></circle>
<g><text x="1190" y="230" class="m h c">second perforated rack set on top</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49545;0.5;0.60909;0.61364;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1190" y="230" class="m h c">pair lifted, drained 5 s over the pan</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60455;0.60909;0.71818;0.72273;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1190" y="230" class="m h c">turned 180° in the air: only drips move</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.71364;0.71818;0.8;0.80455;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1190" y="230" class="m h c">lowered again, other side down</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.79545;0.8;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="840" y="690" class="s">inverting a pan with up to 250 mL of hot fat is</text>
<text x="840" y="712" class="s">the hazard of rule R7 — so the fat never moves</text>
<text x="840" y="734" class="s">cost: rack marks in the crumb coat · conf. M–H</text>
<text x="840" y="756" class="s">alternatives: two-sided contact heat or top heat (adapted)</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/6</tspan>  Pair flip is kept for whole-pan items, but only with ≤ 30 mL of free fat in the pan.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.07273;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/6</tspan>  Release check first: a 5 mm jerk, and the camera must see the pancake move freely.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.07273;0.15455;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/6</tspan>  The warm flip pan is clamped on; its skirt overlaps the frying pan’s rim on the outside.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15455;0.25455;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/6</tspan>  One fast turn against a stop; the item falls ≤ 25 mm; the skirt, now on top, drains back like a gutter.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25455;0.5;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/6</tspan>  Deep fat: items lie on a perforated rack; a second rack goes on top.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.60909;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/6</tspan>  The rack pair is lifted and drained, turned in the air and lowered again — the fat itself never moves.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.60909;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
