<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GA-23  Tying a roast: sprung trough cage, net cut off raw</text>
<text x="24" y="62" class="m">The fixture replaces the string: a weighted bar keeps the joint compact; the bought net is removed before roasting.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · G8 tie, truss (recommended)</text>
<text x="1576" y="49" class="s r">bar 0.5–1 kg on two guide posts</text>
<text x="1576" y="68" class="s r">net cut raw by a guarded hook blade</text>
<text x="1576" y="87" class="s r">rods and bent sheet, washer-safe</text>
<text x="40" y="128" class="m b">SIDE VIEW — boned, netted joint in the V-trough</text>
