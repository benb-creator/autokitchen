<text x="980" y="180" class="m b">ZOOM: why the blade cannot enter the meat</text>
<rect x="990" y="430" width="560" height="110" fill="#e8a8a0" stroke="#3a3f45" stroke-width="2"/>
<text x="1270" y="510" class="s h c">meat surface</text>
