<g><text x="460" y="700" class="s h c">then carved in the same fixture: GA-14 drawbridge and twin blade</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82273;0.83636;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
