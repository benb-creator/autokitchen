<g><g><circle cx="0" cy="8" r="13" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/><path d="M-12,4 L-80,-60 L-60,-80 L4,-6 Z" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/><path d="M-30,-14 L-22,-46" stroke="#e04a3a" stroke-width="4"/></g><animateTransform attributeName="transform" type="translate" values="1000 424;1000 424;1500 424;1500 424;1000 424;1000 424" keyTimes="0;0.09091;0.27273;0.29091;0.30909;1" dur="22s" repeatCount="indefinite"/></g>
<text x="1000" y="220" class="s h">the ball guard slides under each strand along the surface;</text>
<text x="1000" y="240" class="s h">the blade sits in the fork above it and only meets the string</text>
<rect x="960" y="590" width="610" height="170" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="980" y="618" class="s b">The task nobody listed</text>
<text x="980" y="644" class="s">Rolled or boned joints are bought in a net or string;</text>
<text x="980" y="670" class="s">baked into the crust, it must come off before carving.</text>
<text x="980" y="696" class="s">Single-muscle roasts (DM06–08) need no tying at all.</text>
<text x="980" y="722" class="s">Camera finds the net · conf. M–H cage, M net removal</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/6</tspan>  A boned joint arrives in its net and lies in the V-trough, raw.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.07273;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/6</tspan>  A guarded hook blade runs along the top: the guard slides under the strands, the blade cuts only string.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.07273;0.3;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/6</tspan>  The net is pulled off while the trough holds the joint — raw, it does not stick.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3;0.40909;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/6</tspan>  A top bar of two rods drops onto the joint, held only by its own weight on two guide posts.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.40909;0.59091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/6</tspan>  Roasting: the joint shrinks, the bar follows it down and keeps it compact — no string needed.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.59091;0.83636;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/6</tspan>  Carving follows in the same fixture and datum (GA-14).</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.83636;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
