<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">Powder dosing in humid air: dry dock, or GA-39 core tube</text>
<text x="24" y="62" class="m">A vibrated sifter lid works only where its mesh stays dry; the core tube needs no lid and likes cohesive powder.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · 7.4 mesh powder dosing (SM-135)</text>
<text x="1576" y="49" class="s r">purge 1–2 L/s cold-store air into a 5 L dock</text>
<text x="1576" y="68" class="s r">holes Ø 2–3 mm, open 10–30 s per dose</text>
<text x="1576" y="87" class="s r">core Ø 40 × 80 mm ≈ 55 g flour</text>
<rect x="30" y="100" width="760" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.00005;0.5;0.51364;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></rect><text x="48" y="132" class="l b">Sifter lid only inside a dry dock</text><text x="48" y="154" class="s">the threat is dew, not humidity: flour + water = paste on the mesh</text>
<rect x="810" y="100" width="760" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48636;0.5;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></rect><text x="828" y="132" class="l b">GA-39  Core tube: no dosing lid at all</text><text x="828" y="154" class="s">cohesive powder stays in a tube by wall friction — humidity helps</text>
