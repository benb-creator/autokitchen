<text x="1370" y="622" class="s h c">cup on the scale</text>
<g><text x="1190" y="200" class="m h c">thin tube Ø 40 pushed 80 mm into the powder</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49545;0.5;0.61818;0.62273;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1190" y="200" class="m h c">withdrawn: the core stays in by wall friction</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.61364;0.61818;0.68182;0.68636;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1190" y="200" class="m h c">carried over the cup</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67727;0.68182;0.77273;0.77727;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1190" y="200" class="m h c">piston ejects one core ≈ 55 g of flour</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76818;0.77273;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="840" y="660" class="s">trim: a partial core or the dredger (GA-33)</text>
<text x="840" y="682" class="s">the more cohesive the powder, the better it works</text>
<text x="840" y="704" class="s">not for free-flowing crystals (salt, sugar): they pour</text>
<text x="840" y="726" class="s">tube and piston dry-brushed; washed weekly, dried warm</text>
<text x="840" y="748" class="s">avoids the dosing-lid conflict X1 · conf. M–H</text>
<text x="840" y="770" class="s">fallback: tilt-pour and scoop, ±5 g on flour</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/5</tspan>  The flour box docks over a small chamber fed with dry air from the cold store.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.09091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/5</tspan>  The shutter opens and the box is vibrated: flour runs through the 2–3 mm holes only while it shakes.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.09091;0.38182;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/5</tspan>  Shutter closed, one knock sheds the hanging layer; the mesh never sees humid cell air.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.38182;0.5;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/5</tspan>  Plain-box alternative: a thin tube is pushed into the flour …</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.61818;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/5</tspan>  … and lifted out with a core held in by wall friction; over the cup a piston pushes it out.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.61818;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
