<g><text x="330" y="202" class="s h c">vibration breaks the flour arches: it runs only while shaken</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.10455;0.11818;0.38182;0.39545;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="330" y="202" class="s h c">closing tap (one 20 g knock) sheds the hanging layer</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36818;0.38182;0.5;0.51364;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></g>
<rect x="60" y="642" width="700" height="160" rx="8" fill="#fff" stroke="#c9ced4"/>
<text x="76" y="668" class="s">Why not in plain cell air: a box at 18 °C in cell air of 30 °C / 70 % RH (dew point 24 °C)</text>
<text x="76" y="695" class="s">gets dew on its mesh [C] → paste → the mesh blinds in a few cycles.</text>
<text x="76" y="722" class="s">Salt deliquesces at 75 % RH, sugar at 84 %: crusts. Free-flowing crystals need another lid (X1).</text>
<text x="76" y="749" class="s">Flour bridges ~100 mm openings when still: it sits firmly on a 2–3 mm hole sheet.</text>
<text x="76" y="776" class="s">Conf. M–H in the dry dock, L–M in unconditioned cell air.</text>
