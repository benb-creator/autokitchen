<!-- Source: design/prep/ideas/D-manipulator.md section 3 (3.2, 3.3, 3.6, 3.7). Side view at 1 px/mm, belt drawn as a simple loop (drive drum and tension roller on the return run). The gate is drawn at the front nose; cassette changes by the turret hand are shown as instant swaps. Sheeting shows 4 of the 8–10 passes; the 90° turn of the sheet is not drawn. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a3f45"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4aa3df"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f28c28"/></marker></defs>
<text x="24" y="36" class="xl b" >D-C  ROLLO — the board is a conveyor, the knife is a gate</text><text x="24" y="62" class="m" >The work surface is a cantilevered TPU belt: belt feed plus one gate stroke slices, sheets and curls; the belt carries food off the nose into the pot.</text><text x="1576" y="30" class="s r b" >belt 320 wide × 560, homogeneous TPU, ±0.5 mm</text><text x="1576" y="49" class="s r" >front nose Ø20 · gate 2 rods × 300 N = 600 N</text><text x="1576" y="68" class="s r" >one turret hand (4 axes) picks and places</text><text x="1576" y="87" class="s r" >8 axes · parts ≈ 5–7 k€</text><text x="1576" y="106" class="s r" >slicing 2 cuts/s, 1 kg dice in ≈ 3 min</text>
<text x="60" y="112" class="m b" >SIDE VIEW (from the front; belt runs left ↔ right)</text><rect x="60" y="170" width="1100" height="12" rx="0" fill="#d0d4d9" stroke="#3a3f45" stroke-width="2" /><text x="64" y="164" class="s" >ceiling</text><rect x="520" y="500" width="120" height="40" rx="0" fill="#e3e6ea" stroke="#3a3f45" stroke-width="1.5" stroke-dasharray="4 3"/><text x="580" y="525" class="s c" >frame on back wall</text><rect x="320" y="473" width="520" height="12" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><path d="M300 470 L860 470 A10 10 0 0 1 860 490 L800 560 L360 560 L300 490 A10 10 0 0 1 300 470 Z" fill="none" stroke="#4f7f73" stroke-width="7" /><path d="M300 470 L860 470 A10 10 0 0 1 860 490 L800 560 L360 560 L300 490 A10 10 0 0 1 300 470 Z" fill="none" stroke="#a9d1c4" stroke-width="3" stroke-dasharray="10 14"><animate attributeName="stroke-dashoffset" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0312;0.0406;0.0625;0.0719;0.0938;0.1031;0.1250;0.1344;0.1562;0.1656;0.1875;0.1969;0.2188;0.2281;0.2656;0.2812;0.3125;0.3438;0.3750;0.4062;0.4375;0.4688;0.5000;0.5312;0.5625;0.5938;0.7188;0.7500;0.9688;1.0000" values="0;0;-8.5;-8.5;-17;-17;-25.5;-25.5;-34;-34;-42.5;-42.5;-51;-51;-59.5;-59.5;-59.5;-209.5;-59.5;-209.5;-59.5;-209.5;-59.5;-209.5;-59.5;-389.5;-389.5;-189.5;-189.5;-2589.5;-2589.5"/></path><circle cx="800" cy="535" r="25" fill="#c4cad1" stroke="#3a3f45" stroke-width="2" /><text x="800" y="600" class="s c" >drive Ø50</text><g ><circle cx="360" cy="535" r="25" fill="#c4cad1" stroke="#3a3f45" stroke-width="2" /><animateTransform attributeName="transform" type="translate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.8750;0.9062;0.9688;0.9844;1.0000" values="0 0;0 0;10 -8;10 -8;0 0;0 0"/></g><text x="372" y="600" class="s" >tension roller</text><text x="330" y="506" class="s" ></text><rect x="396" y="485" width="8" height="20" rx="0" fill="#9aa1a8" stroke="#3a3f45" stroke-width="1" /><re