" stroke-width="1" y="440"><animate attributeName="y" dur="32s" repeatCount="indefinite" keyTimes="0;0.0500;0.0656;1" values="440;440;648;648"/></rect><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0500;0.5156" values="0;1;0"/></g><g opacity="0"><rect x="871" width="8.5" height="30" fill="#f08a24" stroke="#3a3f45" stroke-width="1" y="440"><animate attributeName="y" dur="32s" repeatCount="indefinite" keyTimes="0;0.0813;0.0969;1" values="440;440;642;642"/></rect><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0813;0.5156" values="0;1;0"/></g><g opacity="0"><rect x="871" width="8.5" height="30" fill="#f08a24" stroke="#3a3f45" stroke-width="1" y="440"><animate attributeName="y" dur="32s" repeatCount="indefinite" keyTimes="0;0.1125;0.1281;1" values="440;440;636;636"/></rect><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1125;0.5156" values="0;1;0"/></g><g opacity="0"><rect x="871" width="8.5" height="30" fill="#f08a24" stroke="#3a3f45" stroke-width="1" y="440"><animate attributeName="y" dur="32s" repeatCount="indefinite" keyTimes="0;0.1437;0.1594;1" values="440;440;648;648"/></rect><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1437;0.5156" values="0;1;0"/></g><g opacity="0"><rect x="871" width="8.5" height="30" fill="#f08a24" stroke="#3a3f45" stroke-width="1" y="440"><animate attributeName="y" dur="32s" repeatCount="indefinite" keyTimes="0;0.1750;0.1906;1" values="440;440;642;642"/></rect><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1750;0.5156" values="0;1;0"/></g><g opacity="0"><rect x="871" width="8.5" height="30" fill="#f08a24" stroke="#3a3f45" stroke-width="1" y="440"><animate attributeName="y" dur="32s" repeatCount="indefinite" keyTimes="0;0.2062;0.2219;1" values="440;440;636;636"/></rect><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2062;0.5156" values="0;1;0"/></g><g opacity="0"><rect x="871" width="8.5" height="30" fill="#f08a24" stroke="#3a3f45" stroke-width="1" y="440"><animate attributeName="y" dur="32s" repeatCount="indefinite" keyTimes="0;0.2375;0.2531;1" values="440;440;648;648"/></rect><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2375;0.5156" values="0;1;0"/></g><g opacity="0"><g clip-path="url(#beforeblade)"><g ><rect fill="#f0d9a8" stroke="#3a3f45" stroke-width="1.5" x="640" width="110" y="430" height="40"><animate attributeName="x" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2812;0.3438;0.4062;0.4688;0.5312;1.0000" values="640;640;600;560;520;500;500"/><animate attributeName="width" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2812;0.3438;0.4062;0.4688;0.5312;1.0000" values="110;110;160;210;260;300;300"/><animate attributeName="y" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2812;0.3438;0.4062;0.4688;0.5312;1.0000" values="430;430;444;454;461;464;464"/><animate attributeName="height" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2812;0.3438;0.4062;0.4688;0.5312;1.0000" values="40;40;26;16;9;6;6"/></rect><animateTransform attributeName="transform" type="translate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2812;0.3125;0.3438;0.3750;0.4062;0.4375;0.4688;0.5000;0.5312;0.5625;0.5938;1.0000" values="0 0;0 0;150 0;0 0;150 0;0 0;150 0;0 0;150 0;0 0;330 0;330 0;330 0"/></g></g><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2812;0.5938" values="0;1;0"/></g><g opacity="0"><rect x="870" y="644" height="6" fill="#f0d9a8" stroke="#3a3f45" stroke-width="1.5" width="0"><animate attributeName="width" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5437;0.5938;1.0000" values="0;0;230;230"/></rect><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5437;0.7500" values="0;1;0"/></g><g opacity="0"><g ><rect x="420" y="462" width="14" height="8" rx="0" fill="#a0662b" stroke="#3a3f45" stroke-width="1" /><rect x="442" y="462" width="14" height="8" rx="0" fill="#a0662b" stroke="#3a3f45" stroke-width="1" /><rect x="464" y="462" width="14" height="8" rx="0" fill="#a0662b" stroke="#3a3f45" stroke-width="1" /><rect x="486" y="462" width="14" height="8" rx="0" fill="#a0662b" stroke="#3a3f45" stroke-width="1" /><rect x="508" y="462" width="14" height="8" rx="0" fill="#a0662b" stroke="#3a3f45" stroke-width="1" /><animateTransform attributeName="transform" type="translate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5938;0.6719;0.7031;0.7188;1.0000" values="0 0;0 0;-100 0;-150 160;-150 160;-150 160"/></g><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5938;0.7188" values="0;1;0"/></g><rect x="826" y="182" width="8" height="160" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><rect x="900" y="182" width="8" height="160" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" stroke-dasharray="3 3"/><g opacity="0"><g ><rect x="820" y="300" width="96" height="18" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><path d="M866 318 L876 318 L876 434 L866 444 Z" fill="#dfe6ec" stroke="#3a3f45" stroke-width="1.5" /><animateTransform attributeName="transform" type="translate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0406;0.0500;0.0594;0.0719;0.0813;0.0906;0.1031;0.1125;0.1219;0.1344;0.1437;0.1531;0.1656;0.1750;0.1844;0.1969;0.2062;0.2156;0.2281;0.2375;0.2469;1.0000" values="0 0;0 0;0 38;0 0;0 0;0 38;0 0;0 0;0 38;0 0;0 0;0 38;0 0;0 0;0 38;0 0;0 0;0 38;0 0;0 0;0 38;0 0;0 0"/></g><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2719" values="1;0"/></g><g opacity="0"><g ><rect x="820" y="300" width="96" height="18" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><rect x="826" y="318" width="8" height="90" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><circle cx="830" cy="410" r="30" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2" /><animateTransform attributeName="transform" type="translate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2719;0.2812;0.3438;0.4062;0.4688;0.5312;0.5938;0.6094;1.0000" values="0 -10;0 -10;0 -10;0 4;0 14;0 21;0 24;0 24;0 -10;0 -10"/></g><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2719;0.6094" values="0;1;0"/></g><g opacity="0"><rect x="820" y="300" width="96" height="18" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6094;1.0000" values="0;1;0"/></g><text x="930" y="296" class="s" >gate crossbar</text><text x="930" y="312" class="s" >+ cassette</text><g opacity="0"><g ><circle cx="830" cy="428" r="12" fill="#c4cad1" stroke="#3a3f45" stroke-width="2" /></g><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2719" values="1;0"/></g><g opacity="0"><text x="740" y="400" class="s" >hold roller</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2719" values="1;0"/></g><rect x="494" y="182" width="14" height="160" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><text x="516" y="230" class="s" >turret hand</text><text x="516" y="246" class="s" >(fork, cup, comb ...)</text><rect x="560" y="600" width="120" height="10" rx="0" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5" /><text x="620" y="628" class="s c" >spray bar</text><g opacity="0"><line x1="580" y1="600" x2="580" y2="565" stroke="#4aa3df" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="0.4s" repeatCount="indefinite"/></line><line x1="620" y1="600" x2="620" y2="565" stroke="#4aa3df" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="0.4s" repeatCount="indefinite"/></line><line x1="660" y1="600" x2="660" y2="565" stroke="#4aa3df" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="0.4s" repeatCount="indefinite"/></line><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7500;1.0000" values="0;1;0"/></g><path d="M450 590 L470 562" fill="none" stroke="#6b4c8a" stroke-width="5" /><text x="440" y="628" class="s c" >scraper</text><g opacity="0"><text x="330" y="760" class="s" >tension released: the belt hangs slack and lances spray its inner face</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8750;1.0000" values="0;1;0"/></g><g opacity="0"><text x="600" y="150" class="l b c" >G1 guillotine: overhang cut into the pot</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2719" values="1;0"/></g><g opacity="0"><text x="600" y="150" class="l b c" >G3 sheeting roller: a reversing sheeter</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2719;0.6094" values="0;1;0"/></g><g opacity="0"><text x="600" y="150" class="l b c" >belt reverses: waste off the rear nose</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6094;0.7500" values="0;1;0"/></g><g opacity="0"><text x="600" y="150" class="l b c" >self-wash on the return run</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7500;1.0000" values="0;1;0"/></g><text x="1200" y="220" class="m b" >GATE CASSETTES</text><text x="1200" y="248" class="s" >G1  guillotine blade 300</text><text x="1200" y="270" class="s" >G2  slitter bar, discs at 10 / 5 mm</text><text x="1200" y="292" class="s" >G3  sheeting roller Ø60</text><text x="1200" y="314" class="s" >G4  press plate</text><text x="1200" y="336" class="s" >G5  doctor bar (Rouladen curl)</text><text x="1200" y="358" class="s" >G6  flour / crumb sifter trough</text><text x="1200" y="400" class="s" >Rouladen: the doctor bar sits 3 mm above</text><text x="1200" y="418" class="s" >the belt and the belt runs the slice into it:</text><text x="1200" y="436" class="s" >the edge climbs, folds back, the slice rolls.</text><text x="1200" y="472" class="s" >Dice: slices onto the belt, under the slitter</text><text x="1200" y="490" class="s" >(strips), then overhang-cut crosswise.</text><text x="1200" y="536" class="s b" >weak points: belt hygiene (inner face,</text><text x="1200" y="554" class="s b" >edges), slitter wear on TPU, only one</text><text x="1200" y="572" class="s b" >hand — flipping is clumsy</text><rect x="0" y="842" width="1600" height="58" rx="0" fill="#f2f4f6" stroke="none" stroke-width="0" /><g opacity="0"><text x="24" y="872" class="cap" >1/6  Overhang cut: the belt pushes the carrot one slice past the nose; the guillotine cuts and the slice drops into the pot.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2719" values="1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >2/6  Sheeting: the belt runs the dough back and forth under the roller while the gap steps down.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2719;0.5437" values="0;1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >3/6  The finished sheet leaves over the front nose straight onto the baking tray — it is never lifted.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5437;0.6094" values="0;1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >4/6  Running backwards, the belt carries peel and trimmings off the rear nose into the waste chute.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6094;0.7500" values="0;1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >5/6  The belt washes itself: it runs past a spray bar and a scraper on the return side.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7500;0.8750" values="0;1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >6/6  Then the tension roller retracts; the slack belt is sprayed inside and dried by an air knife.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8750;1.0000" values="0;1;0"/></g><rect x="0" y="842" width="1600" height="4" rx="0" fill="#e1e5ea" stroke="none" stroke-width="0" /><rect x="0" y="842" width="0" height="4" fill="#f28c28"><animate attributeName="width" from="0" to="1600" dur="32s" repeatCount="indefinite"/></rect>
</svg>
