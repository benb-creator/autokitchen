<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GA-24 / GA-25  Singulating stuck slices: shear them apart, or peel them</text>
<text x="24" y="62" class="m">Wet slices resist being pulled apart flat but slide easily: the paper-feeder principle deals them one at a time.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · G9 singulate (recommended)</text>
<text x="1576" y="49" class="s r">roller Ø 30, 1–2 N · overhang 30 mm</text>
<text x="1576" y="68" class="s r">one slice 20 ± 3 g checked on the peel</text>
<text x="1576" y="87" class="s r">bacon drum Ø 70 · 12–15 °C</text>
<rect x="30" y="100" width="760" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.00005;0.55;0.565;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></rect><text x="48" y="132" class="l b">GA-24  Shear dealer: slide, never lift</text><text x="48" y="154" class="s">cold cuts, cheese, fresh pasta sheets, warm tortillas</text>
<rect x="810" y="100" width="760" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.535;0.55;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></rect><text x="828" y="132" class="l b">GA-25  Bacon: peel it off at a low angle</text><text x="828" y="154" class="s">rashers bonded by fat tear at 4–7 N if pulled; rolled off at 12–15 °C</text>
<rect x="130" y="560" width="340" height="12" fill="#d0d4d9" stroke="#3a3f45" stroke-width="2"/>
<rect x="136" y="450" width="8" height="110" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5"/>
<text x="140" y="440" class="s h c">back fence</text>
<g><rect x="150" y="512" width="300" height="6" fill="#f2a6b0" stroke="#b06a74" stroke-width="1"/><rect x="150" y="518" width="300" height="6" fill="#f2a6b0" stroke="#b06a74" stroke-width="1"/><rect x="150" y="524" width="300" height="6" fill="#f2a6b0" stroke="#b06a74" stroke-width="1"/><rect x="150" y="530" width="300" height="6" fill="#f2a6b0" stroke="#b06a74" stroke-width="1"/><rect x="150" y="536" width="300" height="6" fill="#f2a6b0" stroke="#b06a74" stroke-width="1"/><rect x="150" y="542" width="300" height="6" fill="#f2a6b0" stroke="#b06a74" stroke-width="1"/><rect x="150" y="548" width="300" height="6" fill="#f2a6b0" stroke="#b06a74" stroke-width="1"/><g><rect x="150" y="506" width="300" height="6" fill="#f2a6b0" stroke="#b06a74" stroke-width="1"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;60 0;60 0;360 24;360 24;0 0" keyTimes="0;0.31;0.37;0.4;0.46;0.98;1" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.5;0.52;0.98;0.995;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -6;0 -6;0 -12;0 -12;0 0;0 0" keyTimes="0;0.23;0.25;0.48;0.5;0.53;0.55;1" dur="20s" repeatCount="indefinite"/></g>
<g><g><rect x="150" y="500" width="300" height="6" fill="#f2a6b0" stroke="#b06a74" stroke-width="1"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;60 0;60 0;360 30;360 30;0 0" keyTimes="0;0.06;0.12;0.15;0.21;0.98;1" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.25;0.27;0.98;0.995;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></g></g>
<text x="300" y="594" class="s h c">stack in its tray on a lift (or probed by the roller)</text>
<path d="M456,506 L456,560 L462,560 L462,506 Z" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5"/>
<text x="520" y="600" class="s h">retard lip: 1 mm sheet edge at</text><text x="520" y="618" class="s h">stack height − 1 slice</text>
<g><rect x="-4" y="-120" width="8" height="100" fill="#f28c28" stroke="#3a3f45"/><g><circle r="22" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/><line x1="0" y1="0" x2="20.0" y2="0.0" stroke="#3a3f45" stroke-width="1.5"/><line x1="0" y1="0" x2="14.1" y2="14.1" stroke="#3a3f45" stroke-width="1.5"/><line x1="0" y1="0" x2="0.0" y2="20.0" stroke="#3a3f45" stroke-width="1.5"/><line x1="0" y1="0" x2="-14.1" y2="14.1" stroke="#3a3f45" stroke-width="1.5"/><line x1="0" y1="0" x2="-20.0" y2="0.0" stroke="#3a3f45" stroke-width="1.5"/><line x1="0" y1="0" x2="-14.1" y2="-14.1" stroke="#3a3f45" stroke-width="1.5"/><line x1="0" y1="0" x2="-0.0" y2="-20.0" stroke="#3a3f45" stroke-width="1.5"/><line x1="0" y1="0" x2="14.1" y2="-14.1" stroke="#3a3f45" stroke-width="1.5"/><animateTransform attributeName="transform" type="rotate" values="0;0;120;120;240;240" keyTimes="0;0.04;0.1;0.29;0.35;1" dur="20s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="translate" values="400 460;400 460;400 478;400 478;400 460;400 460;400 478;400 478;400 460;400 460" keyTimes="0;0.02;0.04;0.12;0.14;0.27;0.29;0.37;0.39;1" dur="20s" repeatCount="indefinite"/></g>
<text x="400" y="325" class="s h c">knurled roller Ø 30 on the spindle,</text><text x="400" y="343" class="s h c">1–2 N down, turns 1/3 turn</text>
<g><g><path d="M470,0 L740,0 L740,4 L474,4 Z" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5"/></g><animateTransform attributeName="transform" type="translate" values="30 506;30 506;0 506;0 536;0 536;30 506;30 506;0 506;0 536;0 536;30 506;30 506" keyTimes="0;0.1;0.13;0.19;0.23;0.27;0.35;0.38;0.44;0.48;0.52;1" dur="20s" repeatCount="indefinite"/></g>
<text x="640" y="570" class="s h c">peel takes the 30 mm overhang</text>
<g><rect x="560" y="660" width="170" height="54" rx="8" fill="#22272c"/><text x="645" y="680" class="s c" style="fill:#cfd6dd">mass on the peel</text><text x="645" y="704" class="m b c" style="fill:#7fe08a">20 g ✓ single</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.175;0.19;0.53;0.545;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></g>
<text x="60" y="760" class="s h">friction roller drives the top slice (knurl µ 0.5–0.8 wet), slice on slice is lubricated: &lt; 1 N.</text>
<text x="60" y="780" class="s h">Shear τ = ηv/h ≈ 10–100 Pa vs. flat lifting that pulls a film apart (takes 2–3 slices).</text>
<text x="60" y="800" class="s h">Doubles found by mass (20 ± 3 g) and returned or accepted · conf. M (cheese > 15 °C smears)</text>
<rect x="1080" y="570" width="300" height="8" rx="3" fill="#d9705a" stroke="#8a3a2a" stroke-width="1"/>
<rect x="1066" y="579" width="300" height="8" rx="3" fill="#d9705a" stroke="#8a3a2a" stroke-width="1"/>
<rect x="1052" y="588" width="300" height="8" rx="3" fill="#d9705a" stroke="#8a3a2a" stroke-width="1"/>
<rect x="1038" y="597" width="300" height="8" rx="3" fill="#d9705a" stroke="#8a3a2a" stroke-width="1"/>
<rect x="1000" y="608" width="420" height="12" fill="#d0d4d9" stroke="#3a3f45" stroke-width="2"/>
<text x="1210" y="650" class="s h c">bought pack, shingled: every leading edge is exposed</text>
<rect x="1100" y="560" width="300" height="9" rx="3" fill="#d9705a" stroke="#8a3a2a" stroke-width="1"><animate attributeName="width" values="300;300;0;0;300;300" keyTimes="0;0.62;0.75;0.98;0.995;1" dur="20s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1" keyTimes="0;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></rect>
<g><g><circle r="35" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/><circle cx="35.0" cy="0.0" r="2.5" fill="#3a3f45"/><circle cx="30.3" cy="17.5" r="2.5" fill="#3a3f45"/><circle cx="17.5" cy="30.3" r="2.5" fill="#3a3f45"/><circle cx="0.0" cy="35.0" r="2.5" fill="#3a3f45"/><circle cx="-17.5" cy="30.3" r="2.5" fill="#3a3f45"/><circle cx="-30.3" cy="17.5" r="2.5" fill="#3a3f45"/><circle cx="-35.0" cy="0.0" r="2.5" fill="#3a3f45"/><circle cx="-30.3" cy="-17.5" r="2.5" fill="#3a3f45"/><circle cx="-17.5" cy="-30.3" r="2.5" fill="#3a3f45"/><circle cx="-0.0" cy="-35.0" r="2.5" fill="#3a3f45"/><circle cx="17.5" cy="-30.3" r="2.5" fill="#3a3f45"/><circle cx="30.3" cy="-17.5" r="2.5" fill="#3a3f45"/><circle r="40" fill="none" stroke="#d9705a" stroke-width="9" stroke-dasharray="251" stroke-dashoffset="251"><animate attributeName="stroke-dashoffset" values="251;251;0;0;251;251" keyTimes="0;0.62;0.75;0.82;0.95;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="rotate" values="0;0;-490;-490;0;0" keyTimes="0;0.62;0.75;0.82;0.95;1" dur="20s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="translate" values="1400 520;1400 520;1400 520;1100 520;1100 360;1100 360;1400 360;1400 520;1400 520" keyTimes="0;0.6;0.62;0.75;0.79;0.82;0.95;0.98;1" dur="20s" repeatCount="indefinite"/></g>
<rect x="1060" y="404" width="380" height="5" fill="#8fa8c0" stroke="#3a3f45"/>
<rect x="1100" y="395" width="0" height="9" rx="3" fill="#d9705a" stroke="#8a3a2a" stroke-width="1"><animate attributeName="width" values="0;0;300;300;0;0" keyTimes="0;0.82;0.95;0.98;0.995;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></rect>
<text x="1250" y="440" class="s h c">peel</text>
<text x="1250" y="250" class="s h c">drum Ø 70 with a row of short needles (or a pinch bar)</text>
<text x="1250" y="268" class="s h c">takes the leading edge and rolls back over the stack:</text>
<text x="1250" y="286" class="s h c">the rasher winds on at constant radius = peeled at a low angle</text>
<text x="840" y="700" class="s h">Bacon tempered to 12–15 °C first (soft fat). Needles break the shape rule: the drum is loose ware.</text>
<text x="840" y="720" class="s h">Puff pastry: the paper edge is clamped and pulled; dough and paper unroll onto the tray together.</text>
<text x="840" y="740" class="s h">Recipe side: bacon for frying starts as a block in the cold pan and parts as the fat renders.</text>
<text x="840" y="770" class="s h">conf. M · fallback: slice from the block (SM-100) for cheese and ham ≥ 1.5 mm</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/6</tspan>  The knurled roller sets down on the top slice and turns a third of a turn.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.04;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/6</tspan>  Only the top slice slides 30 mm forward over the retard lip; the lip holds the second one back.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.1;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/6</tspan>  The peel comes under the overhang; roller and peel draw the slice off flat — ready for GA-01.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1;0.19;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/6</tspan>  The mass on the peel confirms a single slice; the stack rises by one slice. Next.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.19;0.55;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/6</tspan>  Bacon: the needle drum grips the leading edge and rolls back, winding the rasher up at a low angle …</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.55;0.79;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/6</tspan>  … then rolls it out flat onto the peel.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.79;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="40" y="884" width="1520" height="4" fill="#e6e8eb"/><rect x="40" y="884" width="0" height="4" fill="#f28c28"><animate attributeName="width" values="0;1520" keyTimes="0;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></rect>
</svg>