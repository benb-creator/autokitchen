<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- Source: design/prep/ideas/D-manipulator.md section 2 (2.2, 2.3, 2.6, 2.7). Side section at 0.6 px/mm, front view of the wall at 0.8 px/mm. Simplest reading of peeling: the spit (puck 2 spindle) spins the potato, puck 1 holds the sprung peeler on it (the traverse along the spit is not drawn). The magnet ring that turns the spindle is drawn as one circle in the head; the jaw puck is not drawn. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a3f45"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4aa3df"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f28c28"/></marker></defs>
<text x="24" y="36" class="xl b" >D-B  WALL PUCK — the manipulator goes in the dishwasher</text><text x="24" y="62" class="m" >The cell has no penetration at all: magnet heads behind a closed steel wall drag and turn passive pucks inside the cell.</text><text x="1576" y="30" class="s r b" >wall 1.5 mm non-magnetic stainless, 1000 × 700</text><text x="1576" y="49" class="s r" >puck Ø130: ≈ 400 N hold, ≈ 150 N sideways</text><text x="1576" y="68" class="s r" >spindle through the wall 4–8 Nm (knife 30–50 N)</text><text x="1576" y="87" class="s r" >6–8 motors, all behind the wall · 0 dynamic seals</text><text x="1576" y="106" class="s r" >parts ≈ 2–3 k€ (cheapest concept)</text>
<text x="60" y="112" class="m b" >SIDE SECTION</text><rect x="60" y="190" width="180" height="440" rx="0" fill="#e3e6ea" stroke="#3a3f45" stroke-width="2" /><text x="150" y="214" class="s b c" >DRY ROOM</text><text x="150" y="232" class="s c" >H-bot X/Z</text><rect x="240" y="190" width="6" height="440" rx="0" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5" /><text x="243" y="650" class="s c" >wall 1.5</text><rect x="246" y="190" width="200" height="440" rx="0" fill="#f6f7f8" stroke="#3a3f45" stroke-width="2" /><text x="346" y="214" class="s b c" >WET CELL</text><text x="346" y="232" class="s c" >300 deep</text><rect x="246" y="560" width="190" height="10" rx="0" fill="#f2f2ee" stroke="#3a3f45" stroke-width="1.5" /><text x="346" y="590" class="s c" >board shelf</text><g ><rect x="150" y="290" width="86" height="90" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="2" /><rect x="226" y="300" width="10" height="70" rx="0" fill="#7a7f86" stroke="#3a3f45" stroke-width="1" /><circle cx="196" cy="335" r="22" fill="#9aa1a8" stroke="#3a3f45" stroke-width="2" /><text x="194" y="400" class="s c" >magnet head</text><circle cx="236" cy="296" r="4" fill="#fff" stroke="#3a3f45" stroke-width="1.5" /><circle cx="236" cy="374" r="4" fill="#fff" stroke="#3a3f45" stroke-width="1.5" /><g ><line x1="196" y1="335" x2="196" y2="315" stroke="#f28c28" stroke-width="3" /><animateTransform attributeName="transform" type="rotate" from="0 196 335" to="360 196 335" dur="1s" repeatCount="indefinite"/></g><rect x="248" y="296" width="34" height="78" rx="6" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2" /><rect x="250" y="304" width="8" height="62" rx="0" fill="#7a7f86" stroke="#3a3f45" stroke-width="1" /><circle cx="250" cy="300" r="4" fill="#fff" stroke="#3a3f45" stroke-width="1.5" /><circle cx="250" cy="370" r="4" fill="#fff" stroke="#3a3f45" stroke-width="1.5" /><rect x="282" y="328" width="46" height="14" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><line x1="330" y1="290" x2="330" y2="400" stroke="#2b2f33" stroke-width="4" /><animateTransform attributeName="transform" type="translate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0625;0.1250;0.1562;0.3750;0.4062;0.6250;0.6562;0.7812;0.8750;1.0000" values="0 0;0 -30;0 90;0 -28.5;0 -28.5;0 105;0 105;0 0;0 0;0 -45;0 0"/></g><text x="60" y="684" class="s" >The puck clings to the wall and follows the</text><text x="60" y="702" class="s" >magnet head; a rotating magnet ring turns its</text><text x="60" y="720" class="s" >spindle through the sheet. PEEK rollers on both</text><text x="60" y="738" class="s" >sides: the sheet is only squeezed, not bent.</text><text x="600" y="112" class="m b" >FRONT VIEW of the wall (cell door removed)</text><rect x="600" y="160" width="800" height="560" rx="0" fill="#eef1f4" stroke="#3a3f45" stroke-width="2" /><rect x="620" y="180" width="90" height="50" rx="4" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2" /><text x="665" y="250" class="s c" >box dock</text><path d="M910 640 L910 710 L1050 710 L1050 640" fill="#e6edf3" stroke="#56718c" stroke-width="4" stroke-linejoin="round"/><rect x="902" y="636" width="156" height="4" rx="0" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5" /><path d="M1110 640 L1110 710 L1250 710 L1250 640" fill="#e6edf3" stroke="#56718c" stroke-width="4" stroke-linejoin="round"/><rect x="1102" y="636" width="156" height="4" rx="0" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5" /><rect x="600" y="712" width="800" height="10" rx="0" fill="#e04a3a" stroke="#3a3f45" stroke-width="1" /><text x="1080" y="740" class="s c" >pots on the hob row below the board</text><g ><ellipse cx="900" cy="560" rx="130" ry="20" fill="#f2f2ee" stroke="#3a3f45" stroke-width="2" /><g opacity="0"><rect x="800" y="540" width="80" height="18" rx="6" fill="#e8c35a" stroke="#3a3f45" stroke-width="1.5" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3906" values="1;0"/></g><g ><g opacity="0"><rect x="800" y="542" width="8" height="14" rx="0" fill="#e8c35a" stroke="#3a3f45" stroke-width="1" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3906;0.7500" values="0;1;0"/></g><g opacity="0"><rect x="810" y="542" width="8" height="14" rx="0" fill="#e8c35a" stroke="#3a3f45" stroke-width="1" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4188;0.7500" values="0;1;0"/></g><g opacity="0"><rect x="820" y="542" width="8" height="14" rx="0" fill="#e8c35a" stroke="#3a3f45" stroke-width="1" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4469;0.7500" values="0;1;0"/></g><g opacity="0"><rect x="830" y="542" width="8" height="14" rx="0" fill="#e8c35a" stroke="#3a3f45" stroke-width="1" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4750;0.7500" values="0;1;0"/></g><g opacity="0"><rect x="840" y="542" width="8" height="14" rx="0" fill="#e8c35a" stroke="#3a3f45" stroke-width="1" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5031;0.7500" values="0;1;0"/></g><g opacity="0"><rect x="850" y="542" width="8" height="14" rx="0" fill="#e8c35a" stroke="#3a3f45" stroke-width="1" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5312;0.7500" values="0;1;0"/></g><g opacity="0"><rect x="860" y="542" width="8" height="14" rx="0" fill="#e8c35a" stroke="#3a3f45" stroke-width="1" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5594;0.7500" values="0;1;0"/></g><g opacity="0"><rect x="870" y="542" width="8" height="14" rx="0" fill="#e8c35a" stroke="#3a3f45" stroke-width="1" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5875;0.7500" values="0;1;0"/></g><animateTransform attributeName="transform" type="translate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6562;0.7031;0.7344;0.7375;1.0000" values="0 0;0 0;0 0;220 90;220 90;220 90"/></g><animateTransform attributeName="transform" type="rotate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6562;0.6875;0.7500;0.7812;1.0000" values="0 1030 560;0 1030 560;22 1030 560;22 1030 560;0 1030 560;0 1030 560"/></g><rect x="894" y="580" width="12" height="60" rx="0" fill="#9aa1a8" stroke="#3a3f45" stroke-width="1" /><text x="760" y="610" class="s r" >board turntable Ø300</text><text x="760" y="626" class="s r" >(magnet drive through floor)</text><g opacity="0"><ellipse cx="980" cy="650" rx="50" ry="8" fill="#e8c35a" stroke="#3a3f45" stroke-width="1.5" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7344;1.0000" values="0;1;0"/></g><g opacity="0"><path d="M840 584 A 130 20 0 0 0 960 584" fill="none" stroke="#f28c28" stroke-width="3" marker-end="url(#aho)"/><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3906;0.6250" values="0;1;0"/></g><g opacity="0"><g ><circle cx="0" cy="0" r="58" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5 4"/><circle cx="0" cy="0" r="52" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2" /><circle cx="0" cy="0" r="14" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><text x="0" y="-64" class="s b c h" >puck 2</text><g opacity="0"><g ><circle cx="0" cy="0" r="44" fill="#e8c35a" stroke="#3a3f45" stroke-width="2" /><path d="M-30 -20 Q-10 -36 14 -30" fill="none" stroke="#a0662b" stroke-width="5" /><path d="M20 20 Q32 4 30 -12" fill="none" stroke="#a0662b" stroke-width="5" /><circle cx="-20" cy="18" r="4" fill="#a0662b" stroke="#3a3f45" stroke-width="0" /><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.8s" repeatCount="indefinite"/></g><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1562;0.3750" values="0;1;0"/></g><animateTransform attributeName="transform" type="translate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.1250;0.1562;0.3750;0.4062;0.7812;0.8750;1.0000" values="1250 300;1250 300;1150 380;1150 380;1270 300;1270 300;680 240;1250 300"/></g><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8750" values="1;0"/></g><g opacity="0"><g ><circle cx="0" cy="0" r="58" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5 4"/><circle cx="0" cy="0" r="52" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2" /><circle cx="0" cy="0" r="14" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><text x="0" y="-64" class="s b c h" >puck 1</text><g opacity="0"><rect x="-4" y="0" width="8" height="80" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><rect x="-22" y="80" width="44" height="10" rx="0" fill="#2b2f33" stroke="#3a3f45" stroke-width="1" /><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1562;0.3750" values="0;1;0"/></g><g opacity="0"><g ><rect x="-5" y="-5" width="10" height="30" rx="0" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" /><path d="M0 0 L-160 100 L-168 88 L-10 -8 Z" fill="#dfe6ec" stroke="#3a3f45" stroke-width="1.5" /><animateTransform attributeName="transform" type="rotate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.3906;0.4031;0.4156;0.4313;0.4438;0.4594;0.4719;0.4875;0.5000;0.5156;0.5281;0.5437;0.5563;0.5719;0.5844;0.6000;0.6125;1.0000" values="15 0 0;15 0 0;0 0 0;15 0 0;0 0 0;15 0 0;0 0 0;15 0 0;0 0 0;15 0 0;0 0 0;15 0 0;0 0 0;15 0 0;0 0 0;15 0 0;0 0 0;15 0 0;15 0 0"/></g><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3906;0.6250" values="0;1;0"/></g><animateTransform attributeName="transform" type="translate" dur="32s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0625;0.1250;0.1562;0.3750;0.4062;0.6250;0.6562;0.7812;0.8750;1.0000" values="760 300;1000 260;900 420;1150 262;1150 262;960 440;960 440;760 300;760 300;680 240;760 300"/></g><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8750" values="1;0"/></g><g opacity="0"><text x="1230" y="470" class="s" >spit spins the potato,</text><text x="1230" y="486" class="s" >sprung peeler held on it</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1562;0.3750" values="0;1;0"/></g><g opacity="0"><rect x="1150" width="6" height="10" fill="#a0662b"><animate attributeName="y" values="430;700" dur="0.9s" begin="0s" repeatCount="indefinite"/></rect><rect x="1158" width="6" height="10" fill="#a0662b"><animate attributeName="y" values="430;700" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></rect><rect x="1166" width="6" height="10" fill="#a0662b"><animate attributeName="y" values="430;700" dur="0.9s" begin="0.6s" repeatCount="indefinite"/></rect><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1875;0.3750" values="0;1;0"/></g><g opacity="0"><text x="1040" y="420" class="s" >pivot cut, like a</text><text x="1040" y="436" class="s" >paper cutter</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3906;0.6250" values="0;1;0"/></g><g opacity="0"><text x="1060" y="520" class="s" >shelf tilts: gravity cascade into the pot</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6562;0.7812" values="0;1;0"/></g><circle cx="1000" cy="172" r="9" fill="#4aa3df" stroke="#3a3f45" stroke-width="1.5" /><text x="1016" y="178" class="s" >fixed rotating nozzle</text><g opacity="0"><line x1="1000" y1="178" x2="700" y2="600" stroke="#4aa3df" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="0.4s" repeatCount="indefinite"/></line><line x1="1000" y1="178" x2="1000" y2="620" stroke="#4aa3df" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="0.4s" repeatCount="indefinite"/></line><line x1="1000" y1="178" x2="1300" y2="600" stroke="#4aa3df" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="0.4s" repeatCount="indefinite"/></line><line x1="1000" y1="178" x2="850" y2="400" stroke="#4aa3df" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="0.4s" repeatCount="indefinite"/></line><line x1="1000" y1="178" x2="1200" y2="420" stroke="#4aa3df" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="0.4s" repeatCount="indefinite"/></line><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8906;1.0000" values="0;1;0"/></g><g opacity="0"><text x="1000" y="300" class="m b c h" >cell = five bare sheets:</text><text x="1000" y="322" class="m c h" >no rod, rail, arm, cable or seal</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8906;1.0000" values="0;1;0"/></g><g opacity="0"><rect x="590" y="280" width="20" height="100" rx="0" fill="#fff" stroke="#3a3f45" stroke-width="2" /><text x="584" y="270" class="s r" >to the ware washer</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7812;0.9375" values="0;1;0"/></g><text x="1430" y="180" class="m b" >One spindle:</text><text x="1430" y="206" class="s" >• knife: pivot chop</text><text x="1430" y="226" class="s" >• fork: spit (spins food)</text><text x="1430" y="246" class="s" >• turner: flips</text><text x="1430" y="266" class="s" >• scoop: dumps</text><text x="1430" y="286" class="s" >• whisk: turns</text><text x="1430" y="306" class="s" >• ladle: tips</text><text x="1430" y="350" class="s" >No Y axis: the work</text><text x="1430" y="368" class="s" >is a slice 60–250 mm</text><text x="1430" y="386" class="s" >from the wall; the</text><text x="1430" y="404" class="s" >turntable brings the</text><text x="1430" y="422" class="s" >board under it.</text><text x="1430" y="466" class="s b" >weak points:</text><text x="1430" y="484" class="s" >60–100 N only: no</text><text x="1430" y="502" class="s" >kneading, no pressing;</text><text x="1430" y="520" class="s" >a decoupled puck</text><text x="1430" y="538" class="s" >falls; grit under a</text><text x="1430" y="556" class="s" >roller scratches</text><rect x="0" y="842" width="1600" height="58" rx="0" fill="#f2f4f6" stroke="none" stroke-width="0" /><g opacity="0"><text x="24" y="872" class="cap" >1/6  Behind the closed wall a plotter moves a magnet head; the puck inside clings to the wall and follows it.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1562" values="1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >2/6  Puck 2's spindle is a spit: it spins the potato while puck 1 holds the sprung peeler on it.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1562;0.3750" values="0;1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >3/6  Puck 1's knife chops by turning its spindle (pivot cut); the turntable brings each part of the board under it.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3750;0.6250" values="0;1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >4/6  The board shelf tilts: the cut pieces slide into the pot (gravity cascade box → board → pot).</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6250;0.7812" values="0;1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >5/6  After the meal the pucks let go and leave with the utensils: they are washed in the ware washer.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7812;0.8906" values="0;1;0"/></g><g opacity="0"><text x="24" y="872" class="cap" >6/6  The empty cell is five flat sheets; a fixed nozzle reaches everything in line of sight.</text><animate attributeName="opacity" dur="32s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8906;1.0000" values="0;1;0"/></g><rect x="0" y="842" width="1600" height="4" rx="0" fill="#e1e5ea" stroke="none" stroke-width="0" /><rect x="0" y="842" width="0" height="4" fill="#f28c28"><animate attributeName="width" from="0" to="1600" dur="32s" repeatCount="indefinite"/></rect>
</svg>
