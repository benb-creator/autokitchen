<rect x="1250" y="536" width="220" height="24" rx="3" fill="#6b3a22" stroke="#3a3f45" stroke-width="1.5"/>
<rect x="1250" y="530" width="220" height="6" rx="3" fill="#f2c230" stroke="#3a3f45" stroke-width="1.5"/>
<rect x="1250" y="520" width="220" height="10" rx="3" fill="#e0453a" stroke="#3a3f45" stroke-width="1.5"/>
<circle cx="1490" cy="512" r="6.5" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/>
<text x="1495" y="495" class="s h">bar</text>
<g><g><line x1="0" y1="0" x2="120" y2="0" stroke="#6f7a85" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="8" x2="120" y2="8" stroke="#6f7a85" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="16" x2="120" y2="16" stroke="#6f7a85" stroke-width="5" stroke-linecap="round"/><rect x="120" y="-10" width="60" height="36" rx="5" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/></g><animateTransform attributeName="transform" type="translate" values="1220 470;1220 470;1220 482;1010 482;1010 422;1280 422;1280 422;1500 422;1500 422;1220 470;1220 470" keyTimes="0;0.53333;0.56667;0.64444;0.7;0.77778;0.8;0.85556;0.97778;0.99444;1" dur="18s" repeatCount="indefinite"/></g>
<text x="1100" y="400" class="s h c">three tines Ø 2.5 × 60, 25 mm apart, enter 10 mm under the top</text>
<g><text x="1100" y="700" class="s h c">fork lifts the crown off its hinge</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62778;0.64444;0.72222;0.73889;1" dur="18s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="1360" y="700" class="s h c">fork pulls back; the bar strips the crown</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78333;0.8;0.97778;0.99444;1" dur="18s" calcMode="linear" repeatCount="indefinite"/></g>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/5</tspan>  Soft spreads: a nozzle lays a zigzag; the next layer presses it flat — no spreading at all.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.08333;1" dur="18s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/5</tspan>  Cold butter: a tensioned wire just above a sliding shoe draws a 1 mm ribbon off the block.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.08333;0.30556;1" dur="18s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/5</tspan>  The ribbon lands on the peel and is laid down like any slice.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.30556;0.5;1" dur="18s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/5</tspan>  Bun crown: a three-tine fork enters from the side, 10 mm below the top, and lifts it off the heel.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.77778;1" dur="18s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/5</tspan>  Over the stack the fork pulls back; the fixed bar strips the crown onto the burger.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.77778;1" dur="18s" calcMode="discrete" repeatCount="indefinite"/></g>
