<text x="60" y="700" class="s h">formed and steamed unfilled: nothing has to be closed,</text><text x="60" y="718" class="s h">no core can leak while cooking · depth from the known Ø,</text><text x="60" y="736" class="s h">mass from the stroke · conf. H</text>
<text x="60" y="770" class="s h">solid cores (plum, crouton): sphere-pair cups GA-10 or poke-and-round GA-12</text>
