<text x="770" y="740" class="s h">Fish (FI07): lemon slices and dill are laid under and on it instead.</text>
<text x="770" y="760" class="s h">Upgrade: on the vertical stand (GA-17) the cavity faces up and is filled by gravity (M–L).</text>
<text x="770" y="780" class="s h">The hard part is not filling but orienting a slippery 1.5 kg body.</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/6</tspan>  Dumpling: formed and steamed without a filling.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.09091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/6</tspan>  A Ø 5 side-hole needle goes in to the known centre …</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.09091;0.22727;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/6</tspan>  … and injects 20 g of Powidl or jam: nothing to close, nothing can leak in the steamer.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22727;0.45455;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/6</tspan>  Bird: it lies in its tin; the camera only has to find the opening within ±15 mm.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.45455;0.59091;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/6</tspan>  A Ø 12 lance enters and injects 30–50 g of lemon, herb butter or garlic paste.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.59091;0.86364;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/6</tspan>  Apple and onion roast beside the duck instead of inside it.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.86364;1" dur="22s" calcMode="discrete" repeatCount="indefinite"/></g>
