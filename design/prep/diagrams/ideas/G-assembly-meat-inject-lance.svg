<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GA-11 / GA-13  Fill after, fill by lance: no closing, no stuffing</text>
<text x="24" y="62" class="m">Cores go in after cooking; bird cavities get liquid or paste aromatics through a lance instead of bread stuffing.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · G4 stuffing (recommended)</text>
<text x="1576" y="49" class="s r">GA-11: Ø 5 needle, 20 g · conf. H</text>
<text x="1576" y="68" class="s r">GA-13: Ø 12 lance, 30–50 g · conf. H (adapted)</text>
<text x="1576" y="87" class="s r">tools are straight tubes: flushed and washed</text>
<rect x="30" y="100" width="700" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.00005;0.45455;0.46818;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></rect><text x="48" y="132" class="l b">GA-11  Dumpling core: inject after cooking</text><text x="48" y="154" class="s">Germknödel with Powidl — as bakeries fill Berliner</text>
<rect x="750" y="100" width="820" height="715" rx="10" fill="#fbf7ea" stroke="#c9ced4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44091;0.45455;1" dur="22s" calcMode="linear" repeatCount="indefinite"/></rect><text x="768" y="132" class="l b">GA-13  Bird or fish cavity: aromatics by lance</text><text x="768" y="154" class="s">lemon, herb butter, garlic as 30–50 g paste (adapted method)</text>
