<g><text x="620" y="300" class="s h">core cut out as a cone Ø 60 × 60</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21071;0.22143;0.375;0.38571;1" dur="28s" calcMode="linear" repeatCount="indefinite"/></g>
