<g><text x="500" y="160" class="s h">mains water 0.1–0.2 L/s into the core hole</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.38571;0.78571;0.79643;1" dur="28s" calcMode="linear" repeatCount="indefinite"/></g>
<g><text x="110" y="300" class="s h">pocket fills: ρ g h ≈ 1 kPa</text><text x="110" y="318" class="s h">× 200 cm² = 20 N opens the leaf</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.41071;0.53571;0.54643;1" dur="28s" calcMode="linear" repeatCount="indefinite"/></g>
