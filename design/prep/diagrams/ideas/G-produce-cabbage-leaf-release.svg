<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GP-71  Whole cabbage leaves: freeze–thaw, then float them off</text>
<text x="24" y="62" class="m">Freezing replaces blanching; water pressure in the core pocket peels one leaf at a time, nothing grips the leaf.</text>
<text x="1576" y="30" class="s r b">G-produce · G7 cabbage leaves for Kohlrouladen (M)</text>
<text x="1576" y="49" class="s r">head Ø 200 · cone Ø 60 × 60</text>
<text x="1576" y="68" class="s r">water 0.1–0.2 L/s · ~20 N opening force</text>
<text x="1576" y="87" class="s r">3–5 s per leaf · 10–15 L water per head</text>
<text x="40" y="128" class="m b">SECTION — savoy head core-up on a spike (2 px per mm)</text>
<rect x="90" y="740" width="780" height="14" rx="5" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/>
<text x="480" y="778" class="s h c">tray / mat catches each leaf flat</text>
