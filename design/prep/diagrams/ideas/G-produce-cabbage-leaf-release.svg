<rect x="1000" y="100" width="570" height="300" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="1020" y="130" class="m b">GP-75  Lettuce: one butt cut, the wash separates</text>
<ellipse cx="1180" cy="270" rx="90" ry="72" fill="#7fbf4a" stroke="#2f5f2a" stroke-width="2"/>
<ellipse cx="1180" cy="270" rx="70" ry="56" fill="#9fcf6a" stroke="#2f5f2a" stroke-width="2"/>
<ellipse cx="1180" cy="270" rx="50" ry="40" fill="#bfdf8a" stroke="#2f5f2a" stroke-width="2"/>
<ellipse cx="1180" cy="270" rx="30" ry="24" fill="#dfefb0" stroke="#2f5f2a" stroke-width="2"/>
<rect x="1165" y="335" width="30" height="20" fill="#e7edc6" stroke="#3a3f45" stroke-width="2"/>
<line x1="1130" y1="333" x2="1230" y2="333" stroke="#e04a3a" stroke-width="3" stroke-dasharray="6 4"/>
<text x="1240" y="338" class="s h">cut 15–25 mm above the butt</text>
<text x="1300" y="220" class="s h">leaves are free and part</text>
<text x="1300" y="238" class="s h">in the dunk basket (GP-W1)</text>
<text x="1020" y="385" class="s">Iceberg: cone-cut the core, then chunk-cut · conf. H</text>
<rect x="1000" y="430" width="570" height="290" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="1020" y="460" class="m b">Why no blanching pot</text>
<text x="1020" y="488" class="s">Kohlrouladen need 8–12 whole, pliable leaves (200 × 250 mm).</text>
<text x="1020" y="510" class="s">Raw leaves crack when bent and overlap by more than half a turn.</text>
<text x="1020" y="532" class="s">Freeze–thaw makes them limp like blanched ones [home practice].</text>
<text x="1020" y="554" class="s">No 6–8 L pot, no hot head to lift and return.</text>
<text x="1020" y="576" class="s">Water does the peeling: 3–5 s per leaf, 10 leaves ≈ 1 min,</text>
<text x="1020" y="598" class="s">10–15 L of water.</text>
<text x="1020" y="620" class="s">Hydraulic release is untested [U]; variant GP-72:</text>
<text x="1020" y="642" class="s">steam the cored head 10–12 min, release 4–6 leaves per cycle.</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/7</tspan>  The whole savoy head is frozen (or kept frozen as a stock item).</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.10714;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/7</tspan>  Thawed in the fridge or in 60 °C steam: ice crystals have burst the cells, the leaves are limp.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.10714;0.22143;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/7</tspan>  The core is cut out as a cone: every leaf base is now free.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.22143;0.37857;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/7</tspan>  Water runs into the core hole and fills the pocket behind the outer leaf; it folds out and drops flat.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.37857;0.57143;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/7</tspan>  The head is turned a little …</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.57143;0.65714;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/7</tspan>  … and the next leaf is floated off the same way: 10 leaves in about a minute.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.65714;0.85;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">7/7</tspan>  The thick midrib is flattened by a roller so that the leaf rolls round the filling.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.85;1" dur="28s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="40" y="884" width="1520" height="4" fill="#e6e8eb"/><rect x="40" y="884" width="0" height="4" fill="#f28c28"><animate attributeName="width" values="0;1520" keyTimes="0;1" dur="28s" calcMode="linear" repeatCount="indefinite"/></rect>
