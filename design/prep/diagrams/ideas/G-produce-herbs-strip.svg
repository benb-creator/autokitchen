<text x="1400" y="680" class="s h">… down to 1.5 mm</text>
<text x="1090" y="780" class="s h">stem laid in from the side, no threading · 3 s per leaf · yield 90 %</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/5</tspan>  Soft herbs: the banded bunch is pushed against a fence and cut once where the leaves begin.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.15556;1" dur="27s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/5</tspan>  The butt part with the band goes to waste; leaves and thin stems are washed and chopped together.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15556;0.33333;1" dur="27s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/5</tspan>  Woody herbs: the whole sprigs go into a perforated capsule that hangs in the pot for 15–30 min.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.33333;0.56296;1" dur="27s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/5</tspan>  The capsule is lifted out and opened over waste: flavour stays in the dish, no stem has to be found.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.56296;0.66667;1" dur="27s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/5</tspan>  Kale and chard: the stem is pulled through a 12 mm V-notch; the leaf cannot pass and is stripped off.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.66667;1" dur="27s" calcMode="discrete" repeatCount="indefinite"/></g>
