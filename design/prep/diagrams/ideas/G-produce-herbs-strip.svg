<text x="24" y="36" class="xl b">GP-21 / 22 / 24  Herbs and kale without plucking</text>
<text x="24" y="62" class="m">Three cook’s answers replace dexterous plucking: cut the bunch once, infuse and remove, or pull the stem through a notch.</text>
<text x="1576" y="30" class="s r b">G-produce · G2 strip and pluck (recommended)</text>
<text x="1576" y="49" class="s r">GP-21 bundle cut: H · GP-22 infuser: H</text>
<text x="1576" y="68" class="s r">GP-24 ripple comb: M–H kale, L for thyme</text>
<text x="1576" y="87" class="s r">new parts: infuser capsule (bought), notch plate</text>
