<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GA-14  Carving a boneless roast: trough, twin blade, drawbridge</text>
<text x="24" y="62" class="m">The drawbridge is gauge, support and placer in one; an electric-knife twin blade cuts without dragging the roast.</text>
<text x="1576" y="30" class="s r b">G-assembly-meat · G5 carving (recommended)</text>
<text x="1576" y="49" class="s r">conf. H firm roasts, M braises</text>
<text x="1576" y="68" class="s r">slices 4–20 mm ±1 mm · 3 s each</text>
<text x="1576" y="87" class="s r">trough, follower, drawbridge: bent sheet</text>
<text x="40" y="128" class="m b">SIDE VIEW — roast in a V-trough (2 px per mm)</text>
<path d="M180,566 L600,566 L600,580 L180,590 Z" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/>
<text x="390" y="612" class="s h c">V-trough 90°, 300 mm, juice groove falls to the well</text>
