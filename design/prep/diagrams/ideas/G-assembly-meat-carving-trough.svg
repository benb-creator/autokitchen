<circle cx="0" cy="0" r="4" fill="#b0603a"><animate attributeName="cx" values="320;190" keyTimes="0;1" dur="20s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="572;640" keyTimes="0;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></circle>
<g><rect x="200" y="400" width="400" height="160" rx="60" fill="#e9a5a0" stroke="#8a4a26" stroke-width="6"/><rect x="560" y="404" width="40" height="152" fill="#e9a5a0"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0" keyTimes="0;1" dur="20s" repeatCount="indefinite"/></g>
