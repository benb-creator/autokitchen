<g><rect x="150" y="410" width="40" height="140" rx="6" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/><rect x="60" y="470" width="90" height="20" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/></g>
<text x="130" y="395" class="s h c">follower 5–10 N →</text>
<g><g><g><rect x="600" y="400" width="16" height="160" fill="#e9a5a0" stroke="#8a4a26" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="-16 0;-16 0;0 0;0 0" keyTimes="0;0.05;0.1;1" dur="20s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="rotate" values="0 619 572;0 619 572;90 619 572;90 619 572" keyTimes="0;0.175;0.225;1" dur="20s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;50 0;50 0;100 0;100 0;150 0;150 0" keyTimes="0;0.25;0.3;0.5;0.55;0.75;0.8;1" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0495;0.05;0.98;0.995;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></g>
<g><g><g><rect x="600" y="400" width="16" height="160" fill="#e9a5a0" stroke="#8a4a26" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="-16 0;-16 0;0 0;0 0" keyTimes="0;0.3;0.35;1" dur="20s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="rotate" values="0 619 572;0 619 572;90 619 572;90 619 572" keyTimes="0;0.425;0.475;1" dur="20s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;50 0;50 0;100 0;100 0" keyTimes="0;0.5;0.55;0.75;0.8;1" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2995;0.3;0.98;0.995;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></g>
<g><g><g><rect x="600" y="400" width="16" height="160" fill="#e9a5a0" stroke="#8a4a26" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="-16 0;-16 0;0 0;0 0" keyTimes="0;0.55;0.6;1" dur="20s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="rotate" values="0 619 572;0 619 572;90 619 572;90 619 572" keyTimes="0;0.675;0.725;1" dur="20s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;50 0;50 0" keyTimes="0;0.75;0.8;1" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5495;0.55;0.98;0.995;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></g>
<g><rect x="616" y="400" width="6" height="172" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5"/><circle cx="619" cy="572" r="5" fill="#d0d4d9" stroke="#3a3f45"/><animateTransform attributeName="transform" type="rotate" values="0 619 572;0 619 572;90 619 572;0 619 572;0 619 572;90 619 572;0 619 572;0 619 572;90 619 572;0 619 572;0 619 572" keyTimes="0;0.175;0.225;0.25;0.425;0.475;0.5;0.675;0.725;0.75;1" dur="20s" repeatCount="indefinite"/></g>
<text x="660" y="380" class="s h">drawbridge = gauge plate at distance t, hinged at the bottom</text>
<g><g><g><path d="M600,0 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 L604,192 L604,0 Z" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1"/><animateTransform attributeName="transform" type="translate" values="0 4;0 -4;0 4" dur="0.12s" repeatCount="indefinite"/></g><g><path d="M606,0 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 l3,6 l-3,6 L610,192 L610,0 Z" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1"/><animateTransform attributeName="transform" type="translate" values="0 -4;0 4;0 -4" dur="0.12s" repeatCount="indefinite"/></g><rect x="595" y="-60" width="20" height="60" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/></g><animateTransform attributeName="transform" type="translate" values="0 190;0 190;0 380;0 190;0 190;0 380;0 190;0 190;0 380;0 190;0 190" keyTimes="0;0.1;0.165;0.175;0.35;0.415;0.425;0.6;0.665;0.675;1" dur="20s" repeatCount="indefinite"/></g>
<text x="585" y="150" class="s h r">counter-reciprocating twin blade, ~10 mm stroke, 50 Hz</text>
<text x="585" y="168" class="s h r">passes 1 mm in front of the trough end: never touches steel</text>
<g><rect x="600" y="574" width="320" height="10" rx="4" fill="#fff" stroke="#3a3f45" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;50 0;50 0;100 0;100 0;150 0;150 0;0 0;0 0" keyTimes="0;0.25;0.3;0.5;0.55;0.75;0.8;0.97;0.995;1" dur="20s" repeatCount="indefinite"/></g>
<text x="820" y="620" class="s h c">plate (or peel) retreats by pitch p after each slice: the slices fan</text>
<text x="820" y="640" class="s h c">80 mm slices, p = 25 mm → 3 slices make a 130 mm fan</text>
<rect x="1100" y="150" width="470" height="560" rx="10" fill="#f7f8f9" stroke="#c9ced4" stroke-width="1.5"/>
<text x="1120" y="178" class="s b">Why it works</text>
<text x="1120" y="203" class="s">Slicing (slice-to-push > 3) cuts the normal</text>
<text x="1120" y="228" class="s">force 3–5 ×: 2–10 N, no juice squeezed out.</text>
<text x="1120" y="253" class="s">The two blades rub in opposite directions:</text>
<text x="1120" y="278" class="s">their drag cancels, the roast is not pulled</text>
<text x="1120" y="303" class="s">and needs almost no holding (feed 2–5 N).</text>
<text x="1120" y="328" class="s">The drawbridge supports a soft braised slice</text>
<text x="1120" y="353" class="s">during the cut, so it cannot fold and tear.</text>
<text x="1120" y="378" class="s"></text>
<text x="1120" y="403" class="s b">Numbers</text>
<text x="1120" y="428" class="s">thickness t = 4–20 mm, ±1 mm · 3 s per slice</text>
<text x="1120" y="453" class="s">braise ≥ 6–8 mm hot; firm roasts 4 mm</text>
<text x="1120" y="478" class="s">crackling: slice pitch = multiple of the score pitch</text>
<text x="1120" y="503" class="s">motor current = bone or string alarm</text>
<text x="1120" y="528" class="s"></text>
<text x="1120" y="553" class="s b">Open hygiene point</text>
<text x="1120" y="578" class="s">the twin blades are joined by a keyhole rivet:</text>
<text x="1120" y="603" class="s">separated by a jig before washing.</text>
<text x="1120" y="628" class="s"></text>
<text x="1120" y="653" class="s b">If a braise tears: GA-16</text>
<text x="1120" y="678" class="s">chill to ≤ 10 °C, slice cold, reheat in gravy.</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/6</tspan>  The roast lies in a V-trough; gravity centres it, a follower pushes it gently from behind.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.05;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/6</tspan>  The follower advances the roast by one slice thickness t, against the drawbridge.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.1;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/6</tspan>  The twin blade descends just in front of the trough end; the drawbridge holds the slice.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1;0.175;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/6</tspan>  The drawbridge swings down 90° and lays the slice on the plate.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.175;0.25;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/6</tspan>  The plate retreats by the pitch p: the next slice lands overlapping — a fan.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.8;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">6/6</tspan>  Portion by count and by mass on the load cell; the juice runs to the well for the gravy.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8;1" dur="20s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="40" y="884" width="1520" height="4" fill="#e6e8eb"/><rect x="40" y="884" width="0" height="4" fill="#f28c28"><animate attributeName="width" values="0;1520" keyTimes="0;1" dur="20s" calcMode="linear" repeatCount="indefinite"/></rect>
</svg>