<!-- Source: design/prep/gaps/G-produce.md section 2.2 (GP-25). The blade turning round the stalk is shown by mirroring it left/right in section. Head Ø 150 at 2 px/mm, florets simplified to 7 in the section plane. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.xl{font-size:24px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.cap{font-size:20px}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="36" class="xl b">GP-25  Cauliflower florets: cone cut round the stalk</text>
<text x="24" y="62" class="m">Cut away what joins the florets — the stalk core — instead of picking florets one by one (industrial floretting).</text>
<text x="1576" y="30" class="s r b">G-produce · G2 florets (recommended, conf. M)</text>
<text x="1576" y="49" class="s r">cone Ø 60 × 50 mm, blade at 25°</text>
<text x="1576" y="68" class="s r">20 s per head · crumbs 5–10 %</text>
<text x="1576" y="87" class="s r">GP-26: or cook the head whole, portion after</text>
<text x="60" y="128" class="m b">SECTION — cauliflower head stalk-up in a bowl nest (2 px per mm)</text>
