<text x="1280" y="725" class="s h c">florets ≤ 45 mm → cooking</text>

<text x="1080" y="780" class="s b">Broccoli:</text><text x="1080" y="798" class="s">one flat cut where the stalk branches does the same.</text>
<text x="60" y="780" class="s h">stalk cut 40–80 N with draw · 20 s per head · crumbs 5–10 % (go into the dish)</text>
<line x1="24" y1="836" x2="1576" y2="836" stroke="#c9ced4" stroke-width="1.5"/>
<g opacity="1"><text x="40" y="868" class="cap"><tspan class="b">1/5</tspan>  The head stands stalk-up in a bowl nest; the camera only has to know which side is the stalk.</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.06667;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">2/5</tspan>  A flat cut across the stalk, 10–15 mm above the curd rim, removes the leaf bases.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06667;0.25833;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">3/5</tspan>  A blade set at 25° to the axis turns once round the stalk and cuts out a cone Ø 60 × 50.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25833;0.55833;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">4/5</tspan>  The core is lifted out: nothing holds the florets together any more, they fall apart.</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.55833;0.68333;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="868" class="cap"><tspan class="b">5/5</tspan>  Florets larger than 45 mm are pushed through a coarse wedge grid and split.</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.68333;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="40" y="884" width="1520" height="4" fill="#e6e8eb"/><rect x="40" y="884" width="0" height="4" fill="#f28c28"><animate attributeName="width" values="0;1520" keyTimes="0;1" dur="24s" calcMode="linear" repeatCount="indefinite"/></rect>
</svg>