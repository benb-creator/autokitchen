<!-- K6b hob, turning rings, downdraft and oven. Source: K6b-loose-ware-fast-washer.md 1 (#19), 2.2, 2.4 (hob, downdraft, oven), 5.3. Top view at 0.95 px/mm; side section at T1 at 0.7 px/mm; front section through H2 and the oven at 0.45 px/mm. The anchor pin height and the scraper-arm shape are not given; drawn as an L-arm hooked on a pin in the rear wall. -->
