<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.3750;0.5625;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/4</tspan>  Oven ready: the drop door slides down into the plinth, so the oven floor and the deck form one flat path</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5625;0.8438;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/4</tspan>  Slide: the chuck pushes the thermoplate along +X from the H2/H4 bridge onto the oven floor — heavy goes along the deck</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.8438;1.0000" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/4</tspan>  Door up: the oven closes; nothing ever swings over the hob or the wells</text></g>
