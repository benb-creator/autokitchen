<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K6b  HOB — two turning rings, a plain bridge, the downdraft, and a flush oven</text>
<text x="24" y="58" class="m">Column 1 turns its pots against tools hooked to the rear wall; column 2 holds one GN 2/3 plate that slides straight into the oven.</text>
<text x="1576" y="28" class="s r b">glass 600 × 520 · T1 3.5 kW, T3 2.2 kW turning · H2 3.5, H4 2.2 kW</text>
<text x="1576" y="47" class="s r">rings 0–120 rpm, 20 Nm, on three PEEK rollers</text>
<text x="1576" y="66" class="s r">downdraft slot 50 × 480 between the columns, 300–400 m³/h</text>
<text x="1576" y="85" class="s r">oven 35–45 L, floor flush with the deck, drop door into the plinth</text>
<rect x="30" y="92" width="740" height="752" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="42" y="116" class="m b">Top view of the hob (rear wall at top)</text>
<text x="42" y="796" class="s">Tools (scraper arm, kneading roller, whisk bar) hang on anchor pins in the rear wall</text>
<text x="42" y="814" class="s">and stand still while the ring turns the pot. Steam and fat aerosol are drawn down</text>
<text x="42" y="832" class="s">into the slot between the columns.</text>
