<text x="760" y="414" class="s">3.1 min / 3.0 L standard · 4.1 min / 4.0 L class R · logger on the coldest item · animation compressed</text>
<text x="760" y="460" class="s b">THE MOUTH IS ALSO …</text>
<text x="760" y="482" class="s">· the sink: pasta water poured about the lip with the cold flush running</text>
<text x="760" y="502" class="s">· the place for risky inversions (lid open)</text>
<text x="760" y="522" class="s">· the jaw rinse: after every raw-meat grip the fingers dip into the 85 °C jets</text>
<text x="760" y="542" class="s">· the waste strainer: skins, cores, mill residue</text>
<text x="760" y="562" class="s">· a wet park: an emptied hot vessel is held 6 s in the cold jets, then racked</text>
<text x="760" y="610" class="s b">ONE WAY: clean items leave the rack before soiled ones go in</text>
<text x="760" y="632" class="s">clean ware goes to the filtered-air store or its next station, never back over the open chamber</text>
<text x="760" y="654" class="s">the mouth camera (white + UV-A) sees every item as the rack rises; a failed item gets a 15 min cycle</text>
<text x="760" y="686" class="s">Plates and glasses go to the household dishwasher of the washing module (one washer for all: cell ≈ 1000 mm)</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.1385" dur="26s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/6</tspan>  The jaws take the T45 handle of the rack post and raise the rack to the deck; a cam on the post lifts the lid leaf</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1385;0.2385" dur="26s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/6</tspan>  One way: the clean pot leaves the rack first and goes to the store</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2385;0.3000" dur="26s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/6</tspan>  The soiled pan is set upside down on the three-point stand, tools into the post comb</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3000;0.3846" dur="26s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/6</tspan>  The rack is lowered; the lid closes by itself</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3846;0.7692" dur="26s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">5/6</tspan>  Cold pre-rinse, wash at 60 °C, drain, fresh rinse at 85 °C; raw-meat loads hold ≥ 82 °C for 60 s; dry by its own heat</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.7692" dur="26s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">6/6</tspan>  Jaw hygiene: after a raw-meat grip the fingers dip into the 85 °C jets of the mouth for 5 s, then air</text></g>
