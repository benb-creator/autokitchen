<text x="24" y="34" class="l b">K2b  Wash lift W: a rack raised and lowered by the Wender</text>
<text x="24" y="58" class="m">The rack rises to the deck by its handle (a cam opens the lid); ware goes on and off; the rack sinks and is washed at 85 °C.</text>
<text x="1576" y="28" class="s r b">chamber 330 × 410 × 555 below the deck</text>
<text x="1576" y="47" class="s r">3.1 min, 3.0 L · raw meat 4.1 min, ≥ 82 °C 60 s</text>
<text x="1576" y="66" class="s r">pump 60 L/min, 10 wall jets + floor turbine</text>
<text x="1576" y="85" class="s r">4 persons: 6–7 loads, ≈ 22 L, clean 15 min after</text>
<text x="40" y="108" class="s b">FRONT SECTION through column A</text>
