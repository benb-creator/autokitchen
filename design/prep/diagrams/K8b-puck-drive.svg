<line x1="1220" y1="800" x2="1560" y2="800" stroke="#555" stroke-width="1.2"/><line x1="1220" y1="795" x2="1220" y2="805" stroke="#555" stroke-width="1.2"/><line x1="1560" y1="795" x2="1560" y2="805" stroke="#555" stroke-width="1.2"/><text x="1390" y="817" class="s c">vessels only here</text>
<line x1="1580" y1="510" x2="1580" y2="760" stroke="#555" stroke-width="1.2"/><line x1="1575" y1="510" x2="1585" y2="510" stroke="#555" stroke-width="1.2"/><line x1="1575" y1="760" x2="1585" y2="760" stroke="#555" stroke-width="1.2"/><text x="1574" y="640" class="s r">250</text>
<text x="1556" y="502" class="s r">puck centre at most 250 above the glass</text>
