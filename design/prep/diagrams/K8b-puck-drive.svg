<path d="M1240 695 L1240 760 L1500 760 L1500 695" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2"/>
<rect x="1250" y="730" width="240" height="26" fill="#e8c547" stroke="none" stroke-width="0" opacity="0.7"/>
