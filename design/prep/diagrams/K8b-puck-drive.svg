<g><animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.92;0.96;1" dur="6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 147;0 147;0 147" keyTimes="0;0.33;0.45;0.9;1" dur="6s" repeatCount="indefinite"/><g transform="translate(0 760)"><g><animateTransform attributeName="transform" type="rotate" values="0 1200 -175;0 1200 -175;0 1200 -175;6 1200 -175;6 1200 -175" keyTimes="0;0.33;0.4;0.5;1" dur="6s" repeatCount="indefinite"/><rect x="1196" y="-180" width="200" height="10" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.2"/></g><rect x="1162" y="-345" width="34" height="190" fill="#dfe7ef" stroke="#3a3f45" stroke-width="2" rx="4"/><rect x="1162" y="-353" width="38" height="10" fill="#6b4c8a" rx="4"/><rect x="1162" y="-157" width="38" height="10" fill="#6b4c8a" rx="4"/><rect x="1196" y="-186" width="14" height="22" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1"/></g></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.46;0.9;1" dur="6s" repeatCount="indefinite"/><text x="1300" y="380" class="s c b">2.7 J on a silicone bumper,</text><text x="1300" y="398" class="s c">like a pan dropped from 25 cm</text></g>
<text x="1090" y="140" class="s">Nothing stands in the 60 mm strip next to the</text>
<text x="1090" y="158" class="s">wall, so a dropped puck slides down the skin</text>
<text x="1090" y="176" class="s">and lands beside the food, not in it.</text>
<text x="1120" y="196" class="s c">wall</text>
<rect x="0" y="852" width="1600" height="48" fill="#eef1f4"/>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">1/4 </tspan>The magnet head behind the closed skin drags the puck in X and Z; the tool rides on the puck. No hole, no seal.<animate attributeName="opacity" values="1;0" keyTimes="0;0.25" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">2/4 </tspan>The head turns its magnet ring: the puck rotor follows and the tool rolls about the axis through the wall.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">3/4 </tspan>Release without a motor: the puck’s bail is hung on a peg, the head goes 200 mm down, the poles push the puck off.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.78" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">4/4 </tspan>Pick-up is the reverse: the head comes back, the puck snaps onto the wall and lifts off the peg.<animate attributeName="opacity" values="0;1" keyTimes="0;0.78" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<rect x="0" y="850" width="1600" height="3" fill="#f28c28" transform="scale(0 1)"><animateTransform attributeName="transform" type="scale" values="0 1;1 1" dur="24s" repeatCount="indefinite"/></rect>
</svg>
