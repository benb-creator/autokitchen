<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- K8b puck drive. Source: K8b sections 2.1, 2.2, 2.3 (heads, pucks, R50 rating, release on a peg, fall lane). Panel A side section at 1.2 px/mm, panel B front view of the drive wall at 0.4 px/mm, panel C section at 1 px/mm. Simplifications: magnet blocks drawn as two N/S pairs (the ring has 20 blocks), the four orientation magnets and Hall sensors are omitted; the puck moves in X to reach the peg, which a side section cannot show, so the peg appears only while used; panel C has its own 6 s loop. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K8b  Puck drive — magnets through a closed wall</text>
<text x="24" y="58" class="m">A magnet head behind the 1.5 mm stainless skin drags a sealed puck inside the tub; the puck carries the tool.</text>
<text x="1576" y="28" class="s r b">puck Ø190, 1.1 kg · head ring Ø150, 20 N42SH blocks</text>
<text x="1576" y="47" class="s r">gap 4.0 mm magnet to magnet · glide pads 0.3 MPa</text>
<text x="1576" y="66" class="s r">planned at R50: clamp 384 N, in plane ≤ 40 N</text>
<text x="1576" y="85" class="s r">tilt ≤ 12 Nm · rotor ≤ 6 Nm · pull-off 190 N</text>
<text x="1576" y="104" class="s r">release: peg + head 200 mm down, no motor</text>
<text x="24" y="100" class="s b">A  SIDE SECTION THROUGH THE DRIVE WALL</text>
<text x="246" y="128" class="s c b">DRY: door cassette</text>
<text x="430" y="128" class="s c b">WET: inside the tub</text>
<rect x="192" y="140" width="108" height="660" fill="#eef0f2" stroke="#3a3f45" stroke-width="1.5"/>
<rect x="192" y="140" width="8" height="660" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.2"/>
