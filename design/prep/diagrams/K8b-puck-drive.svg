<text x="1037" y="512" class="s r">two bridges on shared rails: they cannot pass each other</text>
<text x="585" y="532" class="s">puck = solid · gantry and head behind the skin = dashed</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.57;0.78" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="691" y="404" class="s h b">head 200 mm down: puck stays on the peg</text></g>
<text x="585" y="560" class="s b">WHAT THE MAGNETS CARRY (R50 = half the calculated figures)</text>
<text x="585" y="586" class="s">clamp to the wall</text>
<text x="860" y="586" class="s b">384 N</text>
<text x="585" y="608" class="s">push sideways while moving</text>
<text x="860" y="608" class="s b">≥ 40 N</text>
<text x="585" y="630" class="s">push towards the wall</text>
<text x="860" y="630" class="s b">unlimited (skids)</text>
<text x="585" y="652" class="s">tilting moment</text>
<text x="860" y="652" class="s b">12 Nm</text>
<text x="585" y="674" class="s">rotor torque (roll)</text>
<text x="860" y="674" class="s b">6 Nm</text>
<text x="585" y="712" class="s">So tools are set up so that the work pushes</text>
<text x="585" y="730" class="s">into the wall, never away from it.</text>
<text x="1090" y="100" class="s b">C  IF A PUCK DROPS</text>
