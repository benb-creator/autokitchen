<!-- K10 thermo-cooker. Source: K10-two-thousand.md sections 1 (result), 3.2-3.5 (Thermo-cooker station, hand limits), 3.6 (example meal), 6 (boil-clean). Front section at 0.7 px/mm (cell X 560-1440), top view of the lid at 1 px/mm. Simplest readings: the lid lever is a clamped bar with a vertical pin at about 130 mm radius; unlocking turns the lid by about 30 deg; the lid is parked on the deck while the jug is out; the boil-clean water is brought in a pot from the sink spout (boiler water). Cooker proportions are generic (Mambo class), not measured. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K10  THERMO-COOKER — a bought €219 cooker replaces hub, coil and press cup</text>
<text x="24" y="58" class="m">Chops, weighs, heats, stirs, kneads and steams by itself; the hand only fills it, opens it and lifts the jug.</text>
<text x="1576" y="28" class="s r b">Cecotec Mambo class: 2.3 L usable, ≤ 120 °C [U], scale, blade, paddle</text>
<text x="1576" y="47" class="s r">in a drained GN 1/1-200 pocket: top z ≈ 1030, under the open DW door</text>
<text x="1576" y="66" class="s r">full jug ≈ 3.5 kg (hand ≤ 4 kg) · lid opened by an XY-arc push</text>
<text x="1576" y="85" class="s r">boil-clean in place: ≈ 100 °C, high speed, 3 min → A0 ≫ 600</text>
<rect x="30" y="100" width="750" height="740" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="42" y="122" class="s b">FRONT SECTION through the cooker station</text>
