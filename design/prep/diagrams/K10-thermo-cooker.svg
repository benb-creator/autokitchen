<text x="812" y="122" class="s b">TOP VIEW: the hand cannot yaw, so X and Y push the lid lever along an arc</text>
<rect x="800" y="510" width="770" height="330" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="812" y="532" class="s b">WHAT THE COOKER DOES IN K10</text>
