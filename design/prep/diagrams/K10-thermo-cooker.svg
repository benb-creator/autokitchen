<text x="1090" y="304" class="s c b">lid</text>
<text x="1090" y="450" class="s c">funnel in the middle</text>
<text x="1260" y="230" class="s">The roll axis cannot turn about a</text>
<text x="1260" y="250" class="s">vertical axis (no yaw). To twist the</text>
<text x="1260" y="270" class="s">lid open, the hand grips the pin of</text>
<text x="1260" y="290" class="s">a clamped lever and drives X and Y</text>
<text x="1260" y="310" class="s">together along the arc: about 30°.</text>
<text x="1260" y="330" class="s"></text>
<text x="1260" y="350" class="s">The same trick turns the board on</text>
<text x="1260" y="370" class="s">its lazy susan by a peg.</text>
<text x="830" y="560" class="s b">chop</text>
<text x="960" y="560" class="s">carrot, celery, onion in 10 s (blade)</text>
<text x="830" y="584" class="s b">weigh</text>
<text x="960" y="584" class="s">its own scale doses the recipe</text>
<text x="830" y="608" class="s b">heat + stir</text>
<text x="960" y="608" class="s">Bolognese 45 min, stirred, hand free</text>
<text x="830" y="632" class="s b">knead, steam</text>
<text x="960" y="632" class="s">kneading paddle, two-level steamer</text>
<text x="830" y="656" class="s b">serve</text>
<text x="960" y="656" class="s">jug tipped or ladled into GN 1/3 dishes</text>
<text x="830" y="680" class="s b">clean</text>
<text x="960" y="680" class="s">boil-clean between raw and ready-to-eat use;</text>
<text x="830" y="704" class="s b"></text>
<text x="960" y="704" class="s">jug and lid into the dishwasher after the meal</text>
<rect x="1310" y="540" width="240" height="130" fill="#fde3c8" stroke="#3a3f45" stroke-width="1.2" />
<text x="1430" y="564" class="s c b">replaces from K9b/K9c:</text>
<text x="1430" y="586" class="s c">heated hub (T + S),</text>
<text x="1430" y="606" class="s c">ring coil, press cup,</text>
<text x="1430" y="626" class="s c">S ware</text>
<text x="1430" y="652" class="s c">≈ 15 min longer per meal</text>
<text x="1430" y="700" class="s c">driven by K10's controller</text>
<text x="1430" y="718" class="s c">through its own power board</text>
<text x="1430" y="760" class="s c">risk: ≤ 120 °C and lid</text>
<text x="1430" y="778" class="s c">model height [U]</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f2f3f5" stroke="#d0d4d9"/>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.1562" dur="32s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">1/6</tspan> The hand tips diced onion from a GN 1/3 through the stainless funnel in the lid — the lid stays shut</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.1562;0.2812" dur="32s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">2/6</tspan> The cooker's own blade chops in 10 s and its scale weighs; no machine motor involved</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2812;0.4688" dur="32s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">3/6</tspan> Simmer: the cooker heats (≤ 120 °C) and stirs for 45 min — the hand is free for other work</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.4688;0.5938" dur="32s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">4/6</tspan> Lid unlocked by an XY-arc push on its lever pin, lifted by its stub and parked</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.5938;0.7500" dur="32s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">5/6</tspan> The hand lifts the jug (≈ 3.5 kg) by its handle stub and tips the sauce into a serving GN</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.7500" dur="32s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">6/6</tspan> Jug and lid back; hot water + detergent in; ≈ 100 °C at high speed for 3 min: boil-clean in place</text></g>
