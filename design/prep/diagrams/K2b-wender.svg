<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- K2b Wender. Source: K2b-vessel-stack-inversion.md sections 2.1, 2.2, 2.3, 3.9. Left: side section (y/z) through KH; right: front view (x/z); both 0.45 px/mm. The example is the pancake pair flip of 3.9 (flip pan FP set face down on PN on KH, gripped by both flanges, rolled 180 deg, set on H1). The roll unit is drawn as a block; its drop link, slip ring and brake are not drawn. Design gap: a 250 mm pair rolled about y sweeps 125 mm below the roll axis, so the lift of 50 mm (3.9) or 60 mm (3.5) would hit the hob; the lift is drawn as 150 mm. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
