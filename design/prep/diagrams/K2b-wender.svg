<text x="382" y="463.5" class="s">from y 115 to 390;</text>
<text x="382" y="479.5" class="s">they touch only</text>
<text x="382" y="495.5" class="s">necks and rims,</text>
<text x="382" y="511.5" class="s">below the pouring</text>
<text x="382" y="527.5" class="s">edge</text>
