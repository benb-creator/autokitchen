<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7500;0.9125" dur="16s" calcMode="discrete" repeatCount="indefinite"/><line x1="1228.9" y1="582.5" x2="1228.9" y2="177.5" stroke="#f28c28" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="1236.9" y="380" class="s b" style="fill:#c0661a">Z 920–1940</text></g>
<line x1="814" y1="212.5" x2="1309" y2="212.5" stroke="#f28c28" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="1050.25" y="206.5" class="s c" style="fill:#c0661a">X travel 1100 (mast X 120–1220)</text>
<text x="40" y="688" class="s b">AXES</text>
<rect x="40" y="702" width="1520" height="28" fill="#f6f7f8" stroke="none" stroke-width="0"/>
<text x="52" y="721" class="s b">X</text>
<text x="110" y="721" class="s">toothed-belt module, 2 rails, closed dry box at the top of the rear lane</text>
<text x="900" y="721" class="s">1100 mm, 1.2 m/s</text>
<text x="1180" y="721" class="s" style="fill:#6b4c8a">sealing band, drip lip, gutter</text>
<rect x="40" y="732" width="1520" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="52" y="751" class="s b">Z</text>
<text x="110" y="751" class="s">covered ball screw 16 × 10 with brake on the hanging mast (100 × 140 × 3)</text>
<text x="900" y="751" class="s">jaw z 920–1940, 400 N</text>
<text x="1180" y="751" class="s" style="fill:#6b4c8a">sealing band on the mast face</text>
<rect x="40" y="762" width="1520" height="28" fill="#f6f7f8" stroke="none" stroke-width="0"/>
<text x="52" y="781" class="s b">roll</text>
<text x="110" y="781" class="s">sealed unit: servo, 10:1 planetary, brake, absolute encoder; output along +y</text>
<text x="900" y="781" class="s">continuous, 15 / 40 Nm</text>
<text x="1180" y="781" class="s" style="fill:#6b4c8a">one PTFE lip seal (yearly)</text>
<rect x="40" y="792" width="1520" height="28" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="52" y="811" class="s b">jaw</text>
<text x="110" y="811" class="s">gearmotor in a sealed pod; open self-locking screw (L/R thread); 2 fingers; load pins</text>
<text x="900" y="811" class="s">±28 … ±185 mm, 30–400 N</text>
<text x="1180" y="811" class="s" style="fill:#6b4c8a">lip seal at the screw</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2125" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/5</tspan>  The jaws carry the flip pan FP face down from H1 and set it rim to rim on the pan PN with the pancake on KH</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2125;0.3000" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/5</tspan>  They open and re-grip 20 mm lower over BOTH flanges: the V-groove pulls the two rims together and centres them</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3000;0.4500" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/5</tspan>  Lift and roll 180° in 0.8 s, low over the hob: the pancake falls onto FP; the drip skirt keeps the fat inside</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4500;0.7500" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/5</tspan>  X carries the pair to H1 and sets it down; PN is lifted off and goes back to KH for the next pancake</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.7500" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">5/5</tspan>  Z spans the whole height from the deck to the box landing and the tool carousel; the mast always stays in the rear lane</text></g>
