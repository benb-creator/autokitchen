" stroke="#c9a94a" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5375;0.5625" dur="16s" calcMode="discrete" repeatCount="indefinite"/><rect x="-56.25" y="-22.5" width="112.5" height="22.5" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5"/></g><rect y="-7" width="14" height="14" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"><animate attributeName="x" values="-77;-77;-72.5;-72.5;-72.5;-79.25;-79.25;-72.5;-72.5;-72.5;-72.5;-72.5;-79.25;-79.25;-79.25;-79.25;-79.25;-79.25;-77" keyTimes="0.0000;0.0625;0.1000;0.1625;0.1875;0.2125;0.2375;0.2625;0.3000;0.3750;0.4500;0.4875;0.5125;0.5375;0.5625;0.7500;0.8500;0.9000;1.0000" dur="16s" repeatCount="indefinite"/></rect><rect y="-7" width="14" height="14" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"><animate attributeName="x" values="63;63;58.5;58.5;58.5;65.25;65.25;58.5;58.5;58.5;58.5;58.5;65.25;65.25;65.25;65.25;65.25;65.25;63" keyTimes="0.0000;0.0625;0.1000;0.1625;0.1875;0.2125;0.2375;0.2625;0.3000;0.3750;0.4500;0.4875;0.5125;0.5375;0.5625;0.7500;0.8500;0.9000;1.0000" dur="16s" repeatCount="indefinite"/></rect><rect x="-12" y="-24" width="24" height="14" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/></g></g>
