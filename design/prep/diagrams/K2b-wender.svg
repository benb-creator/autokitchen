<line x1="1185" y1="842" x2="1185" y2="852" stroke="#9aa1a8" stroke-width="1"/>
<rect x="30" y="842" width="4" height="10" fill="#f28c28"><animate attributeName="x" values="30;1566" keyTimes="0.0000;1.0000" dur="16s" repeatCount="indefinite"/></rect>
