<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K2b  The Wender: X, Z, roll and one jaw pair, all from the rear lane</text>
<text x="24" y="58" class="m">A carriage at the top of the rear wall carries a hanging mast; the jaws reach forward to the ware line, never over an open vessel.</text>
<text x="1576" y="28" class="s r b">X 1100 mm, 1.2 m/s · Z jaw centre z 920–1940, 400 N</text>
<text x="1576" y="47" class="s r">roll about y: continuous, 15 Nm (40 peak) · jaw grip 30–400 N</text>
<text x="1576" y="66" class="s r">payload 8 kg upright, 6 kg inverted · weighs ±5 g (finger load pins)</text>
<text x="1576" y="85" class="s r">4 dynamic seals: X band, Z band, roll lip seal, jaw-screw lip seal</text>
<text x="40" y="108" class="s b">SIDE SECTION through KH (rear wall left, door right)</text>
