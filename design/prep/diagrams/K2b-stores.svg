<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K2b  Passive stores: tool carousel, box landing and the clean-air ware store</text>
<text x="24" y="58" class="m">No motors: the Wender turns the carousel with a finger, takes boxes off the landing, pushes ware through flaps.</text>
<text x="1576" y="28" class="s r b">tool carousel Ø 340, 12 saddles on Ø 300, at z 1680 in column A</text>
<text x="1576" y="47" class="s r">box landing z 1720 under the transport port: opened GN 1/9–1/3 boxes</text>
<text x="1576" y="66" class="s r">ware store above the hob: 2 levels × 2 positions, z 1420–1995</text>
<text x="1576" y="85" class="s r">store air F7 + H13, + 10 Pa, 25 m³/h, 40 °C, out through slot and flaps</text>
