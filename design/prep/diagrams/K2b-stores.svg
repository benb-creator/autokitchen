<text x="405" y="480" class="s">drawn out in +X</text>
<text x="390" y="410" class="s">access</text>
<text x="390" y="426" class="s">point</text>
<text x="50" y="600" class="s">a finger pushes a peg on the rim:</text>
<text x="50" y="618" class="s">the carousel turns 30° per push</text>
<text x="50" y="636" class="s"></text>
<text x="50" y="654" class="s">the jaws close around the stem</text>
<text x="50" y="672" class="s">below the T45 neck, lift 10 mm and</text>
<text x="50" y="690" class="s">draw the tool out of its saddle</text>
<text x="50" y="708" class="s"></text>
<text x="50" y="726" class="s">12 stem tools; the rest in kits</text>
<text x="50" y="744" class="s">in the ware store</text>
