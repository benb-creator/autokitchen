<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1625;0.3333" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/5</tspan>  The jaws close around the stem under its T45 neck, lift 10 mm and draw the tool out of its saddle in +X</text></g>
