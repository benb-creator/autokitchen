<text x="566" y="558" class="s">jaws grip the box flanges in the</text>
<text x="566" y="576" class="s">straight V-slots; the roll tips it</text>
<text x="566" y="594" class="s">over the target, stopping at the</text>
<text x="566" y="612" class="s">weight; then it goes back up</text>
