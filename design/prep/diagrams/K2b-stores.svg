<text x="1086" y="160" class="s">filtered air (F7 + H13) at + 10 Pa, 40 °C:</text>
<text x="1086" y="178" class="s">out through the flaps and the finger slot</text>
<text x="1086" y="762" class="s">flaps on the –X face open as an item is pushed in;</text>
<text x="1086" y="780" class="s">the fingers run in a 30 mm rear slot behind a drip lip;</text>
<text x="1086" y="798" class="s">the left position holds the frequent stack</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
