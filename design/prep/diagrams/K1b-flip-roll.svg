<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3750;0.5417" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="700" y="470" class="s">the arm moves sideways at the rolling speed</text><text x="700" y="488" class="s">while the roll turns, pressing 10 N</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.3750" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="700" y="470" class="s">mandrel (Ø 12, on the roll axis) pushed</text><text x="700" y="488" class="s">over the leading edge</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5417;0.6667" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="700" y="470" class="s">drawn through the U-notch of the comb cradle:</text><text x="700" y="488" class="s">stripped off, flap at 5 o'clock</text></g>
<rect x="980" y="500" width="16" height="60" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1.5"/>
<text x="990" y="494" class="s c">cradle</text>
<text x="566" y="650" class="s">before rolling: mustard spread, stopping</text>
<text x="566" y="668" class="s">35 mm before the flap; bacon, onion,</text>
<text x="566" y="686" class="s">gherkin on the first third; the turner</text>
<text x="566" y="704" class="s">folds both long edges in by 15 mm</text>
<text x="566" y="722" class="s"></text>
<text x="566" y="740" class="s">risk: the mandrel's grip on a wet slice</text>
<text x="1086" y="120" class="s b">RAFT: two tines hold four rolls (GA-20)</text>
<rect x="1110" y="370" width="420" height="20" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1.5"/>
<text x="1320" y="410" class="s c">comb cradle with guide slots</text>
