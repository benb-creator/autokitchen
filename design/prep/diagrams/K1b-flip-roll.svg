<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7500;0.8333" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="1100" y="500" class="s">seam face down, 90 s untouched</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.8333" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="1100" y="500" class="s b" style="fill:#c0661a">the roll turns the raft about its tines:</text><text x="1100" y="518" class="s">the second broad face browns</text></g>
<text x="1100" y="720" class="s">two broad faces ≈ 60 % browned; two</text>
<text x="1100" y="738" class="s">batches of 4 avoid crowding; then fond,</text>
<text x="1100" y="756" class="s">deglaze, braise 100 min at 95 °C, lidded</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/5</tspan>  Pancake: pan B is laid upside down on pan A and hooked; the pair is lifted by its twin stub and rolled 180°: the pancake drops onto B</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.5417" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/5</tspan>  Roulade: the slotted mandrel on the roll axis takes the slice's edge and rolls it up while the arm moves along at the rolling speed</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5417;0.6667" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/5</tspan>  The roll is drawn through the U-notch of the comb cradle, which strips it off the mandrel, flap at 5 o'clock</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6667;0.7500" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/5</tspan>  Four rolls in the cradle: a two-tine raft fork is pushed through the guide slots and all four rolls</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.7500" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">5/5</tspan>  Searing: the raft lies seam down in the rondeau; after 90 s the roll turns it about its tines</text></g>
