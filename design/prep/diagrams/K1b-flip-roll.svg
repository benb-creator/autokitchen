<text x="1325" y="672" class="s c">rondeau Ø 280 on H1, 220 °C</text>
<g><animateTransform attributeName="transform" type="rotate" values="0 1190 608;0 1190 608;180 1190 608;180 1190 608" keyTimes="0.0000;0.8333;0.8750;1.0000" dur="24s" repeatCount="indefinite"/><circle cx="1190" cy="608" r="24" fill="#b85a4a" stroke="#3a3f45" stroke-width="2"/><path d="M1190 584 a24 24 0 0 0 0 48" fill="none" stroke="#6b3020" stroke-width="6" opacity="0" /><path d="M1190 632 a24 24 0 0 1 0 -48" fill="none" stroke="#6b3020" stroke-width="7"/></g>
