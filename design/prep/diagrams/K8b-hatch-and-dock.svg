<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- K8b hatch with pass tray and dosing dock. Source: K8b 2.1, 2.2 (actuators 9, 10), 2.5 (W hatch, P dosing), 2.8 (interfaces). Panel A front view X/Z at 0.6 px/mm; panel B side section Y/Z at 0.8 px/mm with a break between ceiling and floor. Simplifications: the transport gripper is drawn as a plain hook; the cam link between tilter and port shutter is drawn as a rod; the box size is a GN 1/6-100 (the document does not fix the box size at the dock); dose readout values are an example. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K8b  Hatch, pass tray and dosing dock — how things get in</text>
<text x="24" y="58" class="m">The transport never enters the tub: it leaves trays on an outer sill and boxes in a dock above the ceiling.</text>
<text x="1576" y="28" class="s r b">hatch: left wall at floor level, opening 360 × 250</text>
<text x="1576" y="47" class="s r">pass tray 300 × 360 on two load cells (±2 g)</text>
<text x="1576" y="66" class="s r">dock tilter 0–150°, load cells 10 kg ±1 g</text>
<text x="1576" y="85" class="s r">per 4-person meal ≈ 12 boxes, ≈ 8 trays in, ≈ 8 out</text>
<text x="24" y="100" class="s b">A  HATCH AND PASS TRAY (front view)</text>
