<text x="1530" y="474" class="s r">port shutter, cam-linked to the tilter</text>
<rect x="1100" y="388" width="16" height="52" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1.2"/>
<rect x="1270" y="388" width="16" height="52" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1.2"/>
<path d="M1100 388 l8 -10 l8 10 Z M1270 388 l8 -10 l8 10 Z" fill="#9aa1a8" stroke="#3a3f45" stroke-width="1"/>
<text x="1090" y="420" class="s r">load cells</text>
<g><animateTransform attributeName="transform" type="rotate" values="0 1260 380;0 1260 380;125 1260 380;123 1260 380;127 1260 380;123 1260 380;127 1260 380;123 1260 380;127 1260 380;123 1260 380;127 1260 380;123 1260 380;127 1260 380;123 1260 380;127 1260 380;123 1260 380;127 1260 380;123 1260 380;125 1260 380;0 1260 380;0 1260 380" keyTimes="0;0.62;0.68;0.69;0.7;0.71;0.72;0.74;0.75;0.76;0.78;0.79;0.8;0.81;0.82;0.84;0.85;0.86;0.88;0.92;1" dur="24s" repeatCount="indefinite"/><rect x="1110" y="376" width="164" height="6" fill="#f28c28" stroke="#3a3f45" stroke-width="1.2"/><circle cx="1260" cy="380" r="6" fill="#3a3f45"/><g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.5" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 -200;0 -200;0 0;0 0;0 -200" keyTimes="0;0.5;0.58;0.93;1" dur="24s" repeatCount="indefinite"/><path d="M1122 290 L1122 370 L1260 370 L1260 290" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><rect x="1126" y="312" width="130" height="52" fill="#efe3c4"><animate attributeName="height" values="52;52;6;6;6;52" keyTimes="0;0.67;0.88;0.93;0.98;1" dur="24s" repeatCount="indefinite"/><animate attributeName="y" values="312;312;358;358;358;312" keyTimes="0;0.67;0.88;0.93;0.98;1" dur="24s" repeatCount="indefinite"/></rect><line x1="1114" y1="290" x2="1268" y2="290" stroke="#3a3f45" stroke-width="3"/></g></g></g>
<path d="M1266 400 q-8 120 -6 240" fill="none" stroke="#efe3c4" stroke-width="14" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.68;0.87" dur="24s" repeatCount="indefinite" calcMode="discrete"/></path>
<path d="M1266 400 q-8 120 -6 240" fill="none" stroke="#c9b78e" stroke-width="2" stroke-dasharray="4 8" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.68;0.87" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="stroke-dashoffset" from="-12" to="0" dur="0.3s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.5" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="1110" y="340" class="s r">opened box</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.5" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 -200;0 -200;0 0;0 -120;0 -120;0 0;0 -200" keyTimes="0;0.5;0.58;0.61;0.9;0.93;1" dur="24s" repeatCount="indefinite"/><line x1="1191" y1="250" x2="1191" y2="278" stroke="#555" stroke-width="4"/><line x1="1114" y1="278" x2="1268" y2="278" stroke="#555" stroke-width="4"/><line x1="1114" y1="278" x2="1114" y2="294" stroke="#555" stroke-width="3"/><line x1="1268" y1="278" x2="1268" y2="294" stroke="#555" stroke-width="3"/></g></g>
<text x="1100" y="220" class="s r">transport hook</text>
<text x="1100" y="236" class="s r">(rests on the rim)</text>
<rect x="1380" y="200" width="150" height="56" fill="#2b2f33" stroke="#3a3f45" stroke-width="1.5"/>
<text x="1455" y="218" class="s c w">dose</text>
<text x="1455" y="246" class="m c b w" opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.68" dur="24s" repeatCount="indefinite" calcMode="discrete"/>0 g</text>
<text x="1455" y="246" class="m c b w" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.68;0.72" dur="24s" repeatCount="indefinite" calcMode="discrete"/>40 g</text>
<text x="1455" y="246" class="m c b w" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.72;0.75" dur="24s" repeatCount="indefinite" calcMode="discrete"/>95 g</text>
<text x="1455" y="246" class="m c b w" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.78" dur="24s" repeatCount="indefinite" calcMode="discrete"/>150 g</text>
<text x="1455" y="246" class="m c b w" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.78;0.82" dur="24s" repeatCount="indefinite" calcMode="discrete"/>200 g</text>
<text x="1455" y="246" class="m c b w" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.82;0.85" dur="24s" repeatCount="indefinite" calcMode="discrete"/>235 g</text>
<text x="1455" y="246" class="m c b w" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.85;0.94" dur="24s" repeatCount="indefinite" calcMode="discrete"/>250 g ✓</text>
<text x="1455" y="274" class="s c">±2° shake meters</text>
<text x="1455" y="290" class="s c">the last grams</text>
<rect x="0" y="852" width="1600" height="48" fill="#eef1f4"/>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">1/6 </tspan>The transport leaves a pass tray with warm plates on the outer sill; the sill weighs it. Nothing of the transport enters the tub.<animate attributeName="opacity" values="1;0" keyTimes="0;0.16" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">2/6 </tspan>The guillotine shutter rises; P1 hooks the tray with the vessel fork and pulls it in over the well.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.16;0.35" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">3/6 </tspan>Loaded trays go out the same way; the shutter closes.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.35;0.5" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">4/6 </tspan>Ingredients come from above: the transport sets an opened box into the tilter of the dock above the ceiling.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.62" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">5/6 </tspan>The tilter turns the box over its long pour edge; the cam opens the port; ±2° shaking and the load cells meter the dose.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.62;0.88" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">6/6 </tspan>The box turns back, the port shutter closes, the transport takes the box away.<animate attributeName="opacity" values="0;1" keyTimes="0;0.88" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<rect x="0" y="850" width="1600" height="3" fill="#f28c28" transform="scale(0 1)"><animateTransform attributeName="transform" type="scale" values="0 1;1 1" dur="24s" repeatCount="indefinite"/></rect>
</svg>
