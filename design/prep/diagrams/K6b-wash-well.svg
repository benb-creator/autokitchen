<rect x="816" y="92" width="760" height="470" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="828" y="116" class="m b">Standard programme (after hand-over)</text>
<text x="828" y="532" class="s">Rinse water runs on into the tank and regenerates it; the store is reheated at 2 kW only</text>
<text x="828" y="550" class="s">while the oven is off, so washing never competes with cooking for power.</text>
