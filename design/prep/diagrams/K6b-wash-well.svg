<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.1250;0.3333;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/5</tspan>  Load: pot on its side, tray on edge, a tool rack and a plate carrier hang tang-up in the comb; the chuck lets go above the rim</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.3333;0.8333;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/5</tspan>  Wash with the lid closed: cold pre-rinse, 60 °C wash, drain to the tank, 88 °C recirculated rinse for disinfection</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.8333;0.9375;1" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/5</tspan>  Dry: the lid is lifted 30 mm and the well fan blows to the downdraft duct</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.9375;1.0000" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">5/5</tspan>  Lift-out: every item is checked by camera and IR, then goes straight to the closed tower store — nothing waits in the well</text></g>
