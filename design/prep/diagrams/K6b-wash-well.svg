<!-- K6b wash well. Source: K6b-loose-ware-fast-washer.md 2.2, 2.4 (bench, wash well), 5.1 (programmes, verification, clean side), 5.2, 5.7. Front section at 0.75 px/mm. Load pattern: one pot on its side (3 slots), one tray on edge (2 slots), one tool rack (1) and one plate carrier (1) = 7 slots. The 6.5 min standard programme is compressed into 11 s of the loop. -->
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f28c28"/></marker><marker id="ak" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a3f45"/></marker><marker id="aw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4aa3df"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K6b  WASH WELL — one quiet well under the bench for ware and dishes</text>
<text x="24" y="58" class="m">The bench lid stands up as a splash screen, ware hangs tang-up in a comb, a household dishwasher's wash parts do the rest.</text>
<text x="1576" y="28" class="s r b">well 300 × 320 × 420, insulated · 7 comb slots at 45 mm</text>
<text x="1576" y="47" class="s r">standard load 6.5 min, 3.5 L, 0.27 kWh from the 30 L store</text>
<text x="1576" y="66" class="s r">final rinse 88 °C recirculated 60 s: surface ≥ 82 °C ≥ 40 s, A0 ≥ 90</text>
<text x="1576" y="85" class="s r">44–48 dB(A) · 0 W wash heating while cooking</text>
<rect x="30" y="92" width="770" height="752" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="42" y="116" class="m b">Front section through the bench and the well</text>
<text x="42" y="814" class="s">The chuck lifts the lid by its lug to vertical (15 N) and releases every item above the</text>
<text x="42" y="832" class="s">rim — it never enters the well. 16 fan nozzles in the end walls + a rotary head in the floor.</text>
