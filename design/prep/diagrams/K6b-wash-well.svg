<rect x="816" y="578" width="760" height="266" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="828" y="602" class="m b">Other programmes and checks</text>
<text x="832" y="638" class="s b">cold rinse</text>
<text x="946" y="638" class="s">within 2 min of emptying a vessel: 10 s cold fan, 0.3 L</text>
<text x="832" y="678" class="s b">turnaround</text>
<text x="946" y="678" class="s">red (raw-food) item needed again during the meal: 6.5 min</text>
<text x="832" y="718" class="s b">intensive</text>
<text x="946" y="718" class="s">burnt-on soil, failed check, weekly: 6 L, 50 °C, 15 min</text>
<text x="832" y="758" class="s b">verification</text>
<text x="946" y="758" class="s">each item turned before camera (white, UV-A) and IR</text>
<text x="832" y="798" class="s b">throughput</text>
<text x="946" y="798" class="s">4 persons: 6 loads = 39 min after hand-over; 2 persons: 26 min</text>
<rect x="30" y="852" width="1540" height="36" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1" rx="6"/>
