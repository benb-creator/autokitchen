<g opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.2083;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/4</tspan>  The bowl is set over the spindle pocket; its central column slides over the welded thimble</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.2083;0.2500;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/4</tspan>  A rotor drops onto the column; its hub's magnet ring surrounds the thimble</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.2500;0.7500;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/4</tspan>  The motor turns the inner magnet; the rotor follows through the closed thin wall — no shaft through the deck, no seal</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.7500;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/4</tspan>  Bowl and rotor lift off and go to the well; the pocket is flushed and drains</text></g>
