<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- K6b deck spindle. Source: K6b-loose-ware-fast-washer.md 2.4 (deck spindle), 2.5 (spindle ware), 5.6 item 8. Section at 1.6 px/mm. The magnet arrangement (inner rotor in the dry thimble, outer magnet ring in the hub of each rotor) is the simplest reading of 'canned coupling'; the bowl's central column is drawn as a tube round the thimble. -->
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f28c28"/></marker><marker id="ak" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a3f45"/></marker><marker id="aw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4aa3df"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K6b  DECK SPINDLE — a blender drive with no seal</text>
<text x="24" y="58" class="m">A magnet turns inside a closed steel thimble welded into the deck; each rotor carries the other half of the coupling.</text>
<text x="1576" y="28" class="s r b">750 W motor · 0–6 000 rpm · 1.5 Nm</text>
<text x="1576" y="47" class="s r">thimble Ø 40 × 60, deep-drawn, welded in a drained pocket Ø 170 × 120</text>
<text x="1576" y="66" class="s r">bowl Ø 160 × 200 with a central column</text>
<text x="1576" y="85" class="s r">rotors: blade, whisk, spin basket, disc cutter (Ø 140 discs)</text>
<rect x="30" y="92" width="880" height="752" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="42" y="116" class="m b">Section through the spindle pocket</text>
<text x="42" y="814" class="s">Nothing turns through the deck: the steel thimble is closed and welded in. The motor's</text>
<text x="42" y="832" class="s">magnet drives the rotor's magnet ring through the thin wall. Bowl and rotor lift off for the well.</text>
