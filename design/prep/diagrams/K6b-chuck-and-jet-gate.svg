<text x="1182" y="280" class="m b">SOILED: may not touch clean ware</text>
</g>
<g opacity="0" ><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.5625;1.0000" dur="16s" calcMode="discrete" repeatCount="indefinite"/>
<circle cx="1156" cy="274" r="14" fill="#5cb85c" stroke="#3a3f45" stroke-width="1.5"/>
<text x="1182" y="280" class="m b">CLEAN: may grip clean ware</text>
</g>
<g opacity="0" ><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.0625;0.2500;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/>
