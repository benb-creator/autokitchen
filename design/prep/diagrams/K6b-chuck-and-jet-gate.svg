<text x="280" y="226" class="s c">chuck body, central drive rod</text>
<text x="350" y="276" class="s">2 load pins</text>
<g opacity="0" ><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.1875;0.7500;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/>
<rect x="190" y="612" width="180" height="50" fill="#111" stroke="#3a3f45" stroke-width="1"/>
<text x="280" y="645" class="l c b w">2 340 g ✓</text>
<text x="280" y="682" class="s c">every grip is weighed and verified</text>
</g>
<rect x="546" y="92" width="500" height="752" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="558" y="116" class="m b">Trays and pairs</text>
<text x="558" y="796" class="s">Trays carry the tang on a 200 mm spine bar under the</text>
<text x="558" y="814" class="s">flange. Two identical pans are each other's partner:</text>
<text x="558" y="832" class="s">a passive hook tab locks the far side before turning.</text>
<rect x="606" y="212" width="330" height="10" fill="#9fb3c6" stroke="#3a3f45" stroke-width="1.5"/>
<path d="M616 222 L926 222 L916 282 L626 282 Z" fill="#dbe5ee" stroke="#3a3f45" stroke-width="1.5"/>
<rect x="936" y="208" width="18" height="16" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.2"/>
<rect x="736" y="222" width="200" height="6" fill="#5d7a95" stroke="#3a3f45" stroke-width="1"/>
<rect x="951" y="172" width="6" height="60" fill="#c9d6e3" stroke="#3a3f45" stroke-width="1.5"/>
<text x="756" y="246" class="s c">spine bar 200 mm</text>
<text x="966" y="182" class="s">tang</text>
<text x="606" y="198" class="s">GN tray (flat flange)</text>
<text x="606" y="312" class="s">Heavy vessels are slid on the flush deck, not lifted.</text>
