<g opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.1875;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/4</tspan>  A grip: the jaws close on the tang, the conical pins pass the two holes; the load pins report the weight</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.1875;0.3125;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/4</tspan>  Pairs: the second pan is set on, the passive hook tab locks the far side, both tangs are in the jaws</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.3125;0.5625;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/4</tspan>  Soiled grip done: on its way out of the well the chuck stops 3 s between the two hot fan jets over the hopper</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.5625;1.0000" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/4</tspan>  The controller now marks the chuck clean; only then may it touch clean ware or dishes</text></g>
