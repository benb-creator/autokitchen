<!-- K6b chuck, tangs and jet gate. Source: K6b-loose-ware-fast-washer.md 2.1 rule 1, 2.3 (chuck), 2.4 (hopper and jet gate), 2.5 (hermaphroditic pans with hook tab), 5.2. Tang at 3 px/mm, others schematic. The chuck is drawn from the side with the jaws closing in Y. -->
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f28c28"/></marker><marker id="ak" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a3f45"/></marker><marker id="aw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4aa3df"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K6b  ONE TANG, ONE CHUCK — and a jet gate that keeps the chuck clean</text>
<text x="24" y="58" class="m">Every item has the same flat tang. The chuck's pins pass its two holes; two load pins weigh every grip; soiled jaws are rinsed.</text>
<text x="1576" y="28" class="s r b">tang 6 × 32 × 60, two Ø 8 holes, drip collar or dam</text>
<text x="1576" y="47" class="s r">chuck stroke 2 × 22 mm, 20–400 N, load pins ±5 g to 6 kg</text>
<text x="1576" y="66" class="s r">jet gate: 85–90 °C, 3 s and 0.1 L per soiled grip</text>
<text x="1576" y="85" class="s r">after raw (class R) items: 10 s, A0 ≈ 60 on the jaws</text>
<rect x="30" y="92" width="500" height="752" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="42" y="116" class="m b">Pin chuck on the tang</text>
<text x="42" y="796" class="s">Two parallel jaws with conical pins pass the tang's</text>
<text x="42" y="814" class="s">holes (form fit, ±3 mm self-centring). Sockets are</text>
<text x="42" y="832" class="s">drilled through so the jet can rinse them.</text>
<rect x="271" y="292" width="18" height="180" fill="#c9d6e3" stroke="#3a3f45" stroke-width="2"/>
<line x1="271" y1="346" x2="289" y2="346" stroke="#777" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="271" y1="418" x2="289" y2="418" stroke="#777" stroke-width="1" stroke-dasharray="2 2"/>
<text x="210" y="412" class="s r">tang, edge-on</text>
<text x="210" y="429" class="s r">(6 mm thick)</text>
<path d="M190 502 Q280 472 370 502" fill="none" stroke="#8fa8c0" stroke-width="3"/>
<rect x="276" y="472" width="8" height="70" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.2"/>
<text x="350" y="492" class="s">drip collar</text>
<text x="300" y="542" class="s">stem / vessel</text>
