<rect x="946" y="476" width="30" height="66" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/>
<text x="596" y="597" class="s">the chuck holds both tangs back to back</text>
<text x="596" y="572" class="s">hook tab locks the far side</text>
<g opacity="0" ><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3125;1.0000" dur="16s" calcMode="discrete" repeatCount="indefinite"/>
<text x="776" y="442" class="m c b">pair locked → may be rolled over</text>
</g>
<rect x="1062" y="92" width="514" height="752" fill="#fbfbfc" stroke="#b8bec5" stroke-width="1.2" rx="8"/>
<text x="1074" y="116" class="m b">Jet gate over the hopper</text>
<text x="1074" y="796" class="s">After every grip of a soiled item, the chuck passes</text>
<text x="1074" y="814" class="s">two fan nozzles on its way out of the well: 3 s,</text>
<text x="1074" y="832" class="s">0.1 L at 88 °C (10 s after raw food).</text>
<path d="M1202 562 L1422 562 L1352 682 L1272 682 Z" fill="#dfe6ec" stroke="#3a3f45" stroke-width="2"/>
<rect x="1252" y="568" width="120" height="30" fill="#c7ccd1" stroke="#3a3f45" stroke-width="1.2"/>
<text x="1432" y="622" class="s">hopper</text>
<text x="1432" y="639" class="s">150 × 170,</text>
<text x="1432" y="656" class="s">strainer → drain</text>
