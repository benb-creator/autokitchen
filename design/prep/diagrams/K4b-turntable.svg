<!-- K4b turntables T (P1) and T2 (P2). Source: design/prep/concepts/K4b-shuttle-mat.md sections 2.1 (TURN), 2.4, 3.1 G3, 3.5, 3.7, 3.8, 3.11. Panels A, B, D are top views, panel C a top view of a plate; not to scale. Simplest readings: the hung tool is drawn as a fixed roller plus scraper reaching in from the back wall; speeds are slowed for the eye; the plating order follows 3.11 with one element per 2 s. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}.i{font-style:italic}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K4b  TURNTABLES — the vessel turns under a still tool, so the arm is free</text>
<text x="24" y="58" class="m">T (P1, 0–600 rpm) and T2 (P2, 0–120 rpm) turn pots, bowls and plates through closed thimbles; tools hang from wall pegs.</text>
<text x="1576" y="28" class="s r b">T: 15 Nm, 0–600 rpm · T2: 15 Nm, 0–120 rpm · both canned</text>
<text x="1576" y="47" class="s r">hung tools on two back-wall pegs (Ankarsrum principle)</text>
<text x="1576" y="66" class="s r">torque logged = dough end point</text>
<text x="1576" y="85" class="s r">plating: T gives the angle, the arm the radius</text>
<rect x="30" y="100" width="760" height="364" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="42" y="122" class="s b">A  KNEAD / MIX: bowl turns against a hung roller frame</text>
<rect x="800" y="100" width="760" height="364" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="812" y="122" class="s b">B  SPIN-COAT: a pancake without a swirl arm</text>
<rect x="30" y="476" width="760" height="364" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="42" y="498" class="s b">C  POLAR PLATING on P1: angle by T, radius by the arm</text>
<rect x="800" y="476" width="760" height="364" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="812" y="498" class="s b">D  KNURLED DISC (third peel mechanism)</text>
