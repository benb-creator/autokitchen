<text x="1160" y="218" class="s">turned by the pan-pair flip</text>
<text x="1160" y="236" class="s">(see the arm diagram)</text>
<text x="1160" y="270" class="s">cycle 2 min,</text>
<text x="1160" y="288" class="s">8 pancakes ≈ 17 min</text>
