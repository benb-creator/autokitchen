<text x="425" y="387" class="s b">shoulder X 700, Z 1520</text>
<text x="425" y="404" class="s">cartridge through the wall</text>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.1875" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">reaches: hem of a mat (table)</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.1875;0.3750" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">reaches: holding the hem: catch</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3750;0.5625" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">reaches: pan on P3</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.5625;0.7188" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">reaches: press tube / bowl on P1</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.7188;0.8750" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">reaches: under the box cradle</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.8750" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">reaches: ware port</tspan></text></g>
<text x="48" y="790" class="s">Stiff closed links (twist + bending ≤ 0.5 mrad at 10 Nm): the mat stays on track</text>
<text x="48" y="808" class="s">within 0.15 mm over its 280 mm width. Purple dots = the only two seals of the arm.</text>
<text x="48" y="826" class="s">Rules: the bar never passes under the parked blade or over P1 while the press swings.</text>
<rect x="785" y="100" width="785" height="370" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="797" y="122" class="s b">B  SHOE ON THE TAB: form fit for carrying, magnet only for turning over</text>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.5000" dur="16s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -30;0 -30;0 -30" keyTimes="0.0000;0.1875;0.2500;0.5000;1.0000" dur="16s" repeatCount="indefinite"/><rect x="870" y="320" width="180" height="80" fill="#b9c7d6" stroke="#3a3f45" stroke-width="2"/><path d="M945,280 L975,280 L982,320 L938,320 Z" fill="#7a828a" stroke="#3a3f45" stroke-width="1.5"/><g><animateTransform attributeName="transform" type="translate" values="0 -90;0 -90;0 0;0 0;0 0" keyTimes="0.0000;0.0625;0.1562;0.5000;1.0000" dur="16s" repeatCount="indefinite"/><path d="M930,270 L990,270 L990,324 L982,324 L975,286 L945,286 L938,324 L930,324 Z" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/><rect x="940" y="230" width="40" height="40" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.2"/></g></g></g>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.5000" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="1070" y="260" class="s">dovetail tab on every item,</text><text x="1070" y="277" class="s">facing the back wall: the shoe</text><text x="1070" y="294" class="s">slides over it from above and</text><text x="1070" y="311" class="s">holds it upright or tilted ≤ 90°</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.5000" dur="16s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="rotate" values="0 1070 300;0 1070 300;180 1070 300;180 1070 300" keyTimes="0.0000;0.6250;0.6750;1.0000" dur="16s" repeatCount="indefinite"/><path d="M1115,306 L1122,324 L1238,324 L1245,306" fill="#b9c7d6" stroke="#3a3f45" stroke-width="2"/><path d="M1115,294 L1122,276 L1238,276 L1245,294" fill="#d0d8e2" stroke="#3a3f45" stroke-width="2"/><ellipse cx="1180" cy="319" rx="45" ry="4" fill="#f2d36b" stroke="#3a3f45" stroke-width="1"/><path d="M1085,278 L1115,284 L1115,316 L1085,322 Z" fill="#7a828a" stroke="#3a3f45" stroke-width="1"/><rect x="1055" y="270" width="30" height="60" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.5625;0.7188" dur="16s" repeatCount="indefinite" calcMode="discrete"/><circle cx="1070" cy="300" r="22" fill="none" stroke="#3a3f45" stroke-width="4" style="stroke:#e04a3a"/><text x="1070" y="150" class="m b c" style="fill:#e04a3a">magnet ON: 400 N</text></g><text x="1300" y="360" class="s">pan pair (pancake): both tabs</text><text x="1300" y="377" class="s">in the shoe, turned 180° in 0.8 s</text></g>
<text x="800" y="455" class="s">Same shoe: lift-rack pair (Schnitzel), unmoulding, every pot, tray, plate, cup and tool.</text>
<rect x="785" y="482" width="390" height="358" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="797" y="504" class="s b">C  BAR TAKES THE HEM</text>
<path d="M810,652 L950,652" fill="none" stroke="#8cc29a" stroke-width="5"/>
<g><animateTransform attributeName="transform" type="translate" values="-60 0;-60 0;0 0;0 0" keyTimes="0.0000;0.1250;0.2188;1.0000" dur="16s" repeatCount="indefinite"/><circle cx="950" cy="652" r="6" fill="#555" stroke="#3a3f45" stroke-width="1"/></g>
<g><animateTransform attributeName="transform" type="rotate" values="0 980 650;0 980 650;180 980 650;180 980 650" keyTimes="0.0000;0.2500;0.3438;1.0000" dur="16s" repeatCount="indefinite"/><circle cx="980" cy="650" r="32" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/><rect x="940" y="646" width="34" height="12" fill="#fbfbfc" stroke="#3a3f45" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.3438" dur="16s" repeatCount="indefinite" calcMode="discrete"/><path d="M810,652 L970,684 A34,34 0 0 0 1010,632" fill="none" stroke="#8cc29a" stroke-width="5"/></g>
<text x="800" y="560" class="s">the hem rod slides into the key slot</text>
<text x="800" y="577" class="s">along the bar; half a turn wraps the</text>
<text x="800" y="594" class="s">mat over it and E holds it</text>
<text x="800" y="760" class="s">UHMW doctor lip on the forearm</text>
<text x="800" y="777" class="s">wipes the mat before it winds.</text>
<text x="800" y="810" class="s">Bar spin: canned coupling at the wrist.</text>
<rect x="1185" y="482" width="385" height="358" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="1197" y="504" class="s b">D  PIN: rings set the thickness</text>
<rect x="1200" y="720" width="350" height="8" fill="#8cc29a" stroke="#3a3f45" stroke-width="1.2"/>
<text x="1210" y="748" class="s">mat D lies still on the table</text>
<rect x="1240" y="698" width="60" height="22" rx="6" fill="#ead7a7" stroke="#3a3f45" stroke-width="1.5"><animate attributeName="width" values="60;60;180;200;260;260" keyTimes="0.0000;0.0625;0.3125;0.5625;0.8125;1.0000" dur="16s" repeatCount="indefinite"/><animate attributeName="height" values="22;22;9;7;5;5" keyTimes="0.0000;0.0625;0.3125;0.5625;0.8125;1.0000" dur="16s" repeatCount="indefinite"/><animate attributeName="y" values="698;698;711;713;715;715" keyTimes="0.0000;0.0625;0.3125;0.5625;0.8125;1.0000" dur="16s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;230 0;0 0;230 0;0 0" keyTimes="0.0000;0.0625;0.3125;0.5625;0.8125;1.0000" dur="16s" repeatCount="indefinite"/><circle cx="1250" cy="690" r="25" fill="#e8d9a8" stroke="#3a3f45" stroke-width="1.5"/><circle cx="1250" cy="690" r="30" fill="none" stroke="#3a3f45" stroke-width="3" style="stroke:#f28c28"/><line x1="1250" y1="690" x2="1250" y2="640" stroke="#c4cad1" stroke-width="6"/><rect x="1238" y="625" width="24" height="16" fill="#f28c28" stroke="#3a3f45" stroke-width="1"/></g>
<text x="1200" y="560" class="s">pin Ø 50 × 300 with end rings</text>
<text x="1200" y="577" class="s">1 / 2 / 4 / 6 / 10 mm: the rings</text>
<text x="1200" y="594" class="s">roll on the mat beads, so the gap</text>
<text x="1200" y="611" class="s">is set by the rings, not the arm</text>
<text x="1200" y="790" class="s">dough 380 × 280 × 4 in 8–10 passes;</text>
<text x="1200" y="807" class="s">cutlets 5 mm; patties 22 mm</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f2f3f5" stroke="#d0d4d9"/>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.5000" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">1/2</tspan> One arm reaches table, mats, P1–P3, the box cradle and the port; vessels hang from the shoe, the mat hem from the bar</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.5000" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">2/2</tspan> For turning over (pan pair, rack pair, unmoulding) the electro-permanent magnet adds 400 N to the dovetail</text></g>
</svg>
