<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- K4b arm. Source: design/prep/concepts/K4b-shuttle-mat.md sections 2.1, 2.3 (links, cartridge, bar, shoe, stiffness, collision rules), 2.5, 3.4 (rack pair), 3.7 (pin), 3.8 (pan-pair flip). Panel A front view X/Z at 0.42 px/mm with one fixed elbow branch (the document does not say which); panels B-D close-ups, not to scale. Simplest readings: the dovetail tab is drawn as a vertical dovetail rail the shoe slides down over; the hem key slot is drawn as a slot along the bar that the hem rod enters from the side. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}.i{font-style:italic}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K4b  ARM — one wall arm with two ends: a bar for the mat hem, a shoe for every piece of ware</text>
<text x="24" y="58" class="m">Two closed links in the rear gallery; all motors in the dry room behind the wall; the bar turns through a canned coupling.</text>
<text x="1576" y="28" class="s r b">links 420 + 420 mm, box 50 × 100 · payload 8 kg at 800 mm</text>
<text x="1576" y="47" class="s r">shoulder 150 Nm (lip seal Ø 90) · elbow 80 Nm (lip seal Ø 60)</text>
<text x="1576" y="66" class="s r">bar Ø 40 × 345 along Y, 15 Nm, 0–200 rpm, canned (no seal)</text>
<text x="1576" y="85" class="s r">shoe: dovetail + electro-permanent magnet 400 N</text>
<rect x="30" y="100" width="740" height="740" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="42" y="122" class="s b">A  FRONT VIEW: the arm moves in the plane of the back wall</text>
<clipPath id="pa"><rect x="32" y="160" width="736" height="610"/></clipPath>
<g clip-path="url(#pa)"><circle cx="395" cy="413" r="378" fill="none" stroke="#3a3f45" stroke-width="1.5" stroke-dasharray="6 5" style="stroke:#9aa1a8"/></g>
<text x="595" y="163" class="s">reach 840 mm</text>
<rect x="80" y="602" width="180" height="8" fill="#b9c3cc" stroke="#3a3f45" stroke-width="1.2"/>
<text x="170" y="624" class="s c">table + mats</text>
<circle cx="262.25" cy="602" r="5" fill="#c5ced8" stroke="#3a3f45" stroke-width="1"/>
<rect x="311.75" y="728" width="380.25" height="8" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1.2"/>
<rect x="320.75" y="669.5" width="108" height="58.5" fill="#b9c7d6" stroke="#3a3f45" stroke-width="1.2"/>
<text x="374.75" y="750" class="s c b">P1</text>
<rect x="446.75" y="669.5" width="108" height="58.5" fill="#b9c7d6" stroke="#3a3f45" stroke-width="1.2"/>
<text x="500.75" y="750" class="s c b">P2</text>
<rect x="572.75" y="669.5" width="108" height="58.5" fill="#b9c7d6" stroke="#3a3f45" stroke-width="1.2"/>
<text x="626.75" y="750" class="s c b">P3</text>
<rect x="86.75" y="494" width="69.75" height="45" fill="#f5f0e1" stroke="#3a3f45" stroke-width="1.2"/>
<text x="120.5" y="488" class="s c">box cradle</text>
<rect x="687.5" y="593" width="10" height="108" fill="#ffffff" stroke="#3a3f45" stroke-width="1"/>
<text x="683" y="647" class="s r">port</text>
