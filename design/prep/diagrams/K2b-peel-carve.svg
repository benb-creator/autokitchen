<path d="M1300 670 a40 10 0 1 0 1 0" fill="none" stroke="#f28c28" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="1380" y="680" class="s b" style="fill:#c0661a">T 30 rpm</text>
<g><animateTransform attributeName="transform" type="translate" values="1415 376;1415 376;1400 376;1280 376;1280 330;1410 300;1415 376" keyTimes="0.0000;0.6667;0.7083;0.8083;0.8333;0.8958;1.0000" dur="24s" repeatCount="indefinite"/><rect x="0" y="-3" width="120" height="6" fill="#b4bac1" stroke="#3a3f45" stroke-width="1.5"/><rect x="120" y="-12" width="30" height="24" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8083;0.8958" dur="24s" calcMode="discrete" repeatCount="indefinite"/><rect x="0" y="-18" width="115" height="14" fill="#c46a5a" stroke="#3a3f45" stroke-width="1.5"/></g></g>
<line x1="1420" y1="350" x2="1380" y2="350" stroke="#f28c28" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="1426" y="345" class="s" style="fill:#c0661a">feed 2–3 mm/s</text>
<text x="1086" y="180" class="s">the edge slides at 0.16 m/s at r 50 while it</text>
<text x="1086" y="198" class="s">is pushed only 2–3 mm/s: a draw cut,</text>
<text x="1086" y="216" class="s">normal force 3–5 × lower, braised meat</text>
<text x="1086" y="234" class="s">does not tear</text>
<text x="1086" y="252" class="s"></text>
<text x="1086" y="270" class="s">the slice lies on the blade and is carried</text>
<text x="1086" y="288" class="s">to the plate; the stripper bar slides it off;</text>
<text x="1086" y="306" class="s">Z steps down 4–6 mm (firm), 8–10 (braised)</text>
<text x="1086" y="700" class="s">≈ 25 s per slice; the bottom 30 mm</text>
<text x="1086" y="718" class="s">stay on the spit (end piece)</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/3</tspan>  M1 T-lathe: the apple stands on the spit plate and turns with T; the Wender runs the sprung peeler from pole to pole along its silhouette</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.6667" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/3</tspan>  M2: a long item on the roll spit is laid on the long sprung blade of the blade post; one turn of the roll peels the whole length</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.6667" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/3</tspan>  Carving: a wide flat blade is fed slowly towards the centre while T turns the roast; the parted slice is carried away on the blade</text></g>
