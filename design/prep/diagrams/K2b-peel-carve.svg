<text x="720" y="670" class="s r b" style="fill:#c0661a">roll</text>
<text x="566" y="780" class="s">stripes for cucumber salad: one plunge per indexed stripe</text>
<text x="1086" y="120" class="s b">CARVING by parting on T: a draw cut</text>
<text x="1086" y="140" class="s">(boneless roast, braised meat, cake portions)</text>
<rect x="1120" y="640" width="420" height="10" fill="#5a6068" stroke="none" stroke-width="0"/>
<rect x="1220" y="620" width="200" height="20" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5"/>
