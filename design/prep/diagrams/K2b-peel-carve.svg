<text x="810" y="616" class="s c">blade post on the board carrier;</text>
<text x="810" y="634" class="s c">its arm rests in the anchor fork</text>
<text x="664" y="464" class="s r">sprung blade</text>
<rect x="680" y="462" width="280" fill="#3f7a2a" opacity="0.8"><animate attributeName="height" values="0;0;70;70;0;0" keyTimes="0.0000;0.3750;0.5417;0.6625;0.6667;1.0000" dur="24s" repeatCount="indefinite"/></rect>
<text x="880" y="705" class="s b">end view</text>
