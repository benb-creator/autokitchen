<text x="46" y="120" class="s b">M1  T-LATHE: the apple turns, the peeler is held</text>
<text x="46" y="140" class="s">(apple, pear, potato, kohlrabi, citrus à vif …)</text>
<rect x="80" y="640" width="420" height="10" fill="#5a6068" stroke="none" stroke-width="0"/>
<text x="280" y="670" class="s c">KH glass; spit plate on the T plug</text>
