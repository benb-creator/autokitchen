<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K2b  "T turns, the Wender holds": peeling, long peeling and carving</text>
<text x="24" y="58" class="m">The turntable T supplies the cutting motion; the Wender only places a fixed blade and feeds it. Three mechanisms on stations that exist anyway.</text>
<text x="1576" y="28" class="s r b">M1 T-lathe: T 60–150 rpm, sprung peeler 3–6 N, shoes 1 / 2.5 / 5 mm</text>
<text x="1576" y="47" class="s r">M2 roll spit on the blade post: roll 60–120 rpm, one turn peels the length</text>
<text x="1576" y="66" class="s r">M3 food mill (see the KH diagram) · tube corers Ø 14 / 22 / 42</text>
<text x="1576" y="85" class="s r">parting: blade fed 2–3 mm/s, T 30 rpm, slice-to-push ≈ 60</text>
<rect x="30" y="96" width="500" height="740" fill="#ffffff" stroke="#c4cad1" stroke-width="1" rx="8"/>
