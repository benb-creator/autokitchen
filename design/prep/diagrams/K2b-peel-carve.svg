<text x="50" y="190" class="s">the Wender holds the sprung peeler</text>
<text x="50" y="208" class="s">by its T45 neck and runs it pole to</text>
<text x="50" y="226" class="s">pole in Z; X follows the camera</text>
<text x="50" y="244" class="s">silhouette; 10–12 mm feed per turn</text>
<text x="50" y="262" class="s"></text>
<text x="50" y="280" class="s">eyes: Ø 14 corer pushed in X</text>
<text x="50" y="298" class="s">core: Ø 22 tube spit, pusher cup</text>
<text x="50" y="316" class="s">then 8 knife plunges while T</text>
<text x="50" y="334" class="s">indexes 45°: wedges</text>
<text x="566" y="120" class="s b">M2  ROLL SPIT: one turn peels the whole length</text>
<text x="566" y="140" class="s">(cucumber, carrot, courgette, daikon — katsuramuki)</text>
<rect x="560" y="300" width="60" height="150" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/>
<text x="590" y="290" class="s c">roll unit</text>
