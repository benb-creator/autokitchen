<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- K8b T-lathe. Source: K8b 3.1 principle 2, 3.2 (potato, cabbage). Panel A front view at 1.5 px/mm, B top view at 1.5 px/mm, C front view at 1.2 px/mm. Simplifications: the corkscrew spit is drawn as a plain spike, the shoe blade as a small blade on an arm; cabbage parting cuts are drawn every 12 mm instead of every 2.5 mm so that they stay visible. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K8b  T-lathe — the food turns, the tool is only held</text>
<text x="24" y="58" class="m">The turning hub spins the produce on a spit; a puck holds a blade against it. The cutting force comes from T, not from the magnets.</text>
<text x="1576" y="28" class="s r b">T: 30 Nm = 300 N cutting force at r 100</text>
<text x="1576" y="47" class="s r">puck feed only 5–20 N</text>
<text x="1576" y="66" class="s r">peel 1.5 mm (shoe A) · pare 5 mm (shoe B)</text>
<text x="1576" y="85" class="s r">potato 25 s · whole cabbage 1.2 kg in 5 min</text>
<text x="24" y="100" class="s b">A  PEELING A POTATO (front view)</text>
