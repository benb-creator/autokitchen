<g><g><line x1="859" y1="344" x2="859" y2="440" stroke="#e04a3a" stroke-width="4"/><path d="M859 440 L853.55 427.11 L864.45 427.11 Z" fill="#e04a3a"/></g></g>
<text x="872" y="408" class="s b" fill="#e04a3a">cutting force</text>
<text x="872" y="426" class="s">into the wall:</text>
<text x="872" y="444" class="s">no limit there</text>
<g><line x1="914" y1="300" x2="872" y2="318" stroke="#3a3f45" stroke-width="2"/><path d="M872 318 L877.55 312.23 L880 317.96 Z" fill="#3a3f45"/></g>
<text x="918" y="296" class="s">feed 5–20 N</text>
<rect x="834" y="200" width="1" height="1" fill="none"/>
<text x="560" y="630" class="s">The surface at the blade moves towards the wall,</text>
<text x="560" y="648" class="s">so the work pushes the tool onto the skin, where</text>
<text x="560" y="666" class="s">the skids carry any force. The magnets only position.</text>
