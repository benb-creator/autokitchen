<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.68" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="1290" y="184" class="s c b">knife point plunged down at r 22</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.68" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="1290" y="184" class="s c b">wide blade plunged across every 2.5 mm</text></g>
<text x="1290" y="680" class="s c">core column stays on the spit;</text>
<text x="1290" y="698" class="s c">the leaf rings are the shreds</text>
<rect x="0" y="852" width="1600" height="48" fill="#eef1f4"/>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">1/4 </tspan>Peel: T spins the potato on a spit; the puck only holds shoe blade A and follows the shape from pole to pole.<animate attributeName="opacity" values="1;0" keyTimes="0;0.33" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">2/4 </tspan>Why the magnets suffice: the surface at the blade runs towards the wall, so the cut pushes the tool INTO the wall.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.33;0.5" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">3/4 </tspan>Cabbage: the knife point goes straight down at r 22 while T turns; a core column is cut free (trepan).<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.68" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">4/4 </tspan>Then a wide blade is pushed in across, again and again from the top: the head becomes a stack of leaf rings = shreds.<animate attributeName="opacity" values="0;1" keyTimes="0;0.68" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<rect x="0" y="850" width="1600" height="3" fill="#f28c28" transform="scale(0 1)"><animateTransform attributeName="transform" type="scale" values="0 1;1 1" dur="24s" repeatCount="indefinite"/></rect>
</svg>
