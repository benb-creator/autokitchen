<text x="560" y="100" class="s b">B  WHY THE MAGNETS ARE ENOUGH (top view)</text>
<rect x="560" y="550" width="420" height="22" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5"/>
<line x1="560" y1="550" x2="980" y2="550" stroke="#5d6a78" stroke-width="3"/>
<text x="770" y="567" class="s c">drive wall</text>
