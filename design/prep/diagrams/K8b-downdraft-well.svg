<text x="820" y="560" class="s b">C  AIR ALWAYS RUNS FROM CLEAN TO DIRTY</text>
<rect x="830" y="590" width="180" height="56" fill="#e4f1ea" stroke="#3a3f45" stroke-width="1.5"/>
<text x="920" y="623" class="s c b">tool nook</text>
<rect x="1050" y="590" width="180" height="56" fill="#f6f7f8" stroke="#3a3f45" stroke-width="1.5"/>
<text x="1140" y="623" class="s c b">work zone (food)</text>
<rect x="1290" y="590" width="180" height="56" fill="#ffffff" stroke="#3a3f45" stroke-width="1.5"/>
<text x="1380" y="623" class="s c b">well (down)</text>
<rect x="1290" y="680" width="180" height="46" fill="#ffffff" stroke="#3a3f45" stroke-width="1.5"/>
<text x="1380" y="708" class="s c b">hob exhaust (rear)</text>
<line x1="1010" y1="618" x2="1042" y2="618" stroke="#3c9a6a" stroke-width="3" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></line>
<path d="M1050 618 l-10 -6 l0 12 Z" fill="#3c9a6a"/>
<line x1="1230" y1="618" x2="1282" y2="618" stroke="#3c9a6a" stroke-width="3" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></line>
<path d="M1290 618 l-10 -6 l0 12 Z" fill="#3c9a6a"/>
<path d="M1230 630 L1260 703 L1282 703" fill="none" stroke="#3c9a6a" stroke-width="3" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<path d="M1290 703 l-10 -6 l0 12 Z" fill="#3c9a6a"/>
<text x="830" y="680" class="s">A tool enters the nook only after</text>
<text x="830" y="698" class="s">the well cycle; it arrives at 80 °C</text>
<text x="830" y="716" class="s">and is dry in about a minute.</text>
<text x="830" y="770" class="s">The well is also the produce sink (15 L bath), the cooling bath and the waste port.</text>
<rect x="0" y="852" width="1600" height="48" fill="#eef1f4"/>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">1/6 </tspan>P1 brings a turner that touched raw meat and lowers it on edge into the well, well below the floor.<animate attributeName="opacity" values="1;0" keyTimes="0;0.17" dur="30s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">2/6 </tspan>Wash 20 s: 60 °C liquor from the tank through 8 jets; the exhaust pulls air down through the mouth, so spray stays in the well.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.17;0.4" dur="30s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">3/6 </tspan>Rinse 8 s: fresh 85 °C water.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.5" dur="30s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">4/6 </tspan>Sanitise (raw-meat items): 85 °C water circulates through the well for 60 s; the surface stays ≥ 82 °C; logged.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.79" dur="30s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">5/6 </tspan>Lifted under the ceiling camera (white and UV-A light) for a check.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.79;0.87" dur="30s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">6/6 </tspan>Hung back in the nook, where filtered warm air dries it. That air then flows down into the well.<animate attributeName="opacity" values="0;1" keyTimes="0;0.87" dur="30s" repeatCount="indefinite" calcMode="discrete"/></text>
<rect x="0" y="850" width="1600" height="3" fill="#f28c28" transform="scale(0 1)"><animateTransform attributeName="transform" type="scale" values="0 1;1 1" dur="30s" repeatCount="indefinite"/></rect>
</svg>
