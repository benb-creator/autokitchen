<!-- K8b downdraft well and clean-air nook. Source: K8b 2.5 (W well, W nook), 5.1, 5.2. Section X/Z at 0.6 px/mm through the W column. Simplifications: the turner hangs on a short link below the puck (the document says the vessel fork with a 150 mm drop link); the 180 deg turn of the item halfway through the wash is not drawn (both faces face jets anyway); cycle times compressed; the temperature curve is schematic (values from 5.1). -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K8b  Downdraft well and clean-air tool nook</text>
<text x="24" y="58" class="m">Every item is washed as soon as it is free, during the meal, 40–400 mm below the floor; clean tools wait upstream in filtered air.</text>
<text x="1576" y="28" class="s r b">well mouth 180 × 340, 450 deep, 8 flat-fan jets</text>
<text x="1576" y="47" class="s r">exhaust 100 m³/h = 0.45 m/s down through the mouth</text>
<text x="1576" y="66" class="s r">class R items: ≥ 82 °C for 60 s, logged</text>
<text x="1576" y="85" class="s r">nook: F7 + H13 filtered air, 45 °C, 20 m³/h</text>
<text x="24" y="92" class="s b">A  SECTION THROUGH THE WASH COLUMN</text>
