<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K2b  The jaws: one V-groove pair grips rims, pairs, trays and tool necks</text>
<text x="24" y="58" class="m">Two fingers on one self-locking screw. Their arcs and notches carry the profile of a hygienic Tri-Clamp: closing them clamps and centres.</text>
<text x="1576" y="28" class="s r b">arc pocket R 133 over ±50° (two arcs: 200° of the rim) · 20° V-groove</text>
<text x="1576" y="47" class="s r">radial F → axial clamp ≈ 1.8 F per finger (μ 0.15)</text>
<text x="1576" y="66" class="s r">fingers ±28 … ±185 mm, grip 30–400 N · self-locking: no drop on power loss</text>
<text x="1576" y="85" class="s r">every grip checked: mass ± 10 %, finger position ± 0.5 mm</text>
