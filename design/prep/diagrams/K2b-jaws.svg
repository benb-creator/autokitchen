<!-- K2b jaws. Source: K2b-vessel-stack-inversion.md section 2.3 and 3.1 (tongs by the jaw stroke). Top views about 0.8 px/mm, the V-groove section about 6 px/mm. Open point (design gap): with both arcs in one plane, the arc tips (about 47 mm proud of the arc bottom) of the two fingers meet when the fingers are about 95 mm apart, so they cannot close to ±22.5 mm on a T45 neck in the notch; drawn with the arc tips shown dashed where they would have to pass each other. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
