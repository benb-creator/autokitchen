<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.5000" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="60" y="470" class="s">GN trays and boxes: flanges in the straight V-slots</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5000;0.6000" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="60" y="470" class="s">tools: fingers open to ±26 …</text></g>
<text x="826" y="120" class="s b">SECTION through a finger: the V-groove pulls a pair together</text>
