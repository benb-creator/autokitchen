<text x="1000" y="240" class="s">upper vessel (or disc, rack, lid): flange</text>
<text x="1000" y="376" class="s">lower vessel: flange, a bead below it</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.5000" dur="20s" calcMode="discrete" repeatCount="indefinite"/><line x1="1440" y1="300" x2="1400" y2="300" stroke="#f28c28" stroke-width="3" marker-end="url(#ah)"/><text x="1450" y="305" class="m b" style="fill:#c0661a">F</text><line x1="1310" y1="210" x2="1310" y2="248" stroke="#e04a3a" stroke-width="3" marker-end="url(#ar)"/><line x1="1310" y1="390" x2="1310" y2="352" stroke="#e04a3a" stroke-width="3" marker-end="url(#ar)"/><text x="1320" y="220" class="s b" style="fill:#e04a3a">≈ 1.8 F</text><text x="1320" y="390" class="s b" style="fill:#e04a3a">≈ 1.8 F</text></g>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2500" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="840" y="440" class="s">loose stack: gap and offset</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.5000" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="840" y="440" class="s b">finger closes: the 20° flanks squeeze both flanges</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.5000" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="840" y="458" class="s">together and centre them on the same arc</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.5000" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="840" y="440" class="s">hot food pairs metal to metal (steam vents); a gasket</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.5000" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="840" y="458" class="s">coupler with vent notch only below 60 °C</text></g>
<text x="46" y="530" class="s b">TONGS BY THE JAW STROKE: no hinge, no second drive</text>
