<text x="430" y="650" class="s">fingers grip the two half-necks;</text>
<text x="430" y="668" class="s">finger position = tong opening,</text>
<text x="430" y="686" class="s">finger current = grip 2–40 N</text>
<text x="430" y="720" class="s">released into a holster that</text>
<text x="430" y="738" class="s">pinches the arms; red / green pairs</text>
<text x="826" y="530" class="s b">GRIP CHECK before anything moves</text>
<rect x="850" y="560" width="300" height="200" fill="#f6f7f8" stroke="#c4cad1" stroke-width="1"/>
<text x="864" y="586" class="s b">finger load pins:</text>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.8300" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="864" y="610" class="s">item: pot P (from the plan)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.8300" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="864" y="610" class="s">item: pot P (from the plan)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.7500;0.8750" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="864" y="640" class="s" style="fill:#2f7d32">mass 2.41 kg  (exp. 2.35 ± 10 %) ✓</text><text x="864" y="662" class="s" style="fill:#2f7d32">finger 133.2 mm  (± 0.5) ✓</text><text x="864" y="700" class="m b" style="fill:#2f7d32">→ move</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.8750" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="864" y="640" class="s" style="fill:#e04a3a">mass 0.92 kg  (exp. 2.35 ± 10 %) ✗</text><text x="864" y="662" class="s" style="fill:#e04a3a">finger 128.0 mm  (± 0.5) ✗</text><text x="864" y="700" class="m b" style="fill:#e04a3a">→ stop: re-grip or call</text></g>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.7500" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="864" y="640" class="s">every transfer is weighed twice:</text><text x="864" y="660" class="s">loss in the jaws, gain on KH</text></g>
<text x="1180" y="590" class="s">a mis-seated rim or a wrong item</text>
<text x="1180" y="608" class="s">is found before it is lifted</text>
<text x="1180" y="644" class="s">the screw is self-locking:</text>
<text x="1180" y="662" class="s">power loss does not open the jaws</text>
<text x="1180" y="698" class="s">after a raw-meat grip the fingers</text>
<text x="1180" y="716" class="s">dip into the 85 °C jets of the W mouth</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2500" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/4</tspan>  Vessel: both fingers close on the neck under the rim; the two R 133 arcs hold 200° of it</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.5000" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/4</tspan>  Pair: the 20° V-groove turns the closing force into an axial clamp of about 1.8 F and centres both rims, whatever the play of the carriage</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5000;0.7500" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/4</tspan>  Tool: the fingers open to ±26 and close on the T45 neck in the notch at the bottom of the arcs; one-piece tongs close by the same stroke</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.7500" dur="20s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/4</tspan>  Every grip is checked by the finger load pins and the finger position before the Wender moves</text></g>
