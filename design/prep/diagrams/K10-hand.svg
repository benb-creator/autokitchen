<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.5000;0.6833" dur="24s" repeatCount="indefinite" calcMode="discrete"/><path d="M660 300 a 40 40 0 0 1 0 150" fill="none" stroke="#f28c28" stroke-width="3" /><path d="M654 444 l6 6 l6 -8" fill="none" stroke="#f28c28" stroke-width="3" /><text x="690" y="290" class="s b" text-anchor="start">0–120 rpm, ≈ 12 Nm</text></g>
<path d="M522 340 L424 264" fill="none" stroke="#777" stroke-width="1" />
<text x="420" y="260" class="s">PTFE lip seal on the 1.4404 output shaft</text>
<path d="M522 402 L564 496" fill="none" stroke="#777" stroke-width="1" />
<text x="560" y="492" class="s">garter spring holds the lip</text>
<text x="60" y="640" class="s">Why a lip seal: K9c's canned magnet coupling needs no seal but</text>
<text x="60" y="660" class="s">costs ≈ €90 more. K10 takes the cheap seal and keeps the</text>
<text x="60" y="680" class="s">coupling as the fallback.</text>
<text x="60" y="700" class="s"></text>
<text x="60" y="720" class="s">The lip sits in the splash zone, so it is rinsed with the sleeve</text>
<text x="60" y="740" class="s">after every soiled grip. Risk R6: a riboflavin soak test must</text>
<text x="60" y="760" class="s">show that nothing creeps past the lip.</text>
<text x="60" y="780" class="s"></text>
<text x="60" y="800" class="s">dynamic seals: Z band + Y band + this lip = 3 (limit C5: 5)</text>
<rect x="880" y="210" width="300" height="90" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2" />
<text x="1030" y="330" class="s c">sleeve on the roll shaft (unrolled view of the slot)</text>
<path d="M1180 238 L1070 238 L1040 252 L1040 272 L1070 278" fill="none" stroke="#fbfbfc" stroke-width="14" />
<path d="M1180 238 L1070 238 L1040 252 L1040 272 L1070 278" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-80 0;-190 0;-220 0;-220 0;-190 0;-190 0" keyTimes="0.0000;0.2583;0.3083;0.3667;0.4000;0.4250;0.4500;1.0000" dur="24s" repeatCount="indefinite" /><rect x="1260" y="222" width="170" height="32" fill="#c4ccd4" stroke="#3a3f45" stroke-width="1.5" /><rect x="1430" y="200" width="100" height="80" fill="#e3ebf2" stroke="#3a3f45" stroke-width="2" /><text x="1480" y="245" class="s c">pot</text><text x="1345" y="272" class="s c">stub on the item</text></g>
<g><animateTransform attributeName="transform" type="translate" values="1260 238;1260 238;1180 238;1070 238;1040 252;1040 272;1070 278;1070 278" keyTimes="0.0000;0.2583;0.3083;0.3667;0.4000;0.4250;0.4500;1.0000" dur="24s" repeatCount="indefinite" /><circle cx="0" cy="0" r="6" fill="#3a3f45" stroke="#3a3f45" stroke-width="0" /></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2583;0.3667" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="1110" y="190" class="s c b">1  stub slides in axially</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3667;0.4500" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="1110" y="190" class="s c b">2  roll 60°: pin runs round the J</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.4500;0.5000" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="1110" y="190" class="s c b" style="fill:#3c8a3c">3  locked: the pin sits in the hook</text></g>
<text x="840" y="370" class="s">One grip for everything: pots, pans, GN, board, knife, spit,</text>
<text x="840" y="389" class="s">hook rod, ladle, presses. The reaction tab takes the torque</text>
<text x="840" y="408" class="s">when the hand pours, inverts, flips a pan pair or closes</text>
<text x="840" y="427" class="s">pincers (roll ≤ 12 Nm). The hand cannot yaw: the board turns</text>
<text x="840" y="446" class="s">by a peg push, the cooker lid by an XY-arc push.</text>
<rect x="850" y="540" width="290" height="22" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5" />
