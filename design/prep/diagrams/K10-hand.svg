<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f2f3f5" stroke="#d0d4d9"/>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.2500" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">1/4</tspan> Four axes: X along the rear wall, Z down the mast, Y along the arm, roll about the arm — no hub motors any more</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2500;0.5000" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">2/4</tspan> Gripping: the stub of any item slides into the J-slot sleeve, a 60° roll locks it, the reaction tab takes the torque</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.5000;0.7500" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">3/4</tspan> Roll unit: motor and gear in a sealed stainless housing; the shaft leaves through a PTFE lip seal, rinsed with the sleeve</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.7500" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">4/4</tspan> Weighing: the arm-root load cell reads the held vessel; the hand pours until the weight has dropped by the dose</text></g>
</svg>