<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- K10 hand. Source: K10-two-thousand.md sections 3.4 (actuators, seals, what the hand can do), 6 (hygiene: sleeve jets, lip seal, riboflavin test R6), K9c-design-to-cost.md gantry G1-G9 for X, Z, Y. Roll unit section at about 1.8 px/mm, schematic. Simplest readings: the lip faces the wet side and a garter spring holds it; the J-slot locks by a 60 deg roll as in K9b; the reaction tab is a lug on the sleeve rim that bears on a notch of the item stub; the weighing numbers are an example. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K10  THE HAND — 4 axes, a lip-sealed roll unit, a J-slot sleeve</text>
<text x="24" y="58" class="m">K9c's printer-class gantry (X, Z, Y) plus one roll motor; the cooker and dishwasher bring their own motors.</text>
<text x="1576" y="28" class="s r b">4 motion actuators (K9b/K9c 6) · 3 dynamic seals (2 bands + roll lip seal)</text>
<text x="1576" y="47" class="s r">roll: NEMA 23 + 10:1 planetary, 0–120 rpm, ≈ 12 Nm (TMC2209 at 1.8 A)</text>
<text x="1576" y="66" class="s r">lift ≤ 4 kg, centre of mass ≤ 150 mm in front of the sleeve</text>
<text x="1576" y="85" class="s r">push 300 N (y ≤ 420) / 150 N at full reach · 0.8 m/s · weighs ±5 g</text>
<rect x="810" y="480" width="360" height="360" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"><animate attributeName="stroke" values="#f28c28;#c9ced4;#c9ced4" keyTimes="0.0000;0.2500;1.0000" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="stroke-width" values="4;1.5;1.5" keyTimes="0.0000;0.2500;1.0000" dur="24s" repeatCount="indefinite" calcMode="discrete"/></rect>
<text x="822" y="502" class="s b">1  FOUR AXES</text>
<rect x="810" y="100" width="760" height="370" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"><animate attributeName="stroke" values="#c9ced4;#f28c28;#c9ced4;#c9ced4" keyTimes="0.0000;0.2500;0.5000;1.0000" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="stroke-width" values="1.5;4;1.5;1.5" keyTimes="0.0000;0.2500;0.5000;1.0000" dur="24s" repeatCount="indefinite" calcMode="discrete"/></rect>
<text x="822" y="122" class="s b">2  J-SLOT SLEEVE: every item carries the same stub</text>
<rect x="30" y="100" width="760" height="740" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"><animate attributeName="stroke" values="#c9ced4;#f28c28;#c9ced4;#c9ced4" keyTimes="0.0000;0.5000;0.7500;1.0000" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="stroke-width" values="1.5;4;1.5;1.5" keyTimes="0.0000;0.5000;0.7500;1.0000" dur="24s" repeatCount="indefinite" calcMode="discrete"/></rect>
<text x="42" y="122" class="s b">3  ROLL UNIT, section: sealed housing, PTFE lip seal</text>
<rect x="1190" y="480" width="380" height="360" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"><animate attributeName="stroke" values="#c9ced4;#f28c28;#c9ced4" keyTimes="0.0000;0.7500;1.0000" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="stroke-width" values="1.5;4;1.5" keyTimes="0.0000;0.7500;1.0000" dur="24s" repeatCount="indefinite" calcMode="discrete"/></rect>
<text x="1202" y="502" class="s b">4  WEIGHING by loss in weight</text>
<line x1="240" y1="130" x2="240" y2="300" stroke="#3a3f45" stroke-width="10" />
<text x="256" y="200" class="s" text-anchor="start">drop link 300 mm from the Y carriage</text>
