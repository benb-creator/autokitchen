<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- K8b turning food with the roll axis. Source: K8b 3.4 (GA-20 raft), 3.5 (GA-36 lift racks), 3.9 (pan-pair flip), 2.3 (rotor torque). Front views X/Z at about 0.8 px/mm. Simplifications: the vessel fork and tang clamps are drawn as a bar through the puck centre; the pans are drawn as flat trays; each panel runs while the others rest. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K8b  Turning food over with the puck’s roll</text>
<text x="24" y="58" class="m">The puck turns about the axis through the wall, so a whole set (pan pair, raft of rolls, rack pair) is flipped in place.</text>
<text x="1576" y="28" class="s r b">rotor rated 6 Nm (R50)</text>
<text x="1576" y="47" class="s r">pancake pans Ø26, ≤ 30 mL free fat</text>
<text x="1576" y="66" class="s r">Rouladen raft 1.5 kg at &lt; 20 mm offset: &lt; 0.5 Nm</text>
<text x="1576" y="85" class="s r">Schnitzel rack pair 1.1 kg, fat 3.5 mm (300 mL)</text>
<text x="24" y="100" class="s b">A  PANCAKE: PAN-PAIR FLIP</text>
<g transform="translate(-81 -174) scale(1.3)"><rect x="100" y="580" width="340" height="8" fill="#2b2f33" stroke="#3a3f45" stroke-width="1"/><rect x="120" y="588" width="300" height="6" fill="#e04a3a" opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.33" dur="24s" repeatCount="indefinite" calcMode="discrete"/></rect><g><animate attributeName="opacity" values="1;0" keyTimes="0;0.08" dur="24s" repeatCount="indefinite" calcMode="discrete"/><path d="M166 554 L174 580 L366 580 L374 554" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2.5"/><line x1="374" y1="560" x2="440" y2="560" stroke="#8fa8c0" stroke-width="6"/><rect x="180" y="570" width="180" height="5" fill="#f6e3a1" stroke="none" stroke-width="0"/><rect x="180" y="575" width="180" height="5" fill="#c98a3a" stroke="none" stroke-width="0"/></g><g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.08" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 -160;0 0;0 0" keyTimes="0;0.06;1" dur="24s" repeatCount="indefinite"/><g transform="translate(0 1108) scale(1 -1)"><path d="M166 554 L174 580 L366 580 L374 554" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2.5"/><line x1="374" y1="560" x2="440" y2="560" stroke="#8fa8c0" stroke-width="6"/></g></g></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.08;0.19" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -140;0 -140;0 0;0 0" keyTimes="0;0.08;0.11;0.17;0.19;1" dur="24s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0 270 554;0 270 554;180 270 554;180 270 554" keyTimes="0;0.11;0.17;1" dur="24s" repeatCount="indefinite"/><path d="M166 554 L174 580 L366 580 L374 554" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2.5"/><line x1="374" y1="560" x2="440" y2="560" stroke="#8fa8c0" stroke-width="6"/><rect x="180" y="570" width="180" height="5" fill="#f6e3a1" stroke="none" stroke-width="0"/><rect x="180" y="575" width="180" height="5" fill="#c98a3a" stroke="none" stroke-width="0"/><g transform="translate(0 1108) scale(1 -1)"><path d="M166 554 L174 580 L366 580 L374 554" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2.5"/><line x1="374" y1="560" x2="440" y2="560" stroke="#8fa8c0" stroke-width="6"/></g></g></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.19" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g transform="translate(540 0) scale(-1 1)"><path d="M166 554 L174 580 L366 580 L374 554" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2.5"/><line x1="374" y1="560" x2="440" y2="560" stroke="#8fa8c0" stroke-width="6"/></g><rect x="180" y="570" width="180" height="5" fill="#c98a3a" stroke="none" stroke-width="0"/><rect x="180" y="575" width="180" height="5" fill="#f6e3a1" stroke="none" stroke-width="0"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.19;0.33" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -160;0 -160" keyTimes="0;0.19;0.25;1" dur="24s" repeatCount="indefinite"/><g transform="translate(540 1108) scale(-1 -1)"><path d="M166 554 L174 580 L366 580 L374 554" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2.5"/><line x1="374" y1="560" x2="440" y2="560" stroke="#8fa8c0" stroke-width="6"/></g></g></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.06;0.19" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -140;0 -140;0 0;0 0" keyTimes="0;0.08;0.11;0.17;0.19;1" dur="24s" repeatCount="indefinite"/><g opacity="0"><animate attributeName="opacity" values="1" keyTimes="0" dur="24s" repeatCount="indefinite" calcMode="discrete"/><circle cx="270" cy="554" r="45" fill="#f28c28" fill-opacity="0.55" stroke="#3a3f45" stroke-width="2"/><circle cx="270" cy="554" r="7" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1"/></g></g></g><text x="270" y="620" class="s c">pan A on zone L, hot pan B laid face down on it</text><text x="270" y="638" class="s c">camera first checks the pancake moves (5 mm jerk)</text></g>
<text x="560" y="100" class="s b">B  ROULADEN: RAFT ROLLED ON ITS HANDLE</text>
<g transform="translate(-237 -174) scale(1.3)"><rect x="600" y="580" width="380" height="8" fill="#2b2f33" stroke="#3a3f45" stroke-width="1"/><rect x="620" y="588" width="340" height="6" fill="#e04a3a" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.33;0.67" dur="24s" repeatCount="indefinite" calcMode="discrete"/></rect><path d="M620 515 L620 580 L960 580 L960 515" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2.5"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -150;0 -150;0 0;0 0" keyTimes="0;0.42;0.44;0.5;0.52;1" dur="24s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0 790 546;0 790 546;180 790 546;180 790 546" keyTimes="0;0.44;0.5;1" dur="24s" repeatCount="indefinite"/><circle cx="685" cy="546" r="30" fill="#c46a5a" stroke="#3a3f45" stroke-width="2"/><path d="M659 560 A30 30 0 0 0 711 560 Z" fill="#c46a5a"><animate attributeName="fill" values="#c46a5a;#c46a5a;#8a4a2a;#8a4a2a" keyTimes="0;0.33;0.42;1" dur="24s" repeatCount="indefinite"/></path><circle cx="685" cy="573" r="3" fill="#2b2f33"/><circle cx="755" cy="546" r="30" fill="#c46a5a" stroke="#3a3f45" stroke-width="2"/><path d="M729 560 A30 30 0 0 0 781 560 Z" fill="#c46a5a"><animate attributeName="fill" values="#c46a5a;#c46a5a;#8a4a2a;#8a4a2a" keyTimes="0;0.33;0.42;1" dur="24s" repeatCount="indefinite"/></path><circle cx="755" cy="573" r="3" fill="#2b2f33"/><circle cx="825" cy="546" r="30" fill="#c46a5a" stroke="#3a3f45" stroke-width="2"/><path d="M799 560 A30 30 0 0 0 851 560 Z" fill="#c46a5a"><animate attributeName="fill" values="#c46a5a;#c46a5a;#8a4a2a;#8a4a2a" keyTimes="0;0.33;0.42;1" dur="24s" repeatCount="indefinite"/></path><circle cx="825" cy="573" r="3" fill="#2b2f33"/><circle cx="895" cy="546" r="30" fill="#c46a5a" stroke="#3a3f45" stroke-width="2"/><path d="M869 560 A30 30 0 0 0 921 560 Z" fill="#c46a5a"><animate attributeName="fill" values="#c46a5a;#c46a5a;#8a4a2a;#8a4a2a" keyTimes="0;0.33;0.42;1" dur="24s" repeatCount="indefinite"/></path><circle cx="895" cy="573" r="3" fill="#2b2f33"/><line x1="640" y1="538" x2="940" y2="538" stroke="#8fa8c0" stroke-width="4"/><line x1="640" y1="554" x2="940" y2="554" stroke="#8fa8c0" stroke-width="4"/></g></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -150;0 -150;0 0;0 0" keyTimes="0;0.42;0.44;0.5;0.52;1" dur="24s" repeatCount="indefinite"/><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.54" dur="24s" repeatCount="indefinite" calcMode="discrete"/><circle cx="790" cy="546" r="45" fill="#f28c28" fill-opacity="0.55" stroke="#3a3f45" stroke-width="2"/><circle cx="790" cy="546" r="7" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1"/></g></g><text x="790" y="620" class="s c">4 rolls on one two-tine fork (GA-20 raft); its T-handle</text><text x="790" y="638" class="s c">lies on the puck axis, so the raft turns in place</text><g><animate attributeName="opacity" values="1;0" keyTimes="0;0.42" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="824" y="476" class="s">seam (dot) down</text></g></g>
<text x="1080" y="100" class="s b">C  SCHNITZEL: LIFT-RACK PAIR</text>
<g transform="translate(-396 -174) scale(1.3)"><rect x="1120" y="580" width="400" height="8" fill="#2b2f33" stroke="#3a3f45" stroke-width="1"/><rect x="1140" y="588" width="360" height="6" fill="#e04a3a" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.67" dur="24s" repeatCount="indefinite" calcMode="discrete"/></rect><path d="M1140 540 L1140 580 L1500 580 L1500 540" fill="#8fa8c0" stroke="#3a3f45" stroke-width="2.5"/><rect x="1142" y="570" width="356" height="9" fill="#f2c94c" stroke="none" stroke-width="0" opacity="0.7"/><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.67;0.75" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 -120;0 -120;0 0;0 0" keyTimes="0;0.67;0.73;1" dur="24s" repeatCount="indefinite"/><line x1="1155" y1="548" x2="1485" y2="548" stroke="#555" stroke-width="4"/></g></g><g><animate attributeName="opacity" values="1;0" keyTimes="0;0.75" dur="24s" repeatCount="indefinite" calcMode="discrete"/><line x1="1155" y1="567" x2="1485" y2="567" stroke="#555" stroke-width="4"/><rect x="1170" y="550" width="130" height="9" fill="#e8d5a8" stroke="#3a3f45" stroke-width="1"/><rect x="1170" y="559" width="130" height="7" fill="#d9a441" stroke="#3a3f45" stroke-width="1"/><rect x="1340" y="550" width="130" height="9" fill="#e8d5a8" stroke="#3a3f45" stroke-width="1"/><rect x="1340" y="559" width="130" height="7" fill="#d9a441" stroke="#3a3f45" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.75" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -175;0 -175;0 0;0 0" keyTimes="0;0.75;0.79;0.9;0.94;1" dur="24s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0 1320 558;0 1320 558;180 1320 558;180 1320 558" keyTimes="0;0.84;0.9;1" dur="24s" repeatCount="indefinite"/><line x1="1155" y1="567" x2="1485" y2="567" stroke="#555" stroke-width="4"/><rect x="1170" y="550" width="130" height="9" fill="#e8d5a8" stroke="#3a3f45" stroke-width="1"/><rect x="1170" y="559" width="130" height="7" fill="#d9a441" stroke="#3a3f45" stroke-width="1"/><rect x="1340" y="550" width="130" height="9" fill="#e8d5a8" stroke="#3a3f45" stroke-width="1"/><rect x="1340" y="559" width="130" height="7" fill="#d9a441" stroke="#3a3f45" stroke-width="1"/><line x1="1155" y1="548" x2="1485" y2="548" stroke="#555" stroke-width="4"/></g></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.75" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -175;0 -175;0 0;0 0" keyTimes="0;0.75;0.79;0.9;0.94;1" dur="24s" repeatCount="indefinite"/><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.73;0.95" dur="24s" repeatCount="indefinite" calcMode="discrete"/><circle cx="1320" cy="558" r="45" fill="#f28c28" fill-opacity="0.55" stroke="#3a3f45" stroke-width="2"/><circle cx="1320" cy="558" r="7" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1"/></g></g></g><circle cx="1200" cy="460" r="3" fill="#f2c94c" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.79;0.84" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animateTransform attributeName="transform" type="translate" values="0 0;0 100" dur="0.6s" repeatCount="indefinite"/></circle><circle cx="1260" cy="460" r="3" fill="#f2c94c" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.79;0.84" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animateTransform attributeName="transform" type="translate" values="0 0;0 100" dur="0.6s" repeatCount="indefinite"/></circle><circle cx="1320" cy="460" r="3" fill="#f2c94c" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.79;0.84" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animateTransform attributeName="transform" type="translate" values="0 0;0 100" dur="0.6s" repeatCount="indefinite"/></circle><circle cx="1380" cy="460" r="3" fill="#f2c94c" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.79;0.84" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animateTransform attributeName="transform" type="translate" values="0 0;0 100" dur="0.6s" repeatCount="indefinite"/></circle><circle cx="1440" cy="460" r="3" fill="#f2c94c" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.79;0.84" dur="24s" repeatCount="indefinite" calcMode="discrete"/><animateTransform attributeName="transform" type="translate" values="0 0;0 100" dur="0.6s" repeatCount="indefinite"/></circle><text x="1320" y="620" class="s c">two cutlets between two racks: lifted, drained</text><text x="1320" y="638" class="s c">over the pan, rolled 180°, lowered into the fat</text><text x="1320" y="660" class="s c">drips fall back into the pan;</text><text x="1320" y="678" class="s c">no hot fat is ever turned over</text></g>
<rect x="0" y="852" width="1600" height="48" fill="#eef1f4"/>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">1/7 </tspan>Pancake: hot, buttered pan B is laid face down on pan A; the fork clamps both tangs.<animate attributeName="opacity" values="1;0" keyTimes="0;0.08" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">2/7 </tspan>The puck rolls the pair 180°: the pancake drops into pan B with its brown side up.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.08;0.19" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">3/7 </tspan>Pan A is lifted off; pan B goes on frying.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.19;0.33" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">4/7 </tspan>Rouladen: four rolls pinned on one fork sear seam side down.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.33;0.44" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">5/7 </tspan>The raft is rolled 180° about its own handle and sears on the other side.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.44;0.67" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">6/7 </tspan>Schnitzel: the upper rack is laid on the two cutlets.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.67;0.75" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">7/7 </tspan>The rack pair is lifted, drained, rolled 180° and lowered back into the 3.5 mm of fat.<animate attributeName="opacity" values="0;1" keyTimes="0;0.75" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<rect x="0" y="850" width="1600" height="3" fill="#f28c28" transform="scale(0 1)"><animateTransform attributeName="transform" type="scale" values="0 1;1 1" dur="24s" repeatCount="indefinite"/></rect>
</svg>
