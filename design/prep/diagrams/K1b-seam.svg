<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K1b  The ceiling seam: one ring gap, air-swept, and never above food</text>
<text x="24" y="58" class="m">Where the disc turns in the ceiling there is an open 4 mm gap: clean air blows out of it, jets in both walls flush it.</text>
<text x="1576" y="28" class="s r b">seam length 1.4 m (K1: 7.3 m) · gap 4 × 40 mm, V-ring on the dry side</text>
<text x="1576" y="47" class="s r">air sweep 0.3 m/s outward, H13-filtered, watched by a pressure switch</text>
<text x="1576" y="66" class="s r">jets: 8 in the coaming + 4 in the turning rim, Ø 1.5, 80 °C soft water</text>
<text x="1576" y="85" class="s r">daily flush 4.5 L (12 jets × 0.025 L/s × 15 s), dry within 15 min</text>
<text x="40" y="108" class="s b">SECTION through the gap (radial; turret axis to the left)</text>
<rect x="40" y="130" width="560" height="160" fill="#eef0f2" stroke="none" stroke-width="0"/>
