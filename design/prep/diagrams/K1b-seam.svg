<text x="1022" y="715" class="s">8 jets in the fixed coaming</text>
<circle cx="1010" cy="734" r="5" fill="#2f78b5" stroke="#3a3f45" stroke-width="1"/>
<text x="1022" y="739" class="s">4 jets in the turning rim</text>
<text x="1010" y="758" class="s">rim jets fed by a hose in the disc's cable loop</text>
<text x="1010" y="776" class="s">flush: the disc turns 400°, so every point</text>
<text x="1010" y="794" class="s">of both walls passes a jet</text>
<text x="1010" y="812" class="s">flow per jet ring is logged; riboflavin test</text>
<text x="1010" y="830" class="s">on a mock-up before selection</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.0833" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/5</tspan>  Cooking: filtered air streams out of the gap at 0.3 m/s; steam and fat aerosol are carried away from the seam to the downdraft slots</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0833;0.2500" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/5</tspan>  The seam is only above the well lid: open food stands outside the seam circle, so a drop that leaves the gap lands on the lid</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.4167" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/5</tspan>  Air lost: the pressure switch trips, the hand parks over the well, the hobs go to simmer under their lids</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4167;0.7500" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/5</tspan>  Daily flush: 12 jets in both walls spray soft 80 °C water with detergent while the disc turns 400°; the water drains to the well lid</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.7500" dur="24s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">5/5</tspan>  Dry: air sweep and the heated ceiling dry the seam within 15 min; the flow of each jet ring is logged</text></g>
