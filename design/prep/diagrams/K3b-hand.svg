<text x="1094" y="256" class="s r b" style="fill:#e04a3a">lip stays put</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3000;0.6833" dur="12s" repeatCount="indefinite" calcMode="discrete"/><path d="M1108,250 q-6,40 -4,170" fill="none" stroke="#4aa3df" stroke-width="8" stroke-linecap="round"/></g>
<rect x="1020" y="420" width="150" height="70" fill="#b9c7d6" stroke="#3a3f45" stroke-width="2"/>
<rect x="1024" y="486" width="142" height="0" fill="#4aa3df" fill-opacity="0.7"><animate attributeName="height" values="0;0;50;50;0" keyTimes="0.0000;0.3000;0.6833;0.9667;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="486;486;436;436;486" keyTimes="0.0000;0.3000;0.6833;0.9667;1.0000" dur="12s" repeatCount="indefinite"/></rect>
<text x="1095" y="507" class="s c">target held still</text>
<text x="1340" y="300" class="s">The stream leaves at one point,</text>
<text x="1340" y="318" class="s">so it lands where planned:</text>
<text x="1340" y="336" class="s">drum, gully, pot, plate, mould.</text>
<text x="1340" y="372" class="s">Load pins weigh the pour</text>
<text x="1340" y="390" class="s">(e.g. 100 mL batter).</text>
<rect x="785" y="512" width="785" height="328" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="797" y="534" class="s b">C  ONE TANG ON EVERYTHING · pins for form fit · pairs held back to back</text>
<rect x="944" y="660" width="32" height="60" fill="#7a828a" stroke="#3a3f45" stroke-width="1.5"/>
<circle cx="960" cy="676" r="4" fill="#fbfbfc" stroke="#3a3f45" stroke-width="1"/>
<circle cx="960" cy="704" r="4" fill="#fbfbfc" stroke="#3a3f45" stroke-width="1"/>
<rect x="875" y="720" width="170" height="60" fill="#b9c7d6" stroke="#3a3f45" stroke-width="2"/>
<text x="960" y="760" class="s c">pot, pan, tray, tool…</text>
