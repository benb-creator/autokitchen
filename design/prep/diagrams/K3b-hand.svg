<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- K3b hand. Source: design/prep/concepts/K3b-drum-and-belt-line.md sections 2.1 rule 5, 2.5 (axis table), 3.4 step 5, 3.8, 5.4 rows 8-9, 5.5. Panel A side view y/z at 0.42 px/mm; panel B front view at 1 px/mm; panel C close-up, not to scale. Simplest readings: the Y carriage runs inside the fixed closed arm and carries the roll unit at its front end (the link through the top-face band is not drawn); the pot pour is drawn as a pure rotation about the pour lip, which is what "X and Z follow the roll" achieves. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}.i{font-style:italic}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">K3b  HAND — one gantry hand moves every vessel and tool by one flat tang</text>
<text x="24" y="58" class="m">X along the wall, Z on a hanging mast, Y in a closed arm, roll about y, and a two-jaw chuck with pins.</text>
<text x="1576" y="28" class="s r b">X 1280 mm, 1.0 m/s, no seal (labyrinth) · Z 1000 mm, 400 N</text>
<text x="1576" y="47" class="s r">Y 440 mm, 200 N · roll continuous, 30 Nm, 0–200 rpm</text>
<text x="1576" y="66" class="s r">chuck 2 × 22 mm, 20–400 N, conical pins + 2 load pins</text>
<text x="1576" y="85" class="s r">payload 6 kg at 160 mm · 5 dynamic seals for the whole cell</text>
<rect x="30" y="100" width="740" height="740" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="42" y="122" class="s b">A  SIDE VIEW (rear wall left, door right): Z mast and Y arm</text>
<rect x="106.5" y="183.5" width="13.5" height="616.5" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1.5"/>
<text x="102.5" y="498.5" class="s r">rear wall</text>
<rect x="381" y="183.5" width="6" height="616.5" fill="#dbe7f2" stroke="#3a3f45" stroke-width="1.2"/>
<text x="391" y="498.5" class="s">door</text>
<rect x="120" y="228.5" width="54" height="45" fill="#c4cad1" stroke="#3a3f45" stroke-width="1.5"/>
<text x="399" y="244.5" class="s">← X box: rails, belt, motor (x along the wall)</text>
<rect x="122.25" y="273.5" width="8" height="10" fill="#7a828a" stroke="#3a3f45" stroke-width="0.5"/>
<rect x="130.35" y="273.5" width="8" height="10" fill="#7a828a" stroke="#3a3f45" stroke-width="0.5"/>
