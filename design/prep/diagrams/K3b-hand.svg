<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.1667;0.9167" dur="12s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 130.5;0 130.5;0 -67.5;-81 -67.5;0 -67.5;0 130.5;0 130.5;0 0" keyTimes="0.0000;0.1250;0.2083;0.3750;0.5417;0.7083;0.8750;0.9333;1.0000" dur="12s" repeatCount="indefinite"/><rect x="277" y="590.5" width="99" height="54" fill="#b9c7d6" stroke="#3a3f45" stroke-width="2"/><rect x="269" y="586.5" width="10" height="18" fill="#555" stroke="#3a3f45" stroke-width="1"/></g></g>
<text x="399" y="363.5" class="s">← mast 80 × 100 (rear lane)</text>
<text x="399" y="380.5" class="s">   Z: ball screw, brake</text>
<text x="399" y="397.5" class="s" style="fill:#6b4c8a">   sealing band on its front face</text>
<text x="399" y="453.5" class="s">← arm: Y carriage inside; band on</text>
<text x="399" y="470.5" class="s" style="fill:#6b4c8a">   the top face, gutter sloped to the mast</text>
<text x="399" y="487.5" class="s">   (nothing drips off over the food)</text>
<text x="399" y="513.5" class="s" style="fill:#f28c28">← roll unit: 1 lip seal under</text>
<text x="399" y="530.5" class="s" style="fill:#f28c28">   an umbrella collar; chuck below</text>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.1250" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">Z down to the pot</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.1250;0.2083" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">chuck grips the tang</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2083;0.3750" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">Z up with the pot</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3750;0.5417" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">Y in: the pot comes back over the deck</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.5417;0.7083" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">Y out again</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.7083;0.8750" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">Z down</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.8750" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="48" y="150" class="m"><tspan class="b">release</tspan></text></g>
<text x="48" y="830" class="s">Over the drum only when it is mouth-up and the arm is below the oven (z ≤ 1580): interlocked.</text>
<rect x="785" y="100" width="785" height="400" rx="8" fill="#fbfbfc" stroke="#c9ced4" stroke-width="1.5"/>
<text x="797" y="122" class="s b">B  POUR ABOUT THE LIP: roll + X + Z together (front view)</text>
<clipPath id="pclip"><rect x="785" y="128" width="785" height="372"/></clipPath>
