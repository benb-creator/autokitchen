<text x="960" y="570" class="s c">tang 6 × 32 × 60, two Ø 8 holes, facing the rear</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.1667;0.4583" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="960" y="802" class="m b c" style="fill:#f28c28">load pins: 2.35 kg</text></g>
<text x="960" y="822" class="s c">conical pins → no slip at any tilt</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.5000" dur="12s" repeatCount="indefinite" calcMode="discrete"/><g><animateTransform attributeName="transform" type="rotate" values="0 1350 690;0 1350 690;180 1350 690;180 1350 690" keyTimes="0.0000;0.5417;0.7083;1.0000" dur="12s" repeatCount="indefinite"/><path d="M1270,698 L1278,720 L1422,720 L1430,698" fill="#b9c7d6" stroke="#3a3f45" stroke-width="2"/><path d="M1270,682 L1278,660 L1422,660 L1430,682" fill="#d0d8e2" stroke="#3a3f45" stroke-width="2"/><ellipse cx="1350" cy="712" rx="58" ry="6" fill="#f2d36b" stroke="#3a3f45" stroke-width="1"/><rect x="1430" y="668" width="16" height="44" fill="#555" stroke="#3a3f45" stroke-width="1"/><rect x="1446" y="664" width="26" height="52" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/></g></g>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.5000" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="1350" y="690" class="m c">pan pair →</text></g>
<text x="1350" y="570" class="s c">two tangs back to back = one grip;</text>
<text x="1350" y="588" class="s c">the pair rolls 180° (pancake, Schnitzel racks)</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f2f3f5" stroke="#d0d4d9"/>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.2083" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">1/4</tspan> The hand comes down on its mast and grips the pot by its rear tang</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2083;0.3750" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">2/4</tspan> Z lifts; the closed arm stays over the deck, its seals face up into a gutter or back to the rear lane</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3750;0.7083" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">3/4</tspan> Y moves the roll unit along the arm; meanwhile (B) the roll axis pours about the vessel lip</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.7083" dur="12s" repeatCount="indefinite" calcMode="discrete"/><text x="44" y="876" class="m"><tspan class="b">4/4</tspan> Down and release: the same tang and pins for every vessel, tray and tool</text></g>
