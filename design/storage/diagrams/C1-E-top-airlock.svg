<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">C1-E  TWO-STAGE TOP AIRLOCK ("chimney") — freezer fallback</text>
<text x="24" y="58" class="m">B's window becomes a short chimney with two closures, never open together: the cell is never open to the room.</text>
<text x="1576" y="28" class="s r b">fallback for the freezer only</text>
<text x="1576" y="47" class="s r">vestibule 210 × 200 × 140 mm = 5.9 L</text>
<text x="1576" y="66" class="s r">per pass: fridge 0.18 kJ, freezer 0.41 kJ (as B)</text>
<text x="1576" y="85" class="s r">3 actuators per shell, ≈ €470–505</text>
<text x="1576" y="104" class="s r">needs a lift that carries the box from below</text>
