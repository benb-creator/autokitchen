<text x="46" y="187" class="s b">FREEZER, FRONT SECTION</text>
<text x="130" y="563" class="s c h">freezer</text>
<clipPath id="zc"><rect x="290" y="300" width="436.8" height="507"/></clipPath><g clip-path="url(#zc)"><use xlink:href="#mod" transform="translate(227.6 2023.8) scale(0.78)"/></g><rect x="290" y="300" width="436.8" height="507" fill="none" stroke="#3a3f45" stroke-width="1.5"/>
<rect x="68.4" y="196.2" width="156.8" height="182" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="290" y="290" class="s b">ZOOM: the chimney in the freezer top</text>
<line x1="586.4" y1="319.5" x2="734.8" y2="334" stroke="#777" stroke-width="1.2"/>
<text x="738.8" y="339" class="s b">gallery hoist</text>
<line x1="637.1" y1="471.6" x2="734.8" y2="462.7" stroke="#777" stroke-width="1.2"/>
<text x="738.8" y="467.7" class="s b">outer slide (B)</text>
<line x1="635.54" y1="490.32" x2="734.8" y2="497.8" stroke="#777" stroke-width="1.2"/>
<text x="738.8" y="502.8" class="s">magnetic gasket</text>
<line x1="621.5" y1="541.8" x2="734.8" y2="532.9" stroke="#777" stroke-width="1.2"/>
<text x="738.8" y="537.9" class="s">raised PP collar</text>
<line x1="621.5" y1="512.16" x2="734.8" y2="568" stroke="#777" stroke-width="1.2"/>
<text x="738.8" y="573" class="s">spring pawls hold the rim</text>
<line x1="617.6" y1="614.34" x2="734.8" y2="607" stroke="#777" stroke-width="1.2"/>
<text x="738.8" y="612" class="s b">inner leaves 2 × 105</text>
<line x1="664.4" y1="573" x2="734.8" y2="642.1" stroke="#777" stroke-width="1.2"/>
<text x="738.8" y="647.1" class="s">top wall foam 70</text>
<line x1="594.2" y1="791.4" x2="734.8" y2="739.6" stroke="#777" stroke-width="1.2"/>
<text x="738.8" y="744.6" class="s">in-cell lift</text>
<text x="539.6" y="549.6" class="s c b h">VESTIBULE 5.9 L</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.68333;0.98333" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="344.6" y="654.9" class="s h">NoFrost fan jet</text></g>
<text x="1010" y="150" class="s b">AIR EXCHANGED PER PASS</text>
<text x="1010" y="182" class="s">B, one top hatch</text>
<text x="1370" y="182" class="s b">5–10 L</text>
<text x="1010" y="200" class="s">cold air stays below</text>
<text x="1010" y="226" class="s">B with a fan jet across the window</text>
<text x="1370" y="226" class="s b">10–40 L</text>
<text x="1010" y="244" class="s">the jet blows cold air out</text>
<text x="1010" y="270" class="s b">E, two closures</text>
<text x="1370" y="270" class="s b">5.9 L</text>
<text x="1010" y="288" class="s">only the vestibule, jet or not</text>
<text x="1010" y="314" class="s">A, door vestibule (for comparison)</text>
<text x="1370" y="314" class="s b">10.6 L</text>
<text x="1010" y="358" class="s">one vertical flap, no vestibule</text>
<text x="1370" y="358" class="s b">37–58 L</text>
<text x="1010" y="430" class="s b">VERDICT</text>
<text x="1010" y="456" class="s">A top hatch already behaves like an airlock, so E</text>
<text x="1010" y="476" class="s">saves no energy over B (freezer ≈ 44 kWh/yr vs 38).</text>
<text x="1010" y="496" class="s">It costs 2 more actuators, a daily vestibule warm-up</text>
<text x="1010" y="516" class="s">(10 W, 10 min) and a drain, and pawls and leaves</text>
<text x="1010" y="536" class="s">that can rime up.</text>
<text x="1010" y="576" class="s">Keep it as the freezer fallback if the smoke test</text>
<text x="1010" y="596" class="s">shows that the NoFrost fan jet cannot be kept</text>
<text x="1010" y="616" class="s">away from B's window (B uses a 100 mm skirt).</text>
<text x="1010" y="656" class="s">Rotating "revolving door" pockets were dropped:</text>
<text x="1010" y="676" class="s">with an upward box flow they turn the box over.</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.00000;0.01667" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/6</tspan>  E: B's window becomes a short chimney with two closures, inner leaves at the ceiling and B's slide on top; never both open.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.01667;0.12000" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/6</tspan>  The inner leaves slide apart and the in-cell lift pushes the box up from below; two spring pawls let the rim pass, then hold it.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.12000;0.23333" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/6</tspan>  The lift goes back down and the inner leaves close onto their gasket: the box waits in the 5.9 L vestibule.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.23333;0.41667" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/6</tspan>  Only then the outer slide opens and the gallery hoist lifts the box off the pawls; the slide closes again.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.41667;0.66667" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">5/6</tspan>  Each pass brings 5.9 L of room air into the vestibule: in a freezer it rimes up and needs a daily 10 W warm-up and a drain.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.66667;1.00000" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">6/6</tspan>  Per pass E loses the same as B (0.4 kJ): cold air does not climb out of a top hatch. E only helps if a NoFrost jet sweeps the window.</text></g>
</svg>