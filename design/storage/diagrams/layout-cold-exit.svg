<text x="1550" y="392" class="s r">NoFrost ceiling jet</text>
<text x="1550" y="408" class="s r">is turned down</text>
<rect x="1310" y="500" width="80" height="40" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/>
<text x="1350" y="525" class="s c">hoist</text>
<text x="1350" y="566" class="s c b">hoist servo inside at −18 °C:</text>
<text x="1350" y="584" class="s c">warmed 60 s by its winding before a move</text>
<text x="1140" y="660" class="s">The fridge (≈ 55 passes a day) stands next to</text>
<text x="1140" y="678" class="s">the ambient column; the freezer (≈ 10 a day)</text>
<text x="1140" y="696" class="s">at the machine end.</text>
<text x="1140" y="740" class="s">Planned boxes are dug to the port stack overnight</text>
<text x="1140" y="758" class="s">with the hatch closed; an unplanned bottom box</text>
<text x="1140" y="776" class="s">in the fridge takes ≈ 60–70 s.</text>
<rect x="0" y="852" width="1600" height="48" fill="#eef1f4"/>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">1/5 </tspan>Inside, with the hatch closed, the trolley has put the wanted box on top of the port stack under the window.<animate attributeName="opacity" values="1;0" keyTimes="0;0.19" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">2/5 </tspan>The gallery hook arrives; the slide lifts off its magnetic gasket and parks to the side.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.19;0.28" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">3/5 </tspan>The hook passes through the throat, its hooks snap under the box rims, the box comes up.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.28;0.4" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">4/5 </tspan>The spring pulls the slide back onto the gasket: open about 3.4 s. The box travels to the cell.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.59" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">5/5 </tspan>The cold robot keeps working inside with the window closed.<animate attributeName="opacity" values="0;1" keyTimes="0;0.59" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<rect x="0" y="850" width="1600" height="3" fill="#f28c28" transform="scale(0 1)"><animateTransform attributeName="transform" type="scale" values="0 1;1 1" dur="16s" repeatCount="indefinite"/></rect>
</svg>
