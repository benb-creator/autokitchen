<!-- Storage layout: cold module with top-wall exit (C1 concept B) and S1 stacks inside. Source: 10-storage-comparison.md 0, 4.1, 5.3, 6.1-6.3. Panel A side section Y/Z at 0.3 px/mm, panel B front section X/Z through the exit at 1 px/mm, panel C freezer detail schematic. Simplifications: insulation thickness of the top wall (60 mm), slide travel and the CoreXY layout are the simplest reading (the document fixes window 260 x 260, throat 210 x 200, slide 40 mm); the trolley and hoist are drawn as one block; only the port stack and one neighbour are drawn in panel B. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
