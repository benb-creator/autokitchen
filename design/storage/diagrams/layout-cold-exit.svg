<text x="24" y="34" class="l b">Cold stores: one window in the top wall, robot inside</text>
<text x="24" y="58" class="m">A built-in fridge and freezer each get a window cut in the top wall; a sprung slide opens only while the gallery hook passes.</text>
<text x="1576" y="28" class="s r b">window 260 × 260 · throat 210 × 200 (S and M boxes)</text>
<text x="1576" y="47" class="s r">open ≈ 3.4 s per passage (≤ 10 s allowed)</text>
<text x="1576" y="66" class="s r">added energy: fridge ≈ 7 kWh/a, freezer ≈ 38 kWh/a</text>
<text x="1576" y="85" class="s r">inside: S1, 2 × 2 GN 1/6 stacks + CoreXY trolley with hoist</text>
