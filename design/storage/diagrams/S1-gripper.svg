<!-- S1 gripper close-up. Source: design/storage/S1-grab-from-top.md 1.4 (gripper section), 2 (rim, lid), 3.1 (grip cycle). The document says: passive hooks, toggle cam inside the plate, yoke slides 15 mm in the plate, slack indexes the cam 90 deg, 12 mm over-travel. Simplest reading drawn here: the tapes hang on the yoke; when the tapes go slack the yoke drops and a ballpoint-pen ratchet turns an oval cam 90 deg; the cam pushes two rods to the hook levers (long axis across = hooks closed). Hooks are drawn 2 mm thick so they swing within the 12 mm gap; lug, pivot and rod positions, plate and box masses are assumed. Section at 2.4 px/mm, top view at 1.6 px/mm. 16 s loop. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.i{font-style:italic}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">S1  The passive hook gripper — how it grips without a motor</text><text x="24" y="58" class="m">Each touch-down flips a cam inside the plate: hooks in, hooks out. The hoist and its load cell do all the work.</text><text x="1576" y="28" class="s r b">0 motors, 0 cables in the gripper · grip or release 0.5 s</text><text x="1576" y="47" class="s r">plate 172 × 158 × 30 mm stainless · 2 tapes 0.1 × 15 mm, Ø 60 drum</text><text x="1576" y="66" class="s r">over-travel 12 mm · yoke stroke 15 mm in the plate</text><text x="1576" y="85" class="s r">hook seats ≥ 25 mm, mid of the 162 mm sides · 2 × 30 N [to be measured]</text><text x="40" y="112" class="s b">SECTION THROUGH THE HOOKS (2.4 px/mm)</text><defs><clipPath id="sec"><rect x="40" y="120" width="860" height="700"/></clipPath></defs><g clip-path="url(#sec)"><line x1="230" y1="130" x2="230" y2="810" stroke="#9aa1a8" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="710" y1="130" x2="710" y2="810" stroke="#9aa1a8" stroke-width="1.2" stroke-dasharray="6 5"/><polygon points="-175.6,742 213.2,742 198.8,976 -161.2,976" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><polygon points="-168.4,856 206,856 196.4,971.2 -158.8,971.2" fill="#c99a5b" stroke="none" stroke-width="0"/><rect x="-192.4" y="736" width="422.4" height="6" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><rect x="-192.4" y="712" width="422.4" height="24" fill="#c9ccd0" stroke="#3a3f45" stroke-width="2"/><line x1="-173.2" y1="734.1" x2="210.8" y2="734.1" stroke="#6b4c8a" stroke-width="2.5"/><polygon points="726.8,742 1115.6,742 1101.2,976 741.2,976" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><polygon points="734,856 1108.4,856 1098.8,971.2 743.6,971.2" fill="#c99a5b" stroke="none" stroke-width="0"/><rect x="710" y="736" width="422.4" height="6" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><rect x="710" y="712" width="422.4" height="24" fill="#c9ccd0" stroke="#3a3f45" stroke-width="2"/><line x1="729.2" y1="734.1" x2="1113.2" y2="734.1" stroke="#6b4c8a" stroke-width="2.5"/><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.5625" dur="16s" calcMode="discrete" repeatCount="indefinite"/><polygon points="275.6,670 664.4,670 650,904 290,904" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><polygon points="282.8,784 657.2,784 647.6,899.2 292.4,899.2" fill="#9cbf6b" stroke="none" stroke-width="0"/><rect x="258.8" y="664" width="422.4" height="6" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><rect x="258.8" y="640" width="422.4" height="24" fill="#c9ccd0" stroke="#3a3f45" stroke-width="2"/><line x1="278" y1="662.1" x2="662" y2="662.1" stroke="#6b4c8a" stroke-width="2.5"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.5625" dur="16s" calcMode="discrete" repeatCount="indefinite"/><polygon points="275.6,670 664.4,670 650,904 290,904" fill="#e6eef6" stroke="#3a3f45" stroke-width="2"/><polygon points="282.8,784 657.2,784 647.6,899.2 292.4,899.2" fill="#d98c5f" stroke="none" stroke-width="0"/><rect x="258.8" y="664" width="422.4" height="6" fill="#e6eef6" stroke="#3a3f45" stroke-width="2"/><rect x="258.8" y="640" width="422.4" height="24" fill="#c9ccd0" stroke="#3a3f45" stroke-width="2"/><line x1="278" y1="662.1" x2="662" y2="662.1" stroke="#6b4c8a" stroke-width="2.5"/></g><text x="470" y="784" class="s c h">box below</text><text x="18.8" y="856" class="s c h">neighbour stack</text><text x="921.2" y="856" class="s c h">neighbour stack</text><g><animateTransform attributeName="transform" type="translate" values="0 -0;0 -0;0 -24;0 -24;0 -240;0 -240;0 -0;0 -0" keyTimes="0.0000;0.2812;0.3250;0.3688;0.4375;0.4750;0.5437;1.0000" dur="16s" repeatCount="indefinite"/><polygon points="275.6,406 664.4,406 650,640 290,640" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><polygon points="282.8,520 657.2,520 647.6,635.2 292.4,635.2" fill="#e8c872" stroke="none" stroke-width="0"/><rect x="258.8" y="400" width="422.4" height="6" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><rect x="258.8" y="376" width="422.4" height="24" fill="#c9ccd0" stroke="#3a3f45" stroke-width="2"/><line x1="278" y1="398.1" x2="662" y2="398.1" stroke="#6b4c8a" stroke-width="2.5"/><text x="470" y="544" class="m c b h">GN 1/6-100 box, lid on top</text></g><g transform="translate(470 0)"><g><animateTransform attributeName="transform" type="translate" values="0 184;0 184;0 376;0 376;0 352;0 352;0 136;0 136;0 376;0 376;0 184;0 184" keyTimes="0.0000;0.0125;0.1250;0.2812;0.3250;0.3688;0.4375;0.4750;0.5437;0.6750;0.7688;1.0000" dur="16s" repeatCount="indefinite"/><rect x="-206.4" y="-72" width="412.8" height="72" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/><rect x="-72" y="-67.2" width="144" height="62.4" fill="#fbd3a8" stroke="#3a3f45" stroke-width="1.2"/><rect x="-223.2" y="-67.2" width="16.8" height="38.4" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/><rect x="206.4" y="-67.2" width="16.8" height="38.4" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/><line x1="-28.8" y1="-19.2" x2="-201.6" y2="-19.2" stroke="#7a3e06" stroke-width="3"/><line x1="28.8" y1="-19.2" x2="201.6" y2="-19.2" stroke="#7a3e06" stroke-width="3"/><ellipse cx="0" cy="-19.2" rx="28.8" ry="9.6" fill="#ffffff" stroke="#3a3f45" stroke-width="1.5"/><text x="0" y="-14.2" class="s c">cam</text><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 28.8;0 28.8;0 0;0 0;0 28.8;0 28.8;0 0;0 0" keyTimes="0.0000;0.1313;0.1812;0.2500;0.2812;0.5500;0.5813;0.6500;0.6750;1.0000" dur="16s" repeatCount="indefinite"/><rect x="-48" y="-67.2" width="96" height="19.2" fill="#b8580a" stroke="#3a3f45" stroke-width="1.5"/></g><g><animateTransform attributeName="transform" type="rotate" values="14 -218.4 -48;14 -218.4 -48;0 -218.4 -48;0 -218.4 -48;14 -218.4 -48;14 -218.4 -48" keyTimes="0.0000;0.1875;0.2375;0.5875;0.6375;1.0000" dur="16s" repeatCount="indefinite"/><path d="M-218.4,-48 L-218.4,34.8 L-199.2,34.8 L-199.2,30" fill="none" stroke="#b8580a" stroke-width="4.8" stroke-linejoin="round"/><circle cx="-218.4" cy="-48" r="3.5" fill="#fff" stroke="#3a3f45" stroke-width="1.5"/></g><g><animateTransform attributeName="transform" type="rotate" values="-14 218.4 -48;-14 218.4 -48;0 218.4 -48;0 218.4 -48;-14 218.4 -48;-14 218.4 -48" keyTimes="0.0000;0.1875;0.2375;0.5875;0.6375;1.0000" dur="16s" repeatCount="indefinite"/><path d="M218.4,-48 L218.4,34.8 L199.2,34.8 L199.2,30" fill="none" stroke="#b8580a" stroke-width="4.8" stroke-linejoin="round"/><circle cx="218.4" cy="-48" r="3.5" fill="#fff" stroke="#3a3f45" stroke-width="1.5"/></g></g></g><line x1="441.2" y1="120" x2="441.2" y2="300" stroke="#555" stroke-width="3"><animate attributeName="y2" values="116.8;116.8;308.8;308.8;337.6;337.6;308.8;284.8;284.8;68.8;68.8;308.8;308.8;337.6;337.6;308.8;116.8;116.8" keyTimes="0.0000;0.0125;0.1250;0.1313;0.1812;0.2500;0.2812;0.3250;0.3688;0.4375;0.4750;0.5437;0.5500;0.5813;0.6500;0.6750;0.7688;1.0000" dur="16s" repeatCount="indefinite"/></line><line x1="498.8" y1="120" x2="498.8" y2="300" stroke="#555" stroke-width="3"><animate attributeName="y2" values="116.8;116.8;308.8;308.8;337.6;337.6;308.8;284.8;284.8;68.8;68.8;308.8;308.8;337.6;337.6;308.8;116.8;116.8" keyTimes="0.0000;0.0125;0.1250;0.1313;0.1812;0.2500;0.2812;0.3250;0.3688;0.4375;0.4750;0.5437;0.5500;0.5813;0.6500;0.6750;0.7688;1.0000" dur="16s" repeatCount="indefinite"/></line></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0.0000;0.1313;0.2500;0.5500;0.6500" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="530" y="150" class="m b h">tapes slack</text></g><text x="716" y="790" class="s">12 mm gap</text><text x="224" y="790" class="s r">12 mm gap</text><text x="720" y="268" class="s">hook pivot</text><text x="720" y="285" class="s">(lug on the plate)</text><text x="720" y="436" class="s">hook tip under</text><text x="720" y="453" class="s">the flange (7 mm)</text><text x="220" y="323.2" class="s r">lid 10 mm</text><text x="220" y="340.2" class="s r">+ gasket</text><text x="220" y="404.8" class="s r">flange</text><text x="220" y="421.8" class="s r">≥ 7 mm overhang</text><text x="1000" y="112" class="s b">TOP VIEW OF THE PLATE ON A BOX (1.6 px/mm)</text><rect x="1026" y="212.4" width="64" height="259.2" fill="#f5f0e1" stroke="#9aa1a8" stroke-width="1.2"/><rect x="1109.2" y="145.2" width="281.6" height="48" fill="#f5f0e1" stroke="#9aa1a8" stroke-width="1.2"/><rect x="1410" y="212.4" width="64" height="259.2" fill="#f5f0e1" stroke="#9aa1a8" stroke-width="1.2"/><rect x="1109.2" y="490.8" width="281.6" height="48" fill="#f5f0e1" stroke="#9aa1a8" stroke-width="1.2"/><rect x="1109.2" y="212.4" width="281.6" height="259.2" fill="#c9ccd0" stroke="#3a3f45" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="1093.2" y="196.4" width="12.8" height="12.8" fill="#5f666d" stroke="none" stroke-width="0"/><rect x="1093.2" y="474.8" width="12.8" height="12.8" fill="#5f666d" stroke="none" stroke-width="0"/><rect x="1394" y="196.4" width="12.8" height="12.8" fill="#5f666d" stroke="none" stroke-width="0"/><rect x="1394" y="474.8" width="12.8" height="12.8" fill="#5f666d" stroke="none" stroke-width="0"/><rect x="1112.4" y="215.6" width="275.2" height="252.8" fill="#f28c28" stroke="#3a3f45" stroke-width="2" fill-opacity="0.55"/><text x="1154" y="246" class="s b">plate</text><g transform="translate(1250.0 342.0)"><g><animateTransform attributeName="transform" type="rotate" values="0 0 0;0 0 0;90 0 0;90 0 0;180 0 0;180 0 0" keyTimes="0.0000;0.1875;0.2375;0.5875;0.6375;1.0000" dur="16s" repeatCount="indefinite"/><ellipse cx="0" cy="0" rx="12.8" ry="25.6" fill="#ffffff" stroke="#3a3f45" stroke-width="2"/><line x1="0" y1="-22.4" x2="0" y2="-14.4" stroke="#3a3f45" stroke-width="2"/></g></g><circle cx="1250.0" cy="342.0" r="3" fill="#3a3f45"/><g><animateTransform attributeName="transform" type="translate" values="-12 0;-12 0;-0 0;-0 0;-12 0;-12 0" keyTimes="0.0000;0.1875;0.2375;0.5875;0.6375;1.0000" dur="16s" repeatCount="indefinite"/><rect x="1102.8" y="318" width="4.2" height="48" fill="#b8580a" stroke="#3a3f45" stroke-width="1.2"/><rect x="1104.4" y="318" width="12.8" height="48" fill="#b8580a" stroke="#3a3f45" stroke-width="1" fill-opacity="0.6"/></g><line x1="1224.4" y1="342.0" x2="1118.8" y2="342.0" stroke="#7a3e06" stroke-width="4"><animate attributeName="x1" values="1237.2;1237.2;1224.4;1224.4;1237.2;1237.2" keyTimes="0.0000;0.1875;0.2375;0.5875;0.6375;1.0000" dur="16s" repeatCount="indefinite"/></line><g><animateTransform attributeName="transform" type="translate" values="12 0;12 0;0 0;0 0;12 0;12 0" keyTimes="0.0000;0.1875;0.2375;0.5875;0.6375;1.0000" dur="16s" repeatCount="indefinite"/><rect x="1394" y="318" width="4.2" height="48" fill="#b8580a" stroke="#3a3f45" stroke-width="1.2"/><rect x="1382.8" y="318" width="12.8" height="48" fill="#b8580a" stroke="#3a3f45" stroke-width="1" fill-opacity="0.6"/></g><line x1="1275.6" y1="342.0" x2="1381.2" y2="342.0" stroke="#7a3e06" stroke-width="4"><animate attributeName="x1" values="1262.8;1262.8;1275.6;1275.6;1262.8;1262.8" keyTimes="0.0000;0.1875;0.2375;0.5875;0.6375;1.0000" dur="16s" repeatCount="indefinite"/></line><text x="1250" y="560.8" class="s c">cam turns 90° per touch-down:</text><text x="1250" y="577.8" class="s c">long axis across = hooks in, along = hooks out</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2375;0.5875" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="1250" y="135.2" class="m c b">hooks IN (box held)</text></g><g opacity="1"><animate attributeName="opacity" values="1;0;1" keyTimes="0.0000;0.2375;0.5875" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="1250" y="135.2" class="m c b">hooks OUT (free)</text></g><text x="1474" y="246" class="s">■ corner</text><text x="1474" y="263" class="s">  posts</text><text x="1474" y="358" class="s">hooks in the</text><text x="1474" y="375" class="s">12 mm gap</text><text x="1010" y="608" class="s b">HOIST LOAD CELL — how the trolley knows what happened</text><line x1="1010" y1="760" x2="1550" y2="760" stroke="#3a3f45" stroke-width="1.5"/><line x1="1010" y1="760" x2="1010" y2="630" stroke="#3a3f45" stroke-width="1.5"/><polyline points="1010,715 1077.5,715 1080.9,756 1151.8,756 1165.2,650 1266.5,650 1303.6,650 1307,756 1364.4,756 1374.5,715 1550,715" fill="none" stroke="#f28c28" stroke-width="3"/><text x="1013.4" y="707" class="s">plate</text><text x="1091" y="748" class="s">slack = landed</text><text x="1172" y="642" class="s">plate + box = weighed (±5 g)</text><text x="1310.4" y="748" class="s">landed</text><g><animateTransform attributeName="transform" type="translate" values="0 0;540 0" keyTimes="0.0000;1.0000" dur="16s" repeatCount="indefinite"/><line x1="1010" y1="764" x2="1010" y2="630" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/></g><text x="1550" y="778" class="s r">time →</text><text x="1004" y="640" class="s r">force</text><rect x="0" y="846" width="1600" height="54" fill="#f3f5f7" stroke="none" stroke-width="0"/><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.1281" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">1/6  The plate comes down on its two steel tapes. Hooks open (swung out into the 12 mm gap between stacks).</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.1281;0.1875" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">2/6  Touch-down on the lid: the load cell sees the weight vanish, the hoist pays out 12 mm more, the yoke drops.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.1875;0.2500" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">3/6  The dropping yoke turns the cam 90° (like a ballpoint pen): the hooks swing in under the box flange.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2500;0.4750" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">4/6  Lift: hooks pull the flange against the plate, so the lid is clamped shut. Check lift 10 mm, weigh, carry.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.4750;0.6500" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">5/6  Set down on another stack: slack again → the cam turns another 90° → the hooks swing out.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.6500" dur="16s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">6/6  The plate lifts free. Every touch-down toggles the hooks: no motor, no cable, nothing powered in the gripper.</text></g></svg>
