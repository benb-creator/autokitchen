<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">C1-B  DETAIL — lift-and-slide hatch on a magnetic gasket</text>
<text x="24" y="58" class="m">The slide never rubs on its seal: ramps lift it off the gasket before it moves, and drop it onto the gasket when it returns.</text>
<text x="1576" y="28" class="s r b">slide 250 × 240 × 40 mm, PP shell, PU core</text>
<text x="1576" y="47" class="s r">ramps: 4 mm lift in the first 6 mm of travel</text>
<text x="1576" y="66" class="s r">stroke 260 mm, ≈ 0.8 s; peel force ≈ 15 N</text>
<text x="1576" y="85" class="s r">fail-closed: constant-force spring</text>
<text x="1576" y="104" class="s r">freezer: 3 W heated seat, dew-point controlled</text>
<clipPath id="ca"><rect x="40" y="120" width="830" height="290"/></clipPath>
