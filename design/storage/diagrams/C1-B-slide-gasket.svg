<text x="60" y="112" class="s b">SECTION THROUGH THE SLIDE (front view), 1.4 px per mm</text>
<line x1="620" y1="238.2" x2="901" y2="173" stroke="#777" stroke-width="1.2"/>
<text x="905" y="178" class="s b">slide: PP shell, 40 mm PU core</text>
<line x1="768.4" y1="218.6" x2="901" y2="205.2" stroke="#777" stroke-width="1.2"/>
<text x="905" y="210.2" class="s">roller on a rail with a 4 mm pocket</text>
<line x1="827.2" y1="262" x2="901" y2="234.6" stroke="#777" stroke-width="1.2"/>
<text x="905" y="239.6" class="s">constant-force spring (closes)</text>
<line x1="783.8" y1="301.2" x2="901" y2="266.8" stroke="#777" stroke-width="1.2"/>
<text x="905" y="271.8" class="s b">magnetic gasket on 1.4016 stainless plate</text>
<line x1="818.8" y1="306.8" x2="901" y2="294.8" stroke="#777" stroke-width="1.2"/>
<text x="905" y="299.8" class="s">butyl bead: vapour seal of the foam edge</text>
<line x1="783.8" y1="308.2" x2="901" y2="322.8" stroke="#777" stroke-width="1.2"/>
<text x="905" y="327.8" class="s">heater wire under the seat (freezer)</text>
<line x1="830" y1="339" x2="901" y2="350.8" stroke="#777" stroke-width="1.2"/>
<text x="905" y="355.8" class="s">top wall: skin, PU foam 50 (freezer 70)</text>
<line x1="785.2" y1="367" x2="901" y2="376" stroke="#777" stroke-width="1.2"/>
<text x="905" y="381" class="s">throat: double-wall PP, foamed</text>
<line x1="806.2" y1="383.8" x2="901" y2="401.2" stroke="#777" stroke-width="1.2"/>
<text x="905" y="406.2" class="s">MS-polymer bead at the liner</text>
<text x="43.2" y="220" class="s h">motor + cord (opens)</text>
<text x="620" y="392" class="s c h">cold throat 210 mm</text>
<text x="60" y="450" class="s b">ZOOM: right edge, 4 px per mm</text>
