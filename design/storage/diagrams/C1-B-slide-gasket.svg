<text x="402" y="520" class="s">roller drops 4 mm into</text>
<text x="402" y="537" class="s">its pocket: slide sits down</text>
<line x1="216" y1="736" x2="398" y2="610" stroke="#777" stroke-width="1.2"/>
<text x="402" y="615" class="s">gasket pressed by weight</text>
<text x="402" y="632" class="s">and magnet: compression seal</text>
<line x1="216" y1="762" x2="398" y2="705" stroke="#777" stroke-width="1.2"/>
<text x="402" y="710" class="s">heater wire, 3 W</text>
<text x="402" y="727" class="s">(freezer only)</text>
<text x="690" y="460" class="s b">WHY A PRESSED GASKET AND NOT A SLIDING SEAL</text>
<rect x="700" y="510" width="160" height="30" fill="#e2e6eb" stroke="#3a3f45" stroke-width="2"/>
<rect x="710" y="540" width="26" height="10" fill="#6b4c8a" stroke="#3a3f45" stroke-width="1.5"/>
<rect x="824" y="540" width="26" height="10" fill="#6b4c8a" stroke="#3a3f45" stroke-width="1.5"/>
<rect x="690" y="550" width="180" height="6" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5"/>
<rect x="736" y="556" width="88" height="50" fill="#cfe8f8" stroke="none" stroke-width="0"/>
<text x="780" y="630" class="s c">pressed gasket: tight,</text>
<text x="780" y="647" class="s c">opens without rubbing</text>
<rect x="950" y="510" width="160" height="30" fill="#e2e6eb" stroke="#3a3f45" stroke-width="2"/>
<rect x="940" y="550" width="180" height="6" fill="#8fa8c0" stroke="#3a3f45" stroke-width="1.5"/>
<path d="M962 540 l4 10 M970 540 l4 10 M1080 540 l4 10 M1088 540 l4 10" fill="none" stroke="#6b4c8a" stroke-width="2"/>
<rect x="986" y="556" width="88" height="50" fill="#cfe8f8" stroke="none" stroke-width="0"/>
<rect x="954" y="550" width="30" height="0" fill="url(#rime)" stroke="#2f8fd0" stroke-width="1"><animate attributeName="height" values="0;0;14;14;14" keyTimes="0.00000;0.66667;0.94444;0.99444;1.00000" dur="18s" repeatCount="indefinite"/><animate attributeName="y" values="550;550;536;536;536" keyTimes="0.00000;0.66667;0.94444;0.99444;1.00000" dur="18s" repeatCount="indefinite"/></rect>
<rect x="1076" y="550" width="30" height="0" fill="url(#rime)" stroke="#2f8fd0" stroke-width="1"><animate attributeName="height" values="0;0;14;14;14" keyTimes="0.00000;0.66667;0.94444;0.99444;1.00000" dur="18s" repeatCount="indefinite"/><animate attributeName="y" values="550;550;536;536;536" keyTimes="0.00000;0.66667;0.94444;0.99444;1.00000" dur="18s" repeatCount="indefinite"/></rect>
<line x1="1130" y1="530" x2="1100" y2="545" stroke="#e8836f" stroke-width="2.5" marker-end="url(#aw)"/>
<text x="1030" y="630" class="s c">sliding or brush seal: leaks,</text>
<text x="1030" y="647" class="s c">grows ≈ 13 kg of ice a year</text>
<text x="1140" y="520" class="s">humid room air</text>
<text x="1140" y="537" class="s">sucked in (stack effect)</text>
<text x="690" y="700" class="s">Fridge: no heater needed; the plastic throat is the thermal break, so the seat stays above the dew point.</text>
<text x="690" y="720" class="s">Freezer: heater wire under the seat, switched by room humidity and a seat sensor (about 50 % duty).</text>
<text x="690" y="740" class="s">Condensate on the cold sleeve runs down into the gutter ring and the cell's own drain, never onto the box.</text>
<text x="690" y="770" class="s">Window cut: 260 × 260 mm in a verified free band of the top wall; sleeve flanges sealed with</text>
<text x="690" y="790" class="s">butyl outside and MS polymer inside, cavity foamed, so no moisture reaches the foam.</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.00000;0.11111" dur="18s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/6</tspan>  Closed: the slide sits on its magnetic gasket on the stainless exit plate, a pressed seal like a fridge door.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.11111;0.16667" dur="18s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/6</tspan>  Opening, first 6 mm: the rollers climb out of their pockets, the slide lifts 4 mm and peels the gasket off (about 15 N).</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.16667;0.50000" dur="18s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/6</tspan>  Then the motor pulls the slide 260 mm aside on its rails: the throat is open and the box passes up.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.50000;0.64444" dur="18s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/6</tspan>  Closing: the constant-force spring pulls the slide back and the rollers drop into the pockets: the gasket is pressed shut.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.64444;0.80556" dur="18s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">5/6</tspan>  No power needed to close: on power loss the spring shuts it. In the freezer a 3 W wire keeps the seat from freezing on.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.80556;1.00000" dur="18s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">6/6</tspan>  Room air is pushed in at the top of a closed cold cell, so only a pressed seal stays tight; a sliding seal would ice up.</text></g>
</svg>