<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.35;0.7" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="1160" y="172" class="s c b">lifted off the pins: springs close the hooks</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.48;0.61" dur="24s" repeatCount="indefinite" calcMode="discrete"/><text x="1160" y="192" class="s c">turned upside down: the box cannot fall</text></g>
<text x="1160" y="722" class="s c">the stub axis (circle) is the hand’s roll axis</text>
<rect x="0" y="852" width="1600" height="48" fill="#eef1f4"/>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">1/6 </tspan>The gallery lowers the lidded box down the shaft; at the lid station a vacuum cup keeps the lid.<animate attributeName="opacity" values="1;0" keyTimes="0;0.2" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">2/6 </tspan>The box drops into the carrier on the shelf; the end pusher presses it towards the stub; the shelf pins hold the hooks open.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.3" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">3/6 </tspan>The cell hand engages the stub and lifts the carrier: off the pins, the springs close the hooks over the box rims.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.42" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">4/6 </tspan>The hand can pour or turn the box upside down: the hooks hold it.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.42;0.67" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">5/6 </tspan>Back on the shelf, the pins open the hooks again.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.67;0.81" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">6/6 </tspan>The gallery takes the box up; the lid station puts the lid back on; the box returns to storage.<animate attributeName="opacity" values="0;1" keyTimes="0;0.81" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
<rect x="0" y="850" width="1600" height="3" fill="#f28c28" transform="scale(0 1)"><animateTransform attributeName="transform" type="scale" values="0 1;1 1" dur="24s" repeatCount="indefinite"/></rect>
</svg>
