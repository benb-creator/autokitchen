<!-- Storage layout: lid station and stub carrier on the cell box shelf. Source: 10-storage-comparison.md 5.2, 5.3 (stub carrier), 5.4 K-2, K-3, K-5, K-8. Panel A side section Y/Z at 1 px/mm (wall on the left), panel B end section X/Z through the box mid-span at 1.4 px/mm. Simplifications: spring-hook and pin geometry, the vacuum-cup slide and the bayonet are the simplest reading (the document fixes their function, not their shape); the K9b hand is drawn as a sleeve on the stub. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
