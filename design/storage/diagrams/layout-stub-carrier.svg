<text x="24" y="34" class="l b">Stub carrier: a stubless box rides in a carrier that has the stub</text>
<text x="24" y="58" class="m">In the cell every box sits in a permanent carrier. Shelf pins hold its spring hooks open; lifted, the hooks close over the rims.</text>
<text x="1576" y="28" class="s r b">carrier: GN 1/3 opening 325 × 176, 1.4404, ≤ 0.7 kg</text>
<text x="1576" y="47" class="s r">carrier + 5 kg box ≈ 5.7 kg, ≈ 7 Nm (hand: 6 kg, 9.4 Nm)</text>
<text x="1576" y="66" class="s r">box shelf z 1550: 2 carriers + 1 red carrier for raw food</text>
<text x="1576" y="85" class="s r">0 actuators: pins and springs only</text>
