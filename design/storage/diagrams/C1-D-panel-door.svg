<text x="24" y="34" class="l b">C1-D  PANEL DOOR CARRYING THE MECHANISM — exit through B's top window (D2)</text>
<text x="24" y="58" class="m">An insulated door panel carries the S2 car; the car brings the box up to a port shelf under the top-wall throat; opening the door swings everything out.</text>
<text x="1576" y="28" class="s r b">access ≈ €500–535 per shell (door + B exit)</text>
<text x="1576" y="47" class="s r">with S2 car and shelves ≈ €1,100–1,150</text>
<text x="1576" y="66" class="s r">retrieval ≈ 17 s, hatch open 3.4 s</text>
<text x="1576" y="85" class="s r">S2: 38–42 places in a fridge (fewer than 45), ≈ 30 freezer</text>
<text x="1576" y="104" class="s r">+9–12 kWh/yr fridge, +43–51 kWh/yr freezer</text>
