<text x="1120" y="150" class="s b">WHAT D2 BUYS AND WHAT IT COSTS</text>
<text x="1120" y="176" class="s">+ best manual access: open the door and every</text>
<text x="1120" y="196" class="s">  lane is in reach; the mechanism is cleaned</text>
<text x="1120" y="216" class="s">  outside the cold</text>
<text x="1120" y="236" class="s">+ no fittings on the liner</text>
<text x="1120" y="276" class="s">− custom door: 5 m of gasket must seal as well</text>
<text x="1120" y="296" class="s">  as the OEM door (largest leak line)</text>
<text x="1120" y="316" class="s">− door 6–8 kg heavier on OEM hinges rated</text>
<text x="1120" y="336" class="s">  ≈ 18–25 kg with a furniture front</text>
<text x="1120" y="356" class="s">− X and Y motors ride on the car in the cold</text>
<text x="1120" y="376" class="s">− motor cable loops across the hinge</text>
<text x="1120" y="396" class="s">− S2 holds only 38–42 in a fridge (fewer than 45)</text>
<text x="1120" y="436" class="s">D1 (port in the door) does not fit: it needs</text>
<text x="1120" y="456" class="s">a shaft wide enough for the door to swing.</text>
<text x="1120" y="496" class="s b">Good option for the freezer if S2 is chosen.</text>
<rect x="30" y="852" width="1540" height="36" rx="6" fill="#f1f3f5" stroke="#c4cad1" stroke-width="1"/>
<g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.00000;0.03333" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">1/7</tspan>  D2: the OEM door is replaced by an insulated panel that carries the S2 car on two Z rails; the exit is B's window in the top wall.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.03333;0.13333" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">2/7</tspan>  The car lifts the box to the top level; its Z motor sits outside on the warm face of the door.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.13333;0.20000" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">3/7</tspan>  At the top the car's toe pushes the box about 100 mm rearwards onto a fixed port shelf under the throat.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.20000;0.40000" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">4/7</tspan>  B's hatch opens for 3.4 s and the gallery hoist lifts the box out; the heavy cold air stays in the cell.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.40000;0.53333" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">5/7</tspan>  The hatch closes and the car goes back down; all moves inside the cell happen with the hatch shut.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.53333;0.83333" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">6/7</tspan>  Service: opening the door swings the whole mechanism out of the cell, so every lane is open to the hand.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.83333;1.00000" dur="30s" calcMode="discrete" repeatCount="indefinite"/><text x="44" y="876" class="m"><tspan class="b">7/7</tspan>  Price: a custom door with 5 m of gasket, 6–8 kg more on the OEM hinges, motors in the cold, under 45 places in a fridge.</text></g>
</svg>