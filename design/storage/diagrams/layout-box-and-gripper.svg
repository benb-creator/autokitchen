<rect x="283.6" y="422" width="10" height="194.2" fill="#f28c28" stroke="#3a3f45" stroke-width="1" opacity="0.8"/>
<rect x="76" y="502.6" width="18" height="33" fill="#3c9a6a" stroke="#3a3f45" stroke-width="1"/>
<rect x="279.6" y="502.6" width="18" height="33" fill="#3c9a6a" stroke="#3a3f45" stroke-width="1"/>
