<rect x="411.8" y="173" width="115.6" height="4" fill="#2b2f33" stroke="none" stroke-width="0"/>
<text x="469.6" y="320" class="s c b">XL 200</text>
<text x="40" y="344" class="s">GN 1/9 (176 × 108) in 65 and 100 for spices; no GN 1/3 storage boxes</text>
<text x="24" y="400" class="s b">TOP VIEW OF A GN 1/6 (lid off)</text>
<rect x="80" y="422" width="213.6" height="194.2" fill="#d9d2bf" stroke="#3a3f45" stroke-width="2"/>
<rect x="90" y="430" width="193.6" height="178.2" fill="#f5f0e1" stroke="#3a3f45" stroke-width="1.5"/>
