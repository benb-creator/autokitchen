<rect x="0" y="852" width="1600" height="48" fill="#eef1f4"/>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">1/5 </tspan>The gripper comes down on the hoist; its open frame lands on the box rim.<animate attributeName="opacity" values="1;0" keyTimes="0;0.16" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">2/5 </tspan>The landing pushes the toggle cam one click: both hooks swing in under the long-side rims at mid-span.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.16;0.26" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">3/5 </tspan>The box hangs on two hooks; it can be lifted, carried and set down; its opening stays free.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.26;0.57" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">4/5 </tspan>Set down, the frame lands again: the next click opens the hooks.<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.57;0.66" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="24" y="876" class="m" opacity="0"><tspan class="b">5/5 </tspan>The gripper lifts off. The same gripper serves the gallery and both cold robots.<animate attributeName="opacity" values="0;1" keyTimes="0;0.66" dur="16s" repeatCount="indefinite" calcMode="discrete"/></text>
<rect x="0" y="850" width="1600" height="3" fill="#f28c28" transform="scale(0 1)"><animateTransform attributeName="transform" type="scale" values="0 1;1 1" dur="16s" repeatCount="indefinite"/></rect>
</svg>
