<line x1="90" y1="642.2" x2="283.6" y2="642.2" stroke="#555" stroke-width="1.2"/><line x1="90" y1="637.2" x2="90" y2="647.2" stroke="#555" stroke-width="1.2"/><line x1="283.6" y1="637.2" x2="283.6" y2="647.2" stroke="#555" stroke-width="1.2"/><text x="186.8" y="659.2" class="s c">176 between the long-side rims</text>
<text x="307.6" y="460" class="s" fill="#f28c28">long-side rims (≥ 9 mm overhang):</text>
<text x="307.6" y="478" class="s">runners and hooks use these</text>
<text x="307.6" y="524.1" class="s" fill="#3c9a6a">free underside ≥ 30 mm at mid-span</text>
<text x="307.6" y="416" class="s" fill="#6b4c8a">J-hook seat on both ends</text>
<text x="307.6" y="622.2" class="s" fill="#2b2f33">NFC tag in each end rim</text>
<text x="24" y="700" class="s">Lid: flat gasketed seal-cover, ≤ 8 mm, no clips; taken off at the</text>
<text x="24" y="718" class="s">lid station before the cell. Bottom: flat, foot ring.</text>
<text x="24" y="742" class="s b">Nothing sticks out of the rim outline: no stub, no tang, no rib.</text>
<text x="24" y="766" class="s">Empties nest without lids at ≤ 25 mm pitch.</text>
<text x="600" y="100" class="s b">B  THE PASSIVE GRIPPER (section across the box at mid-span)</text>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -100;0 -100;0 0;0 0" keyTimes="0;0.26;0.38;0.47;0.57;1" dur="16s" repeatCount="indefinite"/><path d="M654.0 425 L662.0 620 L998.0 620 L1006.0 425" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2.5"/><rect x="636" y="420" width="388" height="5" fill="#d9d2bf" stroke="#3a3f45" stroke-width="1.5"/><path d="M636.0 425 l0 10 M1024.0 425 l0 10" fill="none" stroke="#3a3f45" stroke-width="2.5"/><rect x="674" y="480" width="312" height="120" fill="#e8c547" stroke="none" stroke-width="0" opacity="0.5"/><text x="830" y="460" class="s c">open frame: the box opening stays free</text></g>
<rect x="614" y="620" width="432" height="10" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1.5"/>
<text x="830" y="656" class="s c">any place: rack runners, cold grid, cell carrier</text>
<g><animateTransform attributeName="transform" type="translate" values="0 -150;0 0;0 0;0 -100;0 -100;0 0;0 0;0 -150;0 -150" keyTimes="0;0.16;0.26;0.38;0.47;0.57;0.66;0.78;1" dur="16s" repeatCount="indefinite"/><line x1="830" y1="280" x2="830" y2="348" stroke="#555" stroke-width="3"/><rect x="624" y="404" width="412" height="12" fill="none" stroke="#2b2f33" stroke-width="4"/><line x1="830" y1="370" x2="830" y2="404" stroke="#2b2f33" stroke-width="3"/><circle cx="830" cy="360" r="12" fill="#ffffff" stroke="#3a3f45" stroke-width="1.5"/><g><animateTransform attributeName="transform" type="rotate" values="0 830 360;0 830 360;45 830 360;45 830 360;90 830 360;90 830 360" keyTimes="0;0.16;0.2;0.59;0.62;1" dur="16s" repeatCount="indefinite"/><line x1="830" y1="360" x2="846" y2="360" stroke="#f28c28" stroke-width="4"/><line x1="830" y1="360" x2="830" y2="376" stroke="#f28c28" stroke-width="4"/><line x1="830" y1="360" x2="814" y2="360" stroke="#f28c28" stroke-width="4"/><line x1="830" y1="360" x2="830" y2="344" stroke="#f28c28" stroke-width="4"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;16 0;16 0;0 0;0 0" keyTimes="0;0.19;0.23;0.6;0.64;1" dur="16s" repeatCount="indefinite"/><path d="M628.0 406 L628.0 438 L642.0 438" fill="none" stroke="#f28c28" stroke-width="6"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-16 0;-16 0;0 0;0 0" keyTimes="0;0.19;0.23;0.6;0.64;1" dur="16s" repeatCount="indefinite"/><path d="M1032.0 406 L1032.0 438 L1018.0 438" fill="none" stroke="#f28c28" stroke-width="6"/></g><text x="854" y="365" class="s">toggle cam (like a ballpoint pen)</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.61" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="808" y="365" class="s r b">hooks closed</text></g><g opacity="0"><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.2;0.61" dur="16s" repeatCount="indefinite" calcMode="discrete"/><text x="808" y="365" class="s r b">hooks open</text></g></g>
<text x="1180" y="100" class="s b">C  THE SAME HOOKS EVERYWHERE</text>
