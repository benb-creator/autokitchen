<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- Storage layout: the box standard and the one passive gripper. Source: 10-storage-comparison.md 5.1-5.3. Panel A side views at 0.6 px/mm and a top view at 1.1 px/mm; panel B section across the box at mid-span at 2 px/mm; panel C top-view sketches. Simplifications: the toggle ("ballpoint pen") cam is drawn as a two-state star wheel; hook arms pivot on the frame; rim skirt, lid pads and seal are simplified. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.w{fill:#fff}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">Box standard: bought GN 1/6 boxes, no stub — and one gripper for all of them</text>
<text x="24" y="58" class="m">Every box is 176 mm across its long sides; a passive gripper rests on the rim and hooks under it at mid-span.</text>
<text x="1576" y="28" class="s r b">GN 1/6 (176 × 162) depth 65 S · 100 M · 150 T · 200 XL (fridge)</text>
<text x="1576" y="47" class="s r">GN 1/9 (176 × 108) for spices, hangs in an S slot</text>
<text x="1576" y="66" class="s r">PP copolymer or Tritan, −40…+95 °C, ≤ 5 kg</text>
<text x="1576" y="85" class="s r">gripper: no motor, no wire — the push toggles it</text>
<text x="24" y="100" class="s b">A  THE BOX FAMILY (side views)</text>
