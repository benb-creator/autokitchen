<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- S2 toe and pull rib close-up. Source: design/storage/S2-dense-pushers.md 1.7 (car, toe, engagement by Z, sketch), 2.2 (pull rib, pads), 3.1. Section at the right lane edge, 4 px/mm; the box is a GN 1/6-100 in the right lane. The document gives a 5 mm proud rib with a 10 x 5 mm through-slot; to show a face the pin can pull on, the slot is drawn 3 mm wide with 1 mm webs (the conical pin is at most 3 mm wide at rib height) - to be settled in detail design. The pull is shown for 70 of the 182 mm. Arm position in the shaft, pad positions and deck build-up are assumed. Y-search inset: the doc says Z stops 6 mm early on a miss and a +-3 mm Y search follows. -->
<style>text{font-family:system-ui,sans-serif;fill:#2b2f33}.b{font-weight:700}.s{font-size:14px}.m{font-size:16px}.l{font-size:20px}.c{text-anchor:middle}.r{text-anchor:end}.h{stroke:#fff;stroke-width:4;paint-order:stroke}.i{font-style:italic}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="24" y="34" class="l b">S2  The toe and the pull rib — how the car couples to a box</text><text x="24" y="58" class="m">A pin under the car's toe drops into a slotted rib at the foot of the box. The car itself does the dropping.</text><text x="1576" y="28" class="s r b">pull ≤ 15 N (5 kg × μ 0.3) · pin and rib sized for 80 N</text><text x="1576" y="47" class="s r">pin Ø 4 × 8 mm, conical · toe at deck + 18…28 mm</text><text x="1576" y="66" class="s r">reach ≤ 13 mm into the lane · deck-to-shelf gap 3 mm</text><text x="1576" y="85" class="s r">rib 40 mm long at base + 12…16, 5 mm proud, slot 10 × 5, NFC tag inside</text><text x="40" y="112" class="s b">SECTION AT THE LANE EDGE (3.2 px/mm)</text><defs><clipPath id="w"><rect x="40" y="124" width="820" height="690"/></clipPath></defs><rect x="40" y="124" width="820" height="690" fill="#f6f7f8" stroke="#3a3f45" stroke-width="2"/><g clip-path="url(#w)"><rect x="420" y="640" width="704" height="6.4" fill="#9aa1a8" stroke="#3a3f45" stroke-width="1.5"/><rect x="420" y="646.4" width="704" height="96" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1"/><text x="631.2" y="691.2" class="s c">shelf, 1° slope →</text><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-224 0;-224 0" keyTimes="0.0000;0.3714;0.6429;1.0000" dur="14s" repeatCount="indefinite"/><polygon points="461.6,635.2 1124,635.2 1124,628.8 468,628.8 452.6,328 446.2,328" fill="#f5f0e1" stroke="#3a3f45" stroke-width="1.5"/><polygon points="469.6,627.2 1124,627.2 1124,464 460.3,464" fill="#e8c872" stroke="#3a3f45" stroke-width="0"/><polygon points="439.2,328 1124,328 1124,320 439.2,320" fill="#f5f0e1" stroke="#3a3f45" stroke-width="1.5"/><polygon points="439.2,320 1124,320 1124,300.8 439.2,300.8" fill="#c9ccd0" stroke="#3a3f45" stroke-width="1.5"/><line x1="445.6" y1="316.8" x2="1124" y2="316.8" stroke="#6b4c8a" stroke-width="3"/><rect x="484" y="635.2" width="48" height="4.8" fill="#7d858d" stroke="#3a3f45" stroke-width="1"/><polygon points="445.6,601.6 462.9,601.6 462.9,588.8 445.6,588.8" fill="#e9e2c8" stroke="#3a3f45" stroke-width="1.5"/><rect x="448.8" y="588.8" width="9.6" height="12.8" fill="#ffffff" stroke="#3a3f45" stroke-width="1"/><rect x="452.6" y="592" width="5.1" height="6.4" fill="#4b8f5a" stroke="none" stroke-width="0" opacity="0"/></g><g><animateTransform attributeName="transform" type="translate" values="0 -32;0 -32;0 -0;0 -0;0 -32;0 -32" keyTimes="0.0000;0.2571;0.3571;0.6571;0.7429;1.0000" dur="14s" repeatCount="indefinite"/><polygon points="-220,640 407.2,640 410.4,643.2 410.4,659.2 -220,659.2" fill="#f2f2ee" stroke="#3a3f45" stroke-width="1.5"/><rect x="-220" y="659.2" width="630.4" height="51.2" fill="#b4bac1" stroke="#3a3f45" stroke-width="1.5"/><text x="228" y="675.2" class="s c">car deck: 6 mm UHMW on stainless</text><g><animateTransform attributeName="transform" type="translate" values="-51.2 0;-51.2 0;0 0;0 0;-224 0;-224 0;-275.2 0;-275.2 0" keyTimes="0.0000;0.1429;0.2429;0.3714;0.6429;0.7571;0.8286;1.0000" dur="14s" repeatCount="indefinite"/><rect x="375.2" y="192" width="12.8" height="358.4" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/><rect x="375.2" y="550.4" width="83.2" height="32" fill="#f28c28" stroke="#3a3f45" stroke-width="1.5"/><polygon points="447.2,582.4 460,582.4 453.6,608" fill="#b8580a" stroke="#3a3f45" stroke-width="1.5"/><rect x="381.6" y="524.8" width="19.2" height="16" fill="#3a3f45" stroke="none" stroke-width="0"/></g></g></g><text x="404.4" y="736" class="s r">3 mm gap, chamfered edges</text><text x="516" y="281.6" class="s">lid ≤ 6 mm on the flange</text><text x="484" y="384" class="s">box (GN 1/6-100), wall with draft</text><text x="61.6" y="140.8" class="s">toe arm: hangs from the cross slide</text><text x="61.6" y="158.8" class="s">under the car's overhead beam</text><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.3571" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="112.8" y="512" class="m b">toe + pin →</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3571;0.6429" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="112.8" y="512" class="m b">← pull</text></g><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.3714" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="573.6" y="524.8" class="s">rib with slot</text><line x1="567.2" y1="519.8" x2="458.4" y2="592" stroke="#555" stroke-width="1"/><circle cx="458.4" cy="592" r="2.5" fill="#555"/></g><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.3714" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="573.6" y="601.6" class="s">pad Ø 15 × 1.5</text><line x1="567.2" y1="596.6" x2="516" y2="636.8" stroke="#555" stroke-width="1"/><circle cx="516" cy="636.8" r="2.5" fill="#555"/></g><text x="100" y="787.2" class="m b">SHAFT (car)</text><text x="548" y="787.2" class="m b">LANE</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2786;0.6571" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="61.6" y="400" class="m b h">NFC tag read ✓</text></g><text x="890" y="112" class="s b">MAGNIFIED: pin, rib and slot (10 px/mm, same moment)</text><defs><clipPath id="mw"><rect x="880" y="124" width="690" height="300"/></clipPath></defs><rect x="880" y="124" width="690" height="300" fill="#f6f7f8" stroke="#3a3f45" stroke-width="2"/><g clip-path="url(#mw)"><rect x="1000" y="364" width="800" height="20" fill="#9aa1a8" stroke="#3a3f45" stroke-width="1.5"/><rect x="1000" y="384" width="800" height="60" fill="#d0d4d9" stroke="#3a3f45" stroke-width="1"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-700 0;-700 0" keyTimes="0.0000;0.3714;0.6429;1.0000" dur="14s" repeatCount="indefinite"/><polygon points="1130,349 3000,349 3000,329 1150,329 1136,64 1116,64" fill="#f5f0e1" stroke="#3a3f45" stroke-width="2"/><rect x="1200" y="349" width="150" height="15" fill="#7d858d" stroke="#3a3f45" stroke-width="1.2"/><polygon points="1080,244 1134,244 1134,204 1080,204" fill="#e9e2c8" stroke="#3a3f45" stroke-width="2"/><rect x="1090" y="204" width="30" height="40" fill="#ffffff" stroke="#3a3f45" stroke-width="1.5"/><rect x="1123" y="212" width="9" height="24" fill="#6b4c8a" stroke="none" stroke-width="0"/></g><g><animateTransform attributeName="transform" type="translate" values="0 -100;0 -100;0 -0;0 -0;0 -100;0 -100" keyTimes="0.0000;0.2571;0.3571;0.6571;0.7429;1.0000" dur="14s" repeatCount="indefinite"/><polygon points="600,364 960,364 970,374 970,424 600,424" fill="#f2f2ee" stroke="#3a3f45" stroke-width="1.5"/><g><animateTransform attributeName="transform" type="translate" values="-160 0;-160 0;0 0;0 0;-700 0;-700 0;-860 0;-860 0" keyTimes="0.0000;0.1429;0.2429;0.3714;0.6429;0.7571;0.8286;1.0000" dur="14s" repeatCount="indefinite"/><rect x="860" y="84" width="260" height="100" fill="#f28c28" stroke="#3a3f45" stroke-width="2"/><polygon points="1085,184 1125,184 1105,264" fill="#b8580a" stroke="#3a3f45" stroke-width="2"/></g></g></g><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.3857" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="1170" y="234" class="s">rib, 1 mm webs around the slot</text><text x="1170" y="251" class="s">purple: NFC tag in the rib</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3857;0.6429" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="1300" y="234" class="m b">← the pin pulls the rib</text></g><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.3857" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="1360" y="351" class="s">pad</text></g><text x="890" y="384" class="s">deck</text><text x="890" y="244" class="s b">toe ↑</text><text x="1010" y="409" class="s">shelf</text><text x="890" y="458" class="s b">IF THE PIN MISSES THE SLOT: seen from the shaft (5 px/mm)</text><rect x="880" y="470" width="690" height="230" fill="#f6f7f8" stroke="#3a3f45" stroke-width="2"/><rect x="925" y="655" width="600" height="10" fill="#9aa1a8" stroke="#3a3f45" stroke-width="1"/><rect x="950" y="505" width="550" height="142.5" fill="#f5f0e1" stroke="#9aa1a8" stroke-width="1"/><rect x="1125" y="575" width="200" height="20" fill="#e9e2c8" stroke="#3a3f45" stroke-width="1.5"/><rect x="1200" y="575" width="50" height="20" fill="#ffffff" stroke="#3a3f45" stroke-width="1.2" stroke-dasharray="4 3"/><text x="1225" y="633" class="s c">rib 40 mm, hidden slot 10 mm</text><g><animateTransform attributeName="transform" type="translate" values="35 0;35 0;20 0;20 0;35 0;35 0" keyTimes="0.0000;0.2786;0.3286;0.6214;0.6571;1.0000" dur="14s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 -100;0 -100;0 -80;0 -80;0 -100;0 -100;0 -50;0 -50;0 -100;0 -100" keyTimes="0.0000;0.0714;0.1429;0.2286;0.2714;0.3357;0.4000;0.5714;0.6143;1.0000" dur="14s" repeatCount="indefinite"/><polygon points="1215,615 1235,615 1225,655" fill="#b8580a" stroke="#3a3f45" stroke-width="1.5"/><rect x="1195" y="585" width="60" height="30" fill="#f28c28" stroke="#3a3f45" stroke-width="1.2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.1429;0.2286" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="1225" y="500" class="m c b" fill="#e04a3a">Z stops 6 mm early: following error = miss</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2286;0.3357" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="1225" y="500" class="m c b">retry: up, shift 3 mm in Y, down again</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.4000;0.5714" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="1225" y="500" class="m c b">in: the cone guides the pin into the slot ✓</text></g><text x="880" y="728" class="s">The only new box feature: a solid pull rib on both long sides (40 mm long,</text><text x="880" y="747" class="s">base + 12…16, 5 mm proud) with a vertical through-slot 10 × 5 that drains both</text><text x="880" y="766" class="s">ways and an NFC tag inside; 4 pads Ø 15 × 1.5 under the base. It stays inside</text><text x="880" y="785" class="s">the flange outline. Prototype: rib hot-plate-welded onto a bought GN box.</text><rect x="0" y="846" width="1600" height="54" fill="#f3f5f7" stroke="none" stroke-width="0"/><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0.0000;0.1429" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">1/5  The car stops 10 mm above the shelf. The toe is still inside the shaft.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.1429;0.2500" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">2/5  X moves the toe 13 mm into the lane: under the flange, above the rib. An IR sensor finds the rib.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.2500;0.3571" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">3/5  The whole car drops 10 mm: deck flush with the shelf, the pin goes down through the slot. No solenoid.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3571;0.6429" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">4/5  Pull (182 mm in total): the box slides on its 4 pads over the 3 mm gap onto the deck. Max. 15 N.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.6429;0.7571" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">5/5  To let go, the car rises 10 mm and the pin leaves the slot. Pushing out works the same way in reverse.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.0000;0.7571" dur="14s" calcMode="discrete" repeatCount="indefinite"/><text x="24" y="872" class="m b">Engage and release with the car's own Z motion: 3 motors for the whole column, nothing powered on the shelves.</text></g></svg>
